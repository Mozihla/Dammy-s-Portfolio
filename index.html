/* Layout: Figma frames are 1728×1117 with a 1435px content box at x=150.

   Tokens = the file's styles: Orange 01 #F24304, Orange 02 #F16001, Grey #777777, White, Black 02 #292929. */
:root{
  color-scheme: dark;
  --bg:#111111; --card:#171717; --chip:#191919; --row-line:#212121; --pill-line:#1d1d1d; --card-line:#575757; --rule:#2a2a2a; --black-02:#292929;

  --orange-01:#f24304; --orange-02:#f16001; --lilac:#cec3ff;

  --card-shadow:0 55px 42.7px 9px rgba(6,6,6,.34); --logo-filter:grayscale(1) brightness(1.4);
  --mono:"Söhne Mono","Test Söhne Mono","Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Helvetica Neue","Inter Tight",Helvetica,Arial,sans-serif;
  --box:1435px; --gutter:max(16px,calc((100vw - var(--box))/2));
}
/* Light mode: same layout, paper-white ground; orange stays the accent */
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f5f4f1; --card:#ffffff; --chip:#e8e6e2; --row-line:#e0ddd8; --pill-line:#dedad4; --card-line:#cdc9c2; --rule:#dad6cf; --black-02:#e4e1dc;
  --white:#141414; --ink:#2b2b2b; --ink-2:#4a4a4a; --grey:#6b6b6b;
  --panel:#ebe9e5; --panel-2:#e4e2dd; --lock-tint:#f6d9c6;
  --card-shadow:0 30px 40px -10px rgba(40,30,20,.12); --logo-filter:grayscale(1) brightness(.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;margin:0;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
p{margin:0}
:focus-visible{outline:1px solid var(--orange-02);outline-offset:3px;border-radius:4px}

/* Text styles */
.mono{font-family:var(--mono);font-weight:400;font-size:14px;line-height:1.035;letter-spacing:-0.04em}
.label{font-family:var(--mono);font-weight:400;font-size:14px;line-height:1.035;letter-spacing:-0.04em;color:var(--grey);text-transform:uppercase}

.wrap{width:100%;padding-inline:var(--gutter);padding-block:32px 0}
.page{max-width:var(--box);margin:0 auto;min-height:1085px;padding-bottom:96px}

/* ---------- Header (Normal | Back) ---------- */
.hdr{position:relative;height:80px}
.hdr::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(1176px,100%);height:1px;background:var(--pill-line)}

.chat{width:136px;height:32px;padding-left:32px;border-radius:16px;background:var(--orange-01);border:1px solid #909090;color:var(--on-accent);display:inline-flex;align-items:center;white-space:nowrap}

/* ---------- Hero + Component 1 ---------- */
.hero{margin-top:110px;margin-left:-2px;display:flex;flex-direction:column;gap:20px}

.rot.flip .track{transform:translateY(-71px)}

/* ---------- Main: Frame 73 + content ---------- */
.main{margin-top:160px;display:grid;grid-template-columns:198px 800px;justify-content:space-between;column-gap:24px;align-items:start}

.case .title{position:absolute;left:16px;top:42px;font-size:24px;line-height:1.2;letter-spacing:.01em;color:var(--ink);white-space:nowrap;transition:color .15s}

/* ===== Motion layer — studio-style interactions (Koto / Verve inspired) ===== */
:root{--ease-out:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.7,0,.2,1)}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}

/* Intro loader */
.intro-l{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:32px 40px;transition:transform 1s var(--ease-io)}
.intro-l .top{display:flex;justify-content:space-between;color:var(--grey);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.intro-l .mid{font-size:clamp(48px,9vw,140px);line-height:.95;letter-spacing:-.03em;color:var(--white);font-weight:400;overflow:hidden}
.intro-l .mid span{display:inline-block;transform:translateY(105%);animation:lup .9s var(--ease-out) .1s forwards}
.intro-l .mid em{font-style:normal;color:var(--orange-02)}
.intro-l .foot{display:flex;justify-content:space-between;align-items:flex-end}
.intro-l .lab{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
.intro-l .cnt{font-family:var(--mono);font-size:clamp(56px,9vw,128px);color:var(--orange-02);letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.intro-l .cnt i{font-style:normal;font-size:.4em;margin-left:.08em;vertical-align:top}
.intro-l .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--orange-02);transform:scaleX(0);transform-origin:0 50%}
.intro-l.out{transform:translateY(-100%)}
@keyframes lup{to{transform:none}}

/* Page transition curtain */
.curtain{position:fixed;inset:0;z-index:40;pointer-events:none;background:var(--orange-02);transform:translateY(100%)}
.curtain::after{content:"";position:absolute;inset:auto 0 0 0;height:100%;background:var(--bg);transform:translateY(100%)}
.curtain.cover{transform:translateY(0);transition:transform .55s var(--ease-io)}
.curtain.cover::after{transform:translateY(0);transition:transform .45s var(--ease-io) .12s}
.curtain.uncover{transform:translateY(-100%);transition:transform .7s var(--ease-io)}
.curtain.uncover::after{transform:translateY(0)}

/* Split-word reveal */
.sw{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em;margin-bottom:-.06em}
.sw>span{display:inline-block;transform:translateY(110%);transition:transform 1s var(--ease-out);transition-delay:calc(var(--wi,0) * 28ms + var(--d,0ms))}
.in .sw>span,.sw.in>span{transform:none}

/* Generic reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease-out),transform 1s var(--ease-out);transition-delay:calc(var(--i,0) * 55ms)}
.rv.in{opacity:1;transform:none}
.rvf{opacity:0;transition:opacity 1.1s var(--ease-out);transition-delay:calc(var(--i,0) * 55ms)}
.rvf.in{opacity:1}

/* Image clip reveal */
.cs-img{overflow:hidden;border-radius:20px}
.cs-img img{clip-path:inset(12% 0 0 0 round 20px);transform:scale(1.06);opacity:.001;transition:clip-path 1.2s var(--ease-out),transform 1.6s var(--ease-out),opacity .6s ease}
.cs-img.in img{clip-path:inset(0 0 0 0 round 20px);transform:none;opacity:1}

/* Reading progress */
.prog{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--orange-02);transform-origin:0 50%;transform:scaleX(0);z-index:30;pointer-events:none}

/* Custom cursor */
html.has-cur,html.has-cur a,html.has-cur button{cursor:none}
.cur{position:fixed;left:0;top:0;z-index:60;pointer-events:none;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--orange-02);transition:width .35s var(--ease-out),height .35s var(--ease-out),margin .35s var(--ease-out),background .3s,opacity .3s}
.cur .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;letter-spacing:-.02em;color:#fff;opacity:0;transition:opacity .2s;text-transform:uppercase}
.cur.link{width:40px;height:40px;margin:-20px 0 0 -20px;background:rgba(241,96,1,.18);backdrop-filter:blur(2px)}
.cur.view{width:88px;height:88px;margin:-44px 0 0 -44px;background:var(--orange-02)}
.cur.view .lbl{opacity:1}
.cur.hide{opacity:0}

/* Work hover preview (follows cursor) */
.pv{position:fixed;left:0;top:0;z-index:20;pointer-events:none;width:300px;aspect-ratio:16/10;margin:-95px 0 0 28px;border-radius:14px;overflow:hidden;background:#0f0f0f;opacity:0;transform:scale(.6) rotate(-4deg);transition:opacity .35s var(--ease-out),transform .55s var(--ease-out);box-shadow:0 30px 60px rgba(0,0,0,.5)}
.pv.on{opacity:1;transform:scale(1) rotate(0)}
.pv img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.15);transition:transform .8s var(--ease-out)}
.pv.on img{transform:none}

/* Work rows: line draw + title shift */
.case::before{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:var(--orange-02);transform:scaleX(0);transform-origin:100% 50%;transition:transform .6s var(--ease-out)}
.case:hover::before,.case:focus-visible::before{transform:scaleX(1);transform-origin:0 50%}
.case .title{transition:color .3s,transform .6s var(--ease-out)}
.case:hover .title{transform:translateX(10px)}
.case .go{position:absolute;right:14px;top:44px;color:var(--orange-02);opacity:0;transform:translate(-8px,8px);transition:opacity .3s,transform .5s var(--ease-out);font-size:18px}
.case:hover .go{opacity:1;transform:none}
.case{animation:none}

/* Link underline sweep */
.marker,.links a,.cs-toc a{position:relative}
.links a{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .5s var(--ease-out)}
.links a:hover{background-size:100% 1px}

/* Magnetic */
[data-mag]{transition:transform .5s var(--ease-out);will-change:transform}

/* Marquee */
.strip{mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.strip-track{animation:mq var(--dur,28s) linear infinite}
.strip.rev .strip-track{animation-direction:reverse}
.strip:hover .strip-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.logo-cell img{height:24px;width:auto;display:block;filter:var(--logo-filter);opacity:.8;transition:opacity .3s,filter .3s}
.logo-cell:hover img{filter:none;opacity:1}

/* Photos, accessories, tools */
.photos{margin-top:60px;display:flex;gap:12px}
.photos figure{margin:0;width:315px;max-width:calc(50% - 6px);aspect-ratio:315/396;border-radius:20px;overflow:hidden;background:var(--panel)}
.photos img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease-out)}
.photos figure:hover img{transform:scale(1.05)}
.photos figure:nth-child(2){transform:translateY(32px)}
.acc-img{width:523px;max-width:100%;display:block;transition:transform 1.2s var(--ease-out)}
.acc-img:hover{transform:scale(1.03) rotate(-1deg)}
.tool img{width:64px;height:64px;display:block;transition:transform .5s var(--ease-out)}
.tool.wide img{width:86px;height:32px}
.tool:hover img{transform:translateY(-6px) scale(1.08)}
.av.img{background-size:cover;background-position:center}

/* Testimonials (real quotes only) */
.tgrid.few{grid-template-columns:repeat(2,439px);grid-template-rows:auto;justify-content:start;gap:40px;row-gap:40px}
.tgrid.few .card{grid-row:auto;grid-column:auto}
.tcta{margin-top:56px;display:flex;align-items:center;gap:16px;color:var(--grey);font-family:var(--mono);font-size:14px;letter-spacing:-.04em;text-transform:uppercase}
.tcta a{color:var(--orange-02);text-decoration:underline;text-underline-offset:4px}

/* Next card + case header subtitle */
.nx img{transition:transform .8s var(--ease-out)}
.nx:hover img{transform:scale(1.08) rotate(-2deg)}
.cs-h .sub{margin:0;color:var(--ink-2);font-size:16px;line-height:1.5;letter-spacing:.03em;max-width:780px}

/* Rotator upgrade */
.rot .track{transition:transform 1s var(--ease-io)}

/* case-study video hero */

.cs-vid.in video{clip-path:inset(0 round 20px);transform:none;opacity:1}

/* ===== Lightbox ===== */
.lb{position:fixed;inset:0;z-index:45;background:rgba(10,10,10,.94);backdrop-filter:blur(8px);display:grid;grid-template-rows:64px 1fr 64px;opacity:0;transition:opacity .35s var(--ease-out)}

.hright .theme-t{position:static}
html.theme-anim,html.theme-anim *{transition:background-color .35s ease,color .35s ease,border-color .35s ease!important}
@media (max-width:760px){.theme-t{position:static;order:1;margin-left:auto}.hdr .hnav{order:2;flex-basis:100%}.hdr .logo{order:0}}

/* ===== Grid view v2: image card, project pills on the image, title + discipline pills below ===== */
.case .cats{display:contents}
.case .cats .cat{display:none}
.grid.gal{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 20px}
.gal .case{aspect-ratio:auto;height:auto;min-height:0;padding:0;border:0;border-radius:0;overflow:visible;display:flex;flex-direction:column;gap:14px}
.gal .case .th{position:relative;inset:auto;left:auto;top:auto;width:100%;height:auto;aspect-ratio:4/3;border-radius:16px;overflow:hidden}
.gal .case .th img{width:100%;height:100%;object-fit:cover}
.gal .case .tx{position:static;inset:auto;padding:0;background:none;border-radius:0;display:flex;flex-direction:row;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:auto;min-width:0}
.gal .case .meta{position:absolute;left:14px;top:14px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;font-size:13px;letter-spacing:-.02em;color:#111}
.gal .case .meta .dash{display:none}
.gal .case .meta span{background:rgba(255,255,255,.88);backdrop-filter:blur(6px);padding:6px 11px;border-radius:999px;line-height:1}
.gal .case .title{position:static;flex:1;min-width:0;font-size:22px;line-height:1.3;letter-spacing:-.01em;color:var(--white);white-space:normal;max-width:none}
.gal .case:hover .title{color:var(--orange-02);transform:none}
.gal .case .cats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;flex:none;max-width:55%;padding-top:2px}
.gal .case .cats .cat,.gal .case .cats .tag{display:inline-flex;align-items:center;position:static;inset:auto;margin:0;height:auto;width:auto;padding:6px 12px;border-radius:999px;border:1px solid var(--card-line);background:transparent;color:var(--ink);font-size:13px;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.gal .case .cats .tag.soon-tag,.gal .case .cats .tag.lock{color:var(--orange-02);border-color:currentColor}
.gal .case .cats .tag.aur{background:var(--orange-02);color:var(--on-accent);border-color:transparent}
.gal .case .th.ph b{font-size:40px}
.gal .case:hover .th img{transform:scale(1.04)}
@media (max-width:760px){
  .grid.gal{grid-template-columns:minmax(0,1fr);gap:32px}
  .gal .case{padding:0}
  .gal .case .tx{position:static;padding:0;flex-direction:column;gap:10px}
  .gal .case .title{font-size:18px}
  .gal .case .cats{justify-content:flex-start;max-width:none}
}

const CASES=[{"slug":"renmoney-loan-optimization","co":"Renmoney Microfinance bank","yr":"2024","site":"https://renmoney.com","title":"Loan flow Optimization","sub":"","toc":[["Context and Background",1],["Problem",3],["My Role",5],["Investigation & Enquiry",7],["Solution",9],["Validation & Results",13],["Reflection / Learnings",16],["Team Members",17]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Context and Background\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Renmoney MFB is one of Nigeria’s leading Microfinance Banks, with a strong presence in the consumer lending space. Known for pioneering non-collateralized loans, the company delivers financial access through digital channels, aiming to serve everyday Nigerians across varying socio-economic backgrounds.\n            </p></div></div>","l":"Context and Background"},{"t":"img","src":"media/cs/renmoney-loan-optimization-01.webp?v=cf2bccc7","w":1184,"h":544,"alt":"Easy and Seamless Finance","l":"Easy and Seamless Finance"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              A major funnel leak was putting our primary revenue stream at risk.\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">By Q2 2024, I noticed something wasn’t adding up in our loan application flow. Marketing spend had increased significantly, and we were seeing over 50% more users entering the funnel,  but conversions weren’t keeping pace.</p><p class=\"tw-leading-[1.5] tw-mb-0\">As I dug in with my team, we identified a key drop-off point: a 3-screen form where we collected most customer details. Drop-offs had spiked by 30%, and worse, over 23% of the users who made it to the Underwriter stage were submitting false or unverifiable information. This was breaking our risk model and making it harder (and more expensive) to lend responsibly.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">I led the initiative to investigate the root causes, align the team, and frame a design-led approach to fixing the leak. Improving conversion became mission-critical,  not just to optimize the user experience, but to help us stay on track with our quarterly and annual revenue targets.</p></div></div></div>","l":"Problem"},{"t":"img","src":"media/cs/renmoney-loan-optimization-02.webp?v=af5701c9","w":1894,"h":586,"alt":"get a loan Form (1) Form (2) Form (3) connect bank account Bank statement call up 200k 100% 198k 98% 170k 80% 150k 70% 100k 50% 88k 100%","l":"get a loan"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[661px]\">\n              Product Design | UX Research | Product Strategy | Interaction Design\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">As the Design Lead on this project, I was responsible for guiding the team through a high-stakes problem. My role extended beyond UI, I led the investigation into user behavior, interpreted data from our analytics tools, and worked closely with cross-functional stakeholders to define a clear, strategic path forward.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">This meant owning the end-to-end design process, from discovery through to solution delivery, and making sure our decisions aligned with both user needs and business goals. I collaborated closely with product managers, data scientists, business analysts, developers, and the head of digital lending to ensure we were solving the right problems, not just treating the symptoms.</p></div></div></div>","l":"My Role"},{"t":"img","src":"media/cs/renmoney-loan-optimization-03.webp?v=e222b9a0","w":1894,"h":808,"alt":"","l":""},{"t":"img","src":"media/cs/renmoney-loan-optimization-04.webp?v=978f9384","w":1894,"h":2140,"alt":"Investigation & Enquiry We didn’t just analyze the funnel, we decoded the full story behind the friction To get to the root of the problem, I led a hands-on investigation using both our behavioral analytics and visual session tools.  📈 I started with Mixpanel, reviewing the user funnels we had already built. This helped me pinpoint exactly where users were entering and exiting the flow. It gave us","l":"Investigation & Enquiry"},{"t":"img","src":"media/cs/renmoney-loan-optimization-05.webp?v=da646a6c","w":1894,"h":788,"alt":"","l":""},{"t":"img","src":"media/cs/renmoney-loan-optimization-06.webp?v=97bc361e","w":1894,"h":1400,"alt":"Solution From the insights we gathered, it was clear that solving the drop-off issue meant going beyond just redesigning a form, we had to rethink how we collected information altogether. My goal was to significantly reduce friction while still ensuring the data we collected was both reliable and useful for our risk models. ​ The key design principles I drove the team toward were speed, simplicity","l":"Solution"},{"t":"img","src":"media/cs/renmoney-loan-optimization-07.webp?v=5016c34e","w":1894,"h":948,"alt":"Old Designs","l":"Old Designs"},{"t":"img","src":"media/cs/renmoney-loan-optimization-08.webp?v=8e7691d2","w":1894,"h":948,"alt":"✨ new improved Designs","l":"✨ new improved Designs"},{"t":"img","src":"media/cs/renmoney-loan-optimization-09.webp?v=9abc0c5e","w":1894,"h":850,"alt":"✨ ANATOMY Pills displaying most popular request amounts so users can easily select , but they also can type the amount in manually Pills displaying most popular locations that we get users from, for easy selection but they also can select from the dropdown manually Asterisks to signify important fields Given that these are the fixed options for the Next of kin field, the pills made  it much easier","l":"✨ ANATOMY"},{"t":"img","src":"media/cs/renmoney-loan-optimization-10.webp?v=aa3a0243","w":1896,"h":1182,"alt":"Validation & Results The solution worked like Magic! The solution worked, and fast. But more importantly, it worked because we approached it from first principles and focused on the right tradeoffs. ​ As with any data-sensitive product, simplifying the form came with its own challenges. Some of the fields I flagged as redundant sparked early pushback from risk and compliance, but through a series ","l":"Validation & Results"},{"t":"img","src":"media/cs/renmoney-loan-optimization-11.webp?v=f72e3f41","w":1894,"h":808,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[20px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Strategic Wins\n            </p><div class=\"tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-relative tw-shrink-0\"><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">🚀 Business &amp; Product Impact</p><ul class=\"tw-block fh4 tw-leading-[0] tw-list-disc tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\">\n                  Recovered a critical funnel leak and stabilized conversion \n                  <span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">despite +50% traffic</span></li><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Reduced drop-offs by 70%</span>\n                   and \n                  <span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">increased conversion by 40%</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Improved data quality by 86%, leading to more viable lending decisions</span></li><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\">\n                  Cut form completion time \n                  <span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">from 12 mins → ~4 mins</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Strengthened risk model reliability by reducing falsified inputs</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Aligned product, risk, and growth teams on high-impact tradeoffs</span></li></ul></div><div class=\"tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-relative tw-shrink-0\"><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">⚙️ Design &amp; System Innovation</p><ul class=\"tw-block fh4 tw-leading-[0] tw-list-disc tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\">\n                  Reframed the problem from form redesign → \n                  <span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">data collection system redesign</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Reduced cognitive load through field audits, automation, and progressive disclosure</span></li><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\">\n                  Replaced manual inputs with \n                  <span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">structured selection systems</span>\n                   for speed and accuracy\n                </li><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\">\n                  Designed \n                  <span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">mobile-first interactions</span>\n                   tailored to real user behavior\n                </li><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\">\n                  Built a \n                  <span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">resilient UX system </span>with inline validation and smart error handling\n                </li><li class=\"tw-leading-[1.5] tw-ms-[24px]\">\n                  Established a scalable principle: \n                  <span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Speed + Simplicity + Verification</span></li></ul></div></div></div>","l":"Strategic Wins"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">One of my biggest takeaways from this project came while testing and presenting the solution internally. I realized just how nuanced user feedback can be. Because users are human- emotional, distracted, often uncertain, what they say they want doesn’t always reflect what they actually need. That doesn’t make their input any less valuable, but it reminded me that qualitative insights should always be grounded in behavioral data.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5] tw-mb-0\">On the other hand, data tells a different story. It doesn’t flinch, and it doesn’t lie. It can expose deeper friction points and behavioral patterns that even users aren’t consciously aware of. That understanding shaped every decision I made throughout this redesign, from what we simplified, to how we guided users, to how we validated inputs.</p><p class=\"tw-leading-[1.5] tw-mb-0\">What truly tied it all together was the role of smart, empathetic error handling. I learned how critical it is to use micro-moments, like an inline error message- as teaching points. These moments act as training wheels for users navigating a data-informed experience. Done well, they don’t just prevent mistakes, they empower users to succeed.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p><span class=\"tw-leading-[1.5]\">\n                  This project reinforced something I now carry into every product challenge:\n                  <br></span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Great UX isn’t just clean UI, it’s how data, design, and human behavior meet in the flow.</span></p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Damilola Olayiwola - Design Lead</p><p class=\"tw-leading-[1.5] tw-mb-0\">Anthony Alebiosu - Business Analyst</p><p class=\"tw-leading-[1.5]\">\n                Jeremiah Agbami - Flutter Dev\n                <br>\n                Joy - Product Manager\n                <br>\n                Gbolahan - Decision Science\n              </p></div></div></div>","l":"team members"}],"thumb":"data:image/webp;base64,UklGRiQXAABXRUJQVlA4IBgXAABQUQCdASq+AL4APpE8mEiloyIhLLj6kLASCWRu4D35Id/8lvsjh+uB+s8+q3/6LyReZUijr4yYeov85+wB+rPSu/cb1EfsV+6nvSf671P/4z1AP69/tesO9ADy2/ZQ/tP/c/db4DP2V/++F58c/yvhn5L/hkrBwz1Kfmn5S/eeaneX8SdQL2N/qvFh2eOyf6L/teoF63fU/+N/dfWimR5Af6tf9LjhPTvYA/UHq0f4f/y8zf1N7Bv84/wO+hICd5T80qeygY2hrn//9UVCUjDqaB7goNtr87+tPVSLvMjf6ECjb/61tJxSbG+QigKbrLkAvZX5ufSkaDg73ZvowKBG/NCtRUjtehla1RUFPcdeKKhmTAgT1tqpWAh4bPJkzI site, UX Audit, Product Strategy\n            </p></div></div>","l":"MY ROLE"},{"t":"img","src":"media/cs/renmoney-product-revamp-2-02.webp?v=71e304a3","w":1896,"h":836,"alt":"Context and Background Renmoney is one of Nigeria's leading microfinance banks, offering lending, high-yield savings, and automated wealth-building tools. But as the product grew into a full financial ecosystem, the experience hadn't kept up. Most users still saw Renmoney as a loan app, and the interface wasn't guiding them toward anything else. I led the optimization of the core app experience to","l":"Context and Background"},{"t":"img","src":"media/cs/renmoney-product-revamp-2-03.webp?v=f2c88239","w":1658,"h":861,"alt":"","l":""},{"t":"img","src":"media/cs/renmoney-product-revamp-2-04.webp?v=f57faebb","w":1894,"h":1368,"alt":"challenge Renmoney needed to grow, but most users only ever saw one thing it could do. The business had clear targets: more active users and more engagement across savings, wealth products, and loans. But 73% of negative feedback pointed to navigation confusion, not technical errors. Most users had no idea Renmoney offered anything beyond loans, and the interface wasn't built to guide them there. ","l":"challenge"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              What we found\n            </p><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[887px]\">Users weren't ignoring what Renmoney could do. The interface just wasn't showing them.</p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">We dug into thousands of support logs and found the same pattern everywhere: users weren't finding savings, wealth tools, or goal features because the architecture wasn't surfacing them. Engagement outside lending stayed flat. The fix wasn't new features. It was restructuring the experience so users could find what was already there.</p></div></div>","l":"What we found"},{"t":"img","src":"media/cs/renmoney-product-revamp-2-05.webp?v=9794cc82","w":1894,"h":954,"alt":"","l":""},{"t":"img","src":"media/cs/renmoney-product-revamp-2-06.webp?v=49385d22","w":1539,"h":3252,"alt":"Core flows A quick look at the redesigned experience. The home screen Everything a user needs, one tap away, organized so the whole product is visible at a glance. Applying for a loan A streamlined application with a credit decision in as little as 10 minutes. Starting a savings goal Setting up a goal and watching it grow, made simple and visual. The Renmoney widget Key actions available straight ","l":"Core flows"},{"t":"img","src":"media/cs/renmoney-product-revamp-2-07.webp?v=5be296f7","w":1539,"h":2552,"alt":"Loan optimization Only 11% of people who started a loan finished it. We rebuilt the journey and nearly doubled that. Lending is Renmoney's core, so the loan funnel was the highest-leverage flow to fix. We looked at where applicants dropped off and rebuilt the journey step by step The wait was killing conversion Applicants faced a slow, uncertain wait for a decision, with no sense of whether they'd","l":"Loan optimization"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Savings optimization\n            </p><p class=\"fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[887px]\">Renmoney's savings products were strong, but the experience made them hard to start and track</p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">The savings dashboard didn't distinguish between products or show progress, so users had little reason to engage. We rebuilt it around clear, goal-based visuals, made returns transparent, and gave each product a distinct identity, so starting a goal and watching it grow felt simple and motivating.</p></div></div>","l":"Savings optimization"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Onboarding\n            </p><p class=\"fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[887px]\">\n              Getting started took too long, and users bounced before they began.\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              The old onboarding was slow and asked for too much upfront. We streamlined it with passwordless login and phone-number sign-in, cutting the time to get started from 20 seconds to 10 and making the very first interaction effortless.\n            </p></div></div>","l":"Onboarding"},{"t":"img","src":"media/cs/renmoney-product-revamp-2-08.webp?v=7acc7d3f","w":1894,"h":716,"alt":"Iterating with insights Key finding: users were dropping off at the bank statement upload step. After launch, session data showed a clear stall point in the loan application: uploading a bank statement. Users had to leave the app, find the document, and come back, and many didn't. A step meant to verify them was quietly costing conversions. Drop off point We removed the manual work. Instead of upl","l":"Iterating with insights"},{"t":"img","src":"media/cs/renmoney-product-revamp-2-09.webp?v=f312374d","w":1896,"h":1096,"alt":"Validation & Results The optimized experience drove growth across the board. Within the first few weeks of launch, we observed a significant reduction in monthly support tickets related to basic navigation. Our redesigned FAQ nodes and self-help articles led to 52% of users resolving their issues via self-service, freeing our support team to handle higher-priority technical triages. Business perfo","l":"Validation & Results"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              What I took away\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[0px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh5 tw-leading-[1.5] tw-text-[20px] tw-tracking-[-0.2px]\">Growth is a design problem:</span><span class=\"tw-leading-[1.5] tw-text-[16px]\"><br>\n                The biggest gains didn't come from new features. They came from helping users find what the app already did. When the experience started guiding people instead of just functioning, the business moved.\n              </span></p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[0px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh5 tw-leading-[1.5] tw-text-[20px] tw-tracking-[-0.2px]\">The real signal comes after launch:</span><span class=\"tw-leading-[1.5] tw-text-[16px]\"><br>\n                Shipping was the start. Watching real people use the flows, like seeing them stall at the bank statement step, is what pointed to the changes that actually mattered. Optimization is a loop, not a finish line.\n              </span></p></div></div>","l":"reflection / Learnings"}],"thumb":"data:image/webp;base64,UklGRtICAABXRUJQVlA4IMYCAAAQFACdASq+AL4APpFIokylpCMiITmYOLASCWdu4Xaw6sCvlvKsZAbcnxAOor5AHWAegB+gHWkuBCdAlTszjyGh36YaUm/YKsqDCOibxN+T06jTUwGNEXhOq6/2FEBKqu1i0Lr3SO6MAuDZqOK+1NkdnDdT9VJJDoWakttMuoQY6wAVZFtplvVBoTAFWRbaZb1QaEwBVkW2mW9UGhMAVZFtpo9OF9WfoaQ4AP7/SdH//ksgdfvey3Gf//zBmPYJfwRzMY/a7ToHOnPzBn8zTUUIiZbM8qUSPTG6pa5f0xEZAAQzo5Hl3muVXagjACuCuXAoXniB7kBKHcR+1P44czuasrKphGl2CLSbzM2qG2p86K+/5fVd5nOZl9FvfBCxerYzRZ7GktJKORDLpVfd0iI3biEughbTmkchyq/lea8XVI3iy4azn+Ne49FJt9lXrpJ9tsjjF8KR6xaYzavrs1rHKddzT9o4hpbafzzh3Oh8svJU4212UdTXGc5thXouRgW1SSdDUu8Gb3Jucx3CoRekPxebeZUjSbXoH9TbG0FAyoLvME+XlQg6tM9+Pd63rHdP0PDfezlbJ6zMANlubtIby7x5bKgCszianFIeFPCOHFZ9eEJ1o2plhNo5ClrOzZQmj0GVw5Us4R5Zt7ivHm0I3h0G4tbqEpQBlFu+cc0OWc1Ln/lBGIcq3E224i5IsSo+CEFLmYWJ9jMkMLEJUIMrcH8+iEL0NBr6XIGzlS9cIwPiZ2nBUBZELGc0QJmK5rmxndsMu63bahZffqAI11HqDTx7c/UeUrala+HoeEA1y+tNSJ78Y0UxfLvmMciBeoOMyOnm5selRLZaecu18oMzKWBoLuR2uPrNN5tSQGFWgu5YskOzK4fSE665jxlDIz4Pk2Z3DBEAAAAAAADT40Ecmlt6gOy3Uu955muEm26l3vPM1weIAA==","cover":"data:image/webp;base64,UklGRjAKAABXRUJQVlA4ICQKAACwTwCdASowAjMBPpVKoE0lo6MiIZSIKLASiWdu4XaxDMQG0EdT/Kr2d7C/iP6Tx9NUeVd49+ledj9jvYB+gPYA/WHpWeYD9g/VV/1X6we6/9j/YA/mX+P6yz0OP2Z9N/90fhL/eT01dWB8h/3jtU5K/2t5hnR3bvvbvAn4zptDgKBEVm t-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Context and Background\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">PressOne Africa is one of the few platforms pioneering voice-tech and business phone systems for SMEs across Nigeria. As adoption scaled, one thing became clear, support requests were piling up, and most of them weren’t even technical.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">I was brought in under a contractual agreement to figure this out,  and design something that could solve the root issue. What we needed wasn’t just a help center, it was a full community and documentation platform. A space where users could find answers quickly, help themselves, or just ask real questions when they were stuck. My job? Make it intuitive, make it structured, and make it feel familiar.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"media/cs/pressone-community-platform-01.webp?v=2b1ab89c","w":1894,"h":870,"alt":"Smarter & Scalable Business Calls","l":"Smarter & Scalable Business Calls"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              It Wasn’t Confusion. It Was a Confidence Gap.\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">\n                As the platform grew, so did the diversity of users we were onboarding. Our earlier clients were mostly teams already familiar with business phone systems; sales orgs, multi-line operators, companies with internal tech support. But with expansion came a new wave of users: business owners and team members with little to no experience using SaaS tools.\n                <br><br></p><p class=\"tw-leading-[1.5] tw-mb-0\">\n                They weren’t struggling with bugs,  they just didn’t know where to begin. What did “assigning a number” mean? What was “call routing”? What button did what? These weren’t complex technical issues, they were glossary gaps, onboarding frictions, and confidence blockers.\n                <br><br></p><p class=\"tw-leading-[1.5] tw-mb-0\">\n                Without a central place to search, explore, or get quick help, users had no choice but to raise tickets. Support volume went up. Resolution times slowed down. And most of the effort went toward answering questions that could’ve been addressed with the right self-service system.\n                <br><br></p><p class=\"tw-leading-[1.5]\">We needed something simple, structured, and familiar, a platform that could meet users where they were and grow with them.</p></div></div></div>","l":"Problem"},{"t":"img","src":"media/cs/pressone-community-platform-02.webp?v=37b08e7d","w":1894,"h":842,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">\n              Product Design | UX Research | Product Design | UX Strategy | Information Architecture | Developer Management | Interaction Design\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              I led the entire initiative end-to-end. From framing the core problem and defining the user flows, to designing the high-fidelity experience and guiding the implementation. My role also included managing the developer and ensuring the final product shipped with the intended UX integrity.\n            </p></div></div>","l":"My Role"},{"t":"img","src":"media/cs/pressone-community-platform-03.webp?v=bfd74895","w":1894,"h":1848,"alt":"Investigation & Enquiry We didn’t just analyze the funnel, we decoded the full story behind the friction Using our platform tracking tools  Metabase  and our support bucket on  MakePlane,  I reviewed past support logs, sat in on internal triage conversations, and mapped the common questions we were getting week over week. ​ 62% of tickets weren’t tied to errors or bugs, they were  basic how-to’ s,","l":"Investigation & Enquiry"},{"t":"img","src":"media/cs/pressone-community-platform-04.webp?v=58c0397c","w":1894,"h":1480,"alt":"Solution My goal was to make this platform feel instantly familiar almost invisible in its design, so users could focus entirely on their issue, not on how to use the help platform. Here’s what I implemented: USER FLOW","l":"Solution"},{"t":"img","src":"media/cs/pressone-community-platform-05.webp?v=08934026","w":1894,"h":850,"alt":"🔍 A Search-First Landing Page","l":"🔍 A Search-First Landing Page"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] fh4 tw-leading-[0] tw-not-italic tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"fh7 tw-leading-[1.5] tw-mb-0\">🔍 A Search-First Landing Page</p><p><span class=\"tw-leading-[1.5]\">Inspired by Google and Bing, I designed the homepage to function like a search engine. This created immediate familiarity and trust,  reducing friction and encouraging users to type in their issues naturally. This draws from the</span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\"> Jakob’s Law of U</span><span class=\"tw-leading-[1.5]\">X: users prefer interfaces that feel familiar to ones that are “new but better.”</span></p></div></div>","l":"🔍 A Search-First Landing Page"},{"t":"img","src":"media/cs/pressone-community-platform-06.webp?v=6716d755","w":1894,"h":850,"alt":"🧠 Smart Content Categorization","l":"🧠 Smart Content Categorization"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] fh4 tw-leading-[0] tw-not-italic tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"fh7 tw-leading-[1.5] tw-mb-0\">🧠 Smart Content Categorization</p><p class=\"tw-leading-[1.5]\">I reorganized all content by product features and functions, giving users a mental map of the product as they browsed. Whether you were troubleshooting voicemail, team management, or call analytics, you could instantly navigate to the right domain.</p></div></div>","l":"🧠 Smart Content Categorization"},{"t":"img","src":"media/cs/pressone-community-platform-07.webp?v=0c91f657","w":1894,"h":850,"alt":"🧩 Accessibility Nodes within Articles 01  within page 02  within glossary","l":"🧩 Accessibility Nodes within Articles"},{"t":"img","src":"media/cs/pressone-community-platform-08.webp?v=ceaae68e","w":1894,"h":850,"alt":"🧩 Accessibility Nodes within Articles 01  within glossary","l":"🧩 Accessibility Nodes within Articles"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] fh4 tw-leading-[0] tw-not-italic tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">🧩 Accessibility Nodes within Articles</p><p class=\"tw-leading-[1.5]\">Each article wasn’t just a blob of text. I introduced segment-based “nodes” inside every guide — allowing users to jump straight to the part that mattered to them. This made long-form content feel digestible, and it gave returning users an easy way to skip to what they needed.</p></div></div>","l":"🧩 Accessibility Nodes within Articles"},{"t":"img","src":"media/cs/pressone-community-platform-09.webp?v=a4ba7196","w":1894,"h":850,"alt":"🎥 Multi-Format Content Support web view Mobile View","l":"🎥 Multi-Format Content Support"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] fh4 tw-leading-[0] tw-not-italic tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"fh7 tw-leading-[1.5] tw-mb-0\">🎥 Multi-Format Content Support</p><p class=\"tw-leading-[1.5]\">Since we had a range of resources, from videos and audio snippets to screenshots and written guides — I created a categorized results experience inspired by Google’s filter tabs (All, Videos, Articles, etc.). This way, users could choose the type of guidance that worked best for them.</p></div></div>","l":"🎥 Multi-Format Content Support"},{"t":"img","src":"media/cs/pressone-community-platform-10.webp?v=ceadf7f7","w":1894,"h":850,"alt":"🤝 Community Forum Integration","l":"🤝 Community Forum Integration"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] fh4 tw-leading-[0] tw-not-italic tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"fh7 tw-leading-[1.5] tw-mb-0\">🤝 Community Forum Integration</p><p class=\"tw-leading-[1.5]\">On the other side of the platform, I integrated a community discussion space — where users could post questions, respond to each other, and raise issues the documentation hadn’t yet covered. This turned the platform into a living, breathing support ecosystem.</p></div></div>","l":"🤝 Community Forum Integration"},{"t":"img","src":"media/cs/pressone-community-platform-11.webp?v=c71d54bb","w":1896,"h":720,"alt":"Validation & Results Support Load Down. User Confidence Up. While full long-term data is still being collected, here’s what we observed within the first 8 weeks of launch: Support team freed up to handle only high-priority and technical issues 52% of users now resolve their issues via self-service content 41% reduction in  monthly support tickets 35% DROP  IN AVG TIME TO RESULUTION  FOR COMMON ISS","l":"Validation & Results"},{"t":"img","src":"media/cs/pressone-community-platform-12.webp?v=0c91f657","w":1894,"h":850,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              We Didn’t Just Design a Platform — We Designed Confidence\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">This project was a reminder that your users change, and your experience has to change with them.</p><p class=\"tw-leading-[1.5] tw-mb-0\">The product was solid. But as we started onboarding users with less exposure to SaaS tools, it became clear they needed more than features, they needed language, structure, and a space to grow their confidence.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5] tw-mb-0\">Designing a search-first interface rooted in patterns people already understood wasn’t just UX flair, it was about building trust. Organizing content by product functions helped people make sense of the system. Adding segmented articles, accessible media formats, and community threads made the platform feel like a guide, not just a wiki.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5] tw-mb-0\">And above all, this wasn’t just about design thinking. It was about execution. I managed implementation, worked directly with the developer, and made sure we shipped something that reflected both the product and the people using it.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">We helped reduce support volume, yes, but more importantly, we made the experience feel less intimidating for people who weren’t born into software. That’s what I’m most proud of.</p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Damilola Olayiwola - Lead Product Designer</p><p class=\"tw-leading-[1.5] tw-mb-0\">Zainab - Web Developer</p><p class=\"tw-leading-[1.5]\">\n                Folashade - Head of Customer Experience\n                <br>\n                Saviour - Product Designer\n                <br>\n                Utomobong - Product Manager\n                <br>\n                Mayowa - CEO\n              </p></div></div></div>","l":"team members"}],"thumb":"data:image/webp;base64,UklGRhIMAABXRUJQVlA4IAYMAAAQPACdASq+AL4APpE+mkelo6KhLLWcCLASCWMnABUTQZwj3/kDwx9vV5l/OJ9Jfkzda16AHlz+0JX2v7fxP6+M0M4/4becHgHtZ/5D0Q4ZvFj6v9gPOG+if7Djq01ugJ+g/SB0dqi6B0x7RGesVe/jN7Mf2c+16N3j4Y/qjH1eK1iP6GZxK/Rzsjsrr8w5WC6330JfyBoZ7O3W5BehMM5ZS7B1+LsX+1tkRFv5xrghiasiA7UMWQNXjQEe6iggjy7b0L+sZvfWKhhHeHq+jjzsv6GnL5IaiNCwTv+Wd4GW3YTODDfd2ixsRggD0QKp0+fY936u5K7MdSL87gFsdcwhqvqOUjtdGQfVIuiHmpt1QaEuVsEDlLEyGtRQCbvhjnCGSEIYoN0x/fqI0sITAjsWhUxZzEeQ/OTkiNO1Barood7dp59/yNo9/O909gcMuRQTbtfxnbkSZlYL3/fB9MIQUbqNpVUfotyYZMde52muOimZHz/rwpe+DY7WSF12d/nWMceLJfkTE6Duu4WNOrj0Aw2ZSwMmXv18buKrEcJz1oybQsfAE/cOxFjYHBgF0p9Tmc4tKblE8NGslL699K/MpaAj9VUyK79hgR7pUIOABuEi3WmcOP0jwTfEQVkN/ILLdkE91RdwkoAA/vrPP+cbLXBgrZeP0jYC/0FjeZXxZ5URC/nNRD03nbURjAga8+x63edUEN0F1POo+I3+cs7tLSmUGximiQ61Ok5Gi6ZtY1M5iPGAfnSC3ayrHCEv3gF0EnE/k7X0PISA7+cA0La/1f4tmQR7Vbs3/7tpYgi0481wcW7R2vrAVR2k6g7qCZrqxHIAlf8P/q5uHO/+Zv+4vfnOyprWmC9X+VcmMOlVmoANK1/ZQe1geY8dvc8Yy17z44apwuHvkTxf7lKjZw3CeOiox+iq2gd2W/zCtGqThQTznRT+1kznmPmFMudUr9VcsFft7aPfKnKJDgrv79pKE3JsGyMU9RDJ/8InQTnEO7+3v8zEal/ZrqnYFNaotUddu+/5tOZJ9VCZrnar2a7p9MVuQbsKskAMv5GEO1Fy7X+/3ea9YsnipFNUnCL8iR7YAPN6Sg9urw31WckhfnJkhhXALerQvArzghyYw67tb9Pq4T+u/M6WqAhezb5JjqzGOi23X0mCxh1QrrOUBuP5aAtHHfD8Hv7TOu1RLB06sCXFvDzfC \">\n              Context and Background\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\">\n              Reimagining how businesses start their journey on PressOne, by reducing drop-offs, surfacing buyer intent, and humanizing a pay-to-start SaaS funnel.\n              <br><br>\n              PressOne Africa, a B2B telephony SaaS platform, was seeing heavy drop-offs during onboarding. Despite strong initial signups, many users never completed number setup, activated a workspace, or proceeded to payment. The experience lacked personalization, fluidity, and a sense of immediate value. I was contracted to rethink and redesign the onboarding flow with a focus on role-specific guidance, lower friction, and better alignment with business goals.\n            </p></div></div>","l":"Context and Background"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Onboarding Was Hitting a Wall at Payment\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">Despite strong top-of-funnel performance, PressOne Africa’s onboarding funnel was leaking where it mattered most: payment.</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">Over 61% of users who initiated onboarding dropped off before completing the required phone number purchase — a critical step needed to activate the product. Internal data showed that:</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><ul class=\"tw-list-disc tw-mb-0\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Nearly 45% of users stalled at or before the invoice/payment screen</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Only 28% of sign-ups ever activated a number</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">60%+ of drop-offs were from users who didn’t complete number setup</span></li></ul><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">The onboarding flow failed to account for the user’s context — their role in the company, their authority to make payments, or even their intent. This lack of personalization created unnecessary friction for decision-makers and total confusion for others.</p><p class=\"tw-leading-[1.5] tw-whitespace-pre-wrap\">Without intelligent routing, fallback strategies, or adaptive messaging, the experience treated all users the same — and in doing so, lost too many of them.</p></div></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Helping Users Start Strong and Stick Around\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Design an onboarding experience that reduces drop-offs, especially at the payment stage, and aligns more closely with the realities of B2B decision-making. The goal was to increase activation rates by understanding who the user is, what their role is, and how to better guide them through the setup and number purchase journey.\n            </p></div></div>","l":"Objective"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">\n              Product Design | UX Research | Product Design | UX Strategy | Information Architecture | tracking | Interaction Design\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              As the Lead Product Designer on this project, I was responsible for reimagining the onboarding flow to reduce payment-related drop-offs and improve user activation. I worked cross-functionally with product, engineering, and business teams to understand user behavior, uncover friction points, and design a more adaptive and intuitive experience. My work spanned research, flow architecture, interaction design, and implementation support.\n            </p></div></div>","l":"My Role"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">Investigation &amp; Enquiry</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Before jumping into design, I collaborated with the team to audit the existing onboarding flow and understand where and why users were dropping off. We analyzed user behavior data using Metabase, the company’s internal metrics tool, and combined those insights with session replays and internal interviews.</p><p class=\"tw-leading-[1.5] tw-mb-0\">To go even deeper, I partnered with the PM to personally conduct user interviews, hopping on direct calls with users who had dropped off during onboarding. We listened to their frustrations, uncovered intent gaps, and gathered first-hand insight into what was blocking conversion.</p><p class=\"tw-leading-[1.5] tw-mb-0\">We also mapped out typical onboarding paths and identified decision-making bottlenecks. This helped us uncover key questions: Who’s actually signing up? Do they have the authority to pay? At what points do they hesitate or abandon the process?</p><p class=\"tw-leading-[1.5]\">These learnings formed the foundation of our redesign strategy.</p></div></div></div>","l":"Investigation & Enquiry"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              the goals\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Make Onboarding Smarter, Softer, and More Human\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">It wasn’t just about reducing friction—it was about designing trust.</p><p class=\"tw-leading-[1.5] tw-mb-0\">We wanted to create an onboarding flow that felt tailored, helpful, and aligned with real user behavior—especially in a market where payments and business tools come with high stakes and skepticism.</p><ul class=\"tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Reduce onboarding abandonment</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Collect cleaner user segmentation for smarter follow-up</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Drive successful setup of phone numbers and call flows</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Build trust and value before asking for payment</span></li></ul></div></div></div>","l":"the goals"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              The Strategy\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Ground Up, First Principles, Role-Aware\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">We redesigned onboarding like a conversation, not a funnel.</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">We started with a full journey audit and mapped user intent to product value. With insights from business, support, and data, we introduced segmentation, guidance, and subtle nudges at each critical point.</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><ul class=\"tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Mapped users by role (admin, staff, business owner) to tailor flow</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Introduced industry and team size capture early on</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Implemented drop-off detection + modals with redirect options</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Streamlined the number tagging and workspace activation flows</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Used smart, context-aware CTAs to guide users progressively</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Reimagined exit-intent on invoice screens to recover lost interest</span></li></ul></div></div></div>","l":"The Strategy"},{"t":"img","src":"media/cs/pressone-payment-exit-flows-01.webp?v=57272f0b","w":1894,"h":2446,"alt":"Solution ~  Key Features We Weren’t Just Designing UI, We Were Nudging Behavior This wasn’t about adding polish — it was about shifting momentum. Every screen, button, and micro-interaction was designed to guide users through hesitation, reduce friction, and build trust. We treated onboarding like a conversation, not a checklist — meeting users with the right message, tone, and action at every cri","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-relative tw-shrink-0\"><p class=\"tw-[word-break:break-word] fm4 tw-leading-[1.035] tw-min-w-full tw-not-italic tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"media/cs/pressone-payment-exit-flows-02.webp?v=998feacd","w":1894,"h":850,"alt":"Role-based segmentation: Onboarding asks change based on who’s signing up","l":"Role-based segmentation: Onboarding asks change based on who’s signing up"},{"t":"img","src":"media/cs/pressone-payment-exit-flows-03.webp?v=5d039784","w":1900,"h":922,"alt":"Validation & Results Its sticky and shareable We turned onboarding into a signal, not a black hole. Initial testing and live rollout results have been promising—and they’ve validated our bet on personalization and clarity. -38% reduction in drop-off  during number setup +28% complete onboardings with activated numbers +15% payment completion rise in payment completion rates during onboarding 3x re","l":"Validation & Results"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Onboarding is a Narrative, Not a Checklist\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">We stopped thinking like product people—and started thinking like storytellers.</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">This project reminded us that onboarding is where users decide: “Do I belong here? Does this make sense for me? Do I trust this platform to solve my problem?”</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><ul class=\"tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Role-awareness builds immediate trust and relevance</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Personalised CTAs outperform static ones by a wide margin</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Visual clarity (steps, groupings, whitespace) reduces cognitive fatigue</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Giving users the chance to pause, defer, or reroute often leads to better long-term conversion</span></li></ul></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              What looks like \"just a better onboarding\" was actually an alignment of product, people, and purpose.\n              <br>\n              This is the kind of design I believe in, where flows become stories, CTAs become nudges, and users feel seen from the very first click.\n            </p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Damilola Olayiwola - Product Designer</p><p class=\"tw-leading-[1.5] tw-mb-0\">Zainab - Developer</p><p class=\"tw-leading-[1.5]\">\n                Mayowa - CEO\n                <br>\n                Folashade - Head of Customer Experience\n                <br>\n                Saviour - Product Designer\n                <br>\n                Utomobong - Product Manager\n              </p></div></div></div>","l":"team members"}],"thumb":"data:image/webp;base64,UklGRowKAABXRUJQVlA4IIAKAABwNACdASq+AL4APpFAm0qlo6MhphHMGLASCWdu8WWcOdpTcD0vD+q6ynKZoD+webPQAeMB1AN4o9ADyy/ZK/yeTA+fP7T21d99fyWv3r/IKX7sddb/2HoEe0/2bid0t2gB4xui7UP6YoX+sGiuebatm18WXQwVUb6AKgXuGS3VgI7Gvb+JFly6ZhAQxOiZ3KogIJd3vBab+Q9B8u6USwlB08PbPPPw/3EDYzSDjfSHLivNdzvBXpXXfNgxBn/7npF62tz3n4jTHZdnx5tQ6CA0avRFbsEETunZPZ5mXMUHjAjlnJ/pEToCQMrqlQGm2JFSfe2Y75N/B7drpcoUpVCQLP8BmpfUsWnh5slr67OLx7FC41FDuUtLIkV5pRE+S5AVlAwquXJflqyvBNCDbQIb/rQ32F3p8H26koy10zqAgnoZz0SS1pzwXzoDN21irwsYkBLiJQOVddeo9yqknI4TxpDMXlopQNyrz5GH5GOQceuSPGRKe/LLCMWctRRqek5v2gjYOJT8IXHfV2viY7wtQmLKziPIeTkxtBzb4sErIqvJdJQLnBK0sdcg
