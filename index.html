(()=>{const V3=[{"slug":"renmoney-product-revamp-2","co":"Renmoney MFB","yr":"2024","site":"https://renmoney.com","title":"Growing Renmoney's monthly active users by 77%","sub":"Optimizing the core app experience, from loans to savings to everyday banking, for one of Nigeria's leading digital banks.","toc":[["Context and Background",3],["Challenge",5],["What we found",6],["Core flows",8],["Loan optimization",10],["Savings optimization",17],["Onboarding",19],["Iterating with insights",21],["Validation & Results",24],["Reflection / Learnings",25],["Team Members",26]],"secs":[{"t":"hr"},{"t":"img","src":"media/cs/renmoney-product-revamp-2-v3-01.webp?v=b0649b9c","w":1894,"h":1040,"alt":"Renmoney Microfinance Bank","l":""},{"t":"html","h":"<div class=\"fx-meta\"><div><p class=\"fx-l\">My role</p><p>Lead Product Designer</p></div><div><p class=\"fx-l\">Timeline</p><p>2022-2023</p></div><div><p class=\"fx-l\">Team</p><p>Product Managers, Project Managers, Front-end and Back-end Engineers, Solutions Architects, Growth Marketers, Business Analysts</p></div><div><p class=\"fx-l\">Deliverables</p><p>Product Design Strategy, Product Design, Information Architecture, UX Strategist, UX Audit, Web Design</p></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Context and Background</p><h2 class=\"fx-h soft\" style=\"line-height:1.2\">Renmoney is one of Nigeria's leading microfinance banks, offering lending, high-yield savings, and automated wealth-building tools.</h2><p class=\"fx-p\">But as the product grew into a full financial ecosystem, the experience hadn't kept up. Most users still saw Renmoney as a loan app, and the interface wasn't guiding them toward anything else. I led the optimization of the core app experience to drive user and transaction growth, owning it from strategy and research through to the design system and engineering handoff.</p></div><div class=\"fx-g15\"><p class=\"fx-l\">The results</p><div class=\"fx-stats\"><div class=\"fx-stat\"><b>+77%</b><span style=\"color:#1bde6c\">Growth in monthly active users</span><small>more people came back and kept using the app after the flows got faster and simpler.</small></div><div class=\"fx-stat\"><b>+10%</b><span style=\"color:#f24304\">Loan completion rate</span><small>after rebuilding the loan journey for speed and clarity, in just 7 months.</small></div><div class=\"fx-stat\"><b>₦18.7B</b><span style=\"color:#26bfcb\">Savings inflow</span><small>as optimized savings flows made it easier for users to start and grow deposits.</small></div><div class=\"fx-stat\"><b>3.0→4.05</b><span style=\"color:#ffc20d\">App store rating</span><small>reflecting a faster, clearer experience users trusted more.</small></div></div></div></div>","l":"Context and Background"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/renmoney-product-revamp-2-v3-02.webp?v=c6319e00\" width=\"1894\" height=\"984\" alt=\"Redesigned Renmoney app screens\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Challenge</p><h2 class=\"fx-h\" style=\"line-height:1.2\">Renmoney needed to grow, but most users only ever saw one thing it could do.</h2><p class=\"fx-p\">The business had clear targets: more active users and more engagement across savings, wealth products, and loans. But 73% of negative feedback pointed to navigation confusion, not technical errors. Most users had no idea Renmoney offered anything beyond loans, and the interface wasn't built to guide them there.</p></div><div class=\"fx-cards\"><div><p class=\"em\">🚀</p><b>A platform users knew for one thing</b><span>Most active users had no idea Renmoney offered savings or wealth tools. They came for loans and stayed only for loans.</span></div><div><p class=\"em\">🚩</p><b>73% of complaints had nothing to do with bugs</b><span>Support tickets pointed to navigation and unclear requirements, not technical errors. The interface was the problem.</span></div><div><p class=\"em\">💡</p><b>A shifting user base changed everything</b><span>Small business owners with less digital exposure were joining, and the experience wasn't built to guide them.</span></div><div><p class=\"em\">⚙️</p><b>From functionality to guidance</b><span>The products were strong. The experience wasn't showing users what to do with them.</span></div></div></div>","l":"Challenge"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">What we found</p><h2 class=\"fx-h\" style=\"line-height:1.4\">Users weren't ignoring what Renmoney could do. The interface just wasn't showing them.</h2><p class=\"fx-p\">We dug into thousands of support logs and found the same pattern everywhere: users weren't finding savings, wealth tools, or goal features because the architecture wasn't surfacing them. Engagement outside lending stayed flat. The fix wasn't new features. It was restructuring the experience so users could find what was already there.</p></div></div>","l":"What we found"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/renmoney-product-revamp-2-v3-03.webp?v=738b6cec\" width=\"1894\" height=\"954\" alt=\"Session replays and funnel analytics\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Core flows</p><h2 class=\"fx-h\" style=\"line-height:1.2\">A quick look at the redesigned experience.</h2></div></div>","l":"Core flows"},{"t":"html","h":"<div class=\"fx-rows\"><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#19dd50\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/rm-home.webp?v=2c5dda88\" data-src=\"media/cs/v3/rm-home.mp4?v=09536be9\" width=\"1152\" height=\"864\" aria-label=\"The home screen\"></video></div><div class=\"fx-rt\"><h3>The home screen</h3><p class=\"fx-p\">Everything a user needs, one tap away, organized so the whole product is visible at a glance.</p></div></div><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#f8c70b\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/rm-loan.webp?v=82525124\" data-src=\"media/cs/v3/rm-loan.mp4?v=d3c599f5\" width=\"1152\" height=\"864\" aria-label=\"Applying for a loan\"></video></div><div class=\"fx-rt\"><h3>Applying for a loan</h3><p class=\"fx-p\">A streamlined application with a credit decision in as little as 10 minutes.</p></div></div><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#f25017\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/rm-savings.webp?v=14372604\" data-src=\"media/cs/v3/rm-savings.mp4?v=1ca44892\" width=\"1152\" height=\"864\" aria-label=\"Starting a savings goal\"></video></div><div class=\"fx-rt\"><h3>Starting a savings goal</h3><p class=\"fx-p\">Setting up a goal and watching it grow, made simple and visual.</p></div></div><div class=\"fx-row\"><div class=\"fx-card\"><img src=\"media/cs/renmoney-product-revamp-2-v3-04.webp?v=edeec7f2\" width=\"1044\" height=\"864\" alt=\"The Renmoney widget\" loading=\"lazy\" decoding=\"async\"></div><div class=\"fx-rt\"><h3>The Renmoney widget</h3><p class=\"fx-p\">Key actions available straight from the home screen, no login needed.</p></div></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Loan optimization</p><h2 class=\"fx-h\" style=\"line-height:1.2\">Only 11% of people who started a loan finished it. We rebuilt the journey and nearly doubled that.</h2><p class=\"fx-p\">Lending is Renmoney's core, so the loan funnel was the highest-leverage flow to fix. We looked at where applicants dropped off and rebuilt the journey step by step.</p></div></div>","l":"Loan optimization"},{"t":"html","h":"<div class=\"fx-card wide inset\" style=\"background:#fcfacf\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/rm-zeus.webp?v=d8206891\" data-src=\"media/cs/v3/rm-zeus.mp4?v=bbe874a3\" width=\"1152\" height=\"864\" aria-label=\"Choosing a loan offer with a Zeus credit decision\"></video></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.2\">The wait was killing conversion</h2><p class=\"fx-p\">Applicants faced a slow, uncertain wait for a decision, with no sense of whether they'd be approved. Many gave up before finding out. We integrated Zeus, a credit engine that analyzes users' data to deliver a decision in as little as 10 minutes, with no paperwork, collateral, or guarantors required.</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img inset\"><img src=\"media/cs/renmoney-product-revamp-2-v3-05.webp?v=621b80f1\" width=\"887\" height=\"427\" alt=\"Start saving screen in hand\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.2\">The application asked too much, too early</h2><p class=\"fx-p\">The form was long and demanded effort upfront, before users saw any value. We simplified it and introduced Pills, letting users make key choices in a single tap instead of working through long inputs, so the application moved faster and felt lighter.</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img inset\"><img src=\"media/cs/renmoney-product-revamp-2-v3-06.webp?v=7995212f\" width=\"1774\" height=\"854\" alt=\"Anatomy of the loan form\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-inset\"><div class=\"fx-bar\" style=\"--c:#ffc20d\"><i></i><p class=\"fx-p\" style=\"color:var(--white)\">In seven months, loan completion climbed from <b>11% to 21%</b>, and Zeus alone disbursed 114,000 loans, contributing to over <b>₦2.4B in loan sales.</b></p></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Savings optimization</p><h2 class=\"fx-h\" style=\"line-height:1.4\">Renmoney's savings products were strong, but the experience made them hard to start and track</h2><p class=\"fx-p\">The savings dashboard didn't distinguish between products or show progress, so users had little reason to engage. We rebuilt it around clear, goal-based visuals, made returns transparent, and gave each product a distinct identity, so starting a goal and watching it grow felt simple and motivating.</p></div></div>","l":"Savings optimization"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/renmoney-product-revamp-2-v3-07.webp?v=e3ffbf15\" width=\"1894\" height=\"854\" alt=\"My Savings with Renflex, RenVault and Smart Goal\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Onboarding</p><h2 class=\"fx-h\" style=\"line-height:1.4\">Getting started took too long, and users bounced before they began.</h2><p class=\"fx-p\">The old onboarding was slow and asked for too much upfront. We streamlined it with passwordless login and phone-number sign-in, cutting the time to get started from 20 seconds to 10 and making the very first interaction effortless.</p></div></div>","l":"Onboarding"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/renmoney-product-revamp-2-v3-08.webp?v=deee15e4\" width=\"1894\" height=\"854\" alt=\"Get started with email or phone number\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Iterating with insights</p><h2 class=\"fx-h\" style=\"line-height:1.4\">Key finding: users were dropping off at the bank statement upload step.</h2><p class=\"fx-p\">After launch, session data showed a clear stall point in the loan application: uploading a bank statement. Users had to leave the app, find the document, and come back, and many didn't. A step meant to verify them was quietly costing conversions.</p></div></div>","l":"Iterating with insights"},{"t":"html","h":"<div class=\"fx-card wide inset\" style=\"background:#f7be09\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/rm-bank.webp?v=b67d5b3a\" data-src=\"media/cs/v3/rm-bank.mp4?v=178ec112\" width=\"1152\" height=\"864\" aria-label=\"Linking a bank account instead of uploading a statement\"></video></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.2\">...we removed the manual work.</h2><p class=\"fx-p\">Instead of uploading a statement, users could now link their bank directly and we'd pull what we needed automatically. For anyone not ready to link, we added the option to skip and come back later, so the upload step stopped being a dead end. Drop-off at that point fell and more applications made it through.</p></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Validation &amp; Results</p><h2 class=\"fx-h\" style=\"line-height:1.2\">The optimized experience drove growth across the board.</h2><p class=\"fx-p\">Within the first few weeks of launch, we observed a significant reduction in monthly support tickets related to basic navigation. Our redesigned FAQ nodes and self-help articles led to 52% of users resolving their issues via self-service, freeing our support team to handle higher-priority technical triages.</p><p class=\"fx-p\">Business performance saw a simultaneous spike: we recorded approximately 33-35% drop in average time-to-resolution for common issues and a 73% increase in engagement with help documentation. Also, the introduction of the 30% p.a. hook rate for new customers led to a 25% increase in RenVault deposits within the first month, which is always good for business.</p><div class=\"fx-stats\"><div class=\"fx-stat\"><b>+77%</b><span style=\"color:#1bde6c\">Growth in monthly active users</span><small>more people came back and kept using the app after the flows got faster and simpler.</small></div><div class=\"fx-stat\"><b>+10%</b><span style=\"color:#f24304\">Loan completion rate</span><small>in seven months, after rebuilding the loan journey around speed and clarity</small></div><div class=\"fx-stat\"><b>394%</b><span style=\"color:#1bde6c\">Growth in app installs</span><small>driven by a faster onboarding and a stronger app store presence.</small></div><div class=\"fx-stat\"><b>₦18.7B</b><span style=\"color:#26bfcb\">Savings inflow</span><small>as optimized savings flows made it easier for users to start and grow deposits.</small></div><div class=\"fx-stat\"><b>3.0→4.05</b><span style=\"color:#ffc20d\">App store rating</span><small>reflecting a faster, clearer experience users trusted more.</small></div><div class=\"fx-stat\"><b>20s→10s</b><span style=\"color:#1bde6c\">Onboarding time</span><small>cut in half, so new users reached value sooner.</small></div></div></div></div>","l":"Validation & Results"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Reflection / Learnings</p><h2 class=\"fx-h\" style=\"line-height:1.2\">What I took away</h2><p class=\"fx-lead s20\"><b>Growth is a design problem:</b><br>The biggest gains didn't come from new features. They came from helping users find what the app already did. When the experience started guiding people instead of just functioning, the business moved.</p><p class=\"fx-lead s20\"><b>The real signal comes after launch:</b><br>Shipping was the start. Watching real people use the flows, like seeing them stall at the bank statement step, is what pointed to the changes that actually mattered. Optimization is a loop, not a finish line.</p></div></div>","l":"Reflection / Learnings"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Team members</p><ul class=\"fx-team\"><li>Damilola Olayiwola - Product Design lead</li><li>PreciousFavour Ogboli - Junior Designer</li><li>Ayomide Olukoga - Senior Designer</li><li>Anthony Alebiosu - Mobile App PM</li><li>Emeka Otti - Chief Product Officer</li><li>Kamal Bouchi - CEO</li><li>Funsho - Chief Risk Officer</li></ul></div></div>","l":"Team Members"}],"frame":"v3"},{"slug":"vervemobile","co":"Interswitch Group","yr":"2025","site":"","title":"VerveMobile: Bringing mobile connectivity and a wallet into one app","sub":"","toc":[["Context and Background",3],["Solution",5],["Research",7],["Design decisions",9],["Iterating with insights",16],["Design system",20],["Final designs",23],["Reflection / Learnings",27],["Team Members",28]],"secs":[{"t":"hr"},{"t":"img","src":"media/cs/vervemobile-v3-01.webp?v=aa6df643","w":1954,"h":1040,"alt":"VerveMobile home","l":""},{"t":"html","h":"<div class=\"fx-meta\"><div><p class=\"fx-l\">My role</p><p>Lead Product Designer</p></div><div><p class=\"fx-l\">Timeline</p><p>2024-2025</p></div><div><p class=\"fx-l\">Team</p><p>Product Managers, Project Managers, Front-end and Back-end Engineers, Solutions Architects, Growth Marketers, Growth Team</p></div><div><p class=\"fx-l\">Deliverables</p><p>Product Design Strategy, Product Design, Information Architecture, UX Strategist</p></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Context and Background</p><h2 class=\"fx-h soft\" style=\"line-height:1.2\">What if the brand behind your card could also power your phone?</h2><p class=\"fx-p\">Verve is one of Africa's most trusted payment brands, with over 70 million cards issued across Nigeria. For years, its role was simple: it helped people pay. VerveMobile is the step beyond that, a standalone app that brings mobile connectivity and financial services into one place.</p></div></div>","l":"Context and Background"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/vervemobile-v3-02.webp?v=5db99f5e\" width=\"977\" height=\"427\" alt=\"VerveMobile wallets screen in hand\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Solution</p><h2 class=\"fx-h\" style=\"line-height:1.4\">VerveMobile: one app for staying connected and managing money</h2><p class=\"fx-p\">We wanted financial access to feel as everyday and effortless as topping up airtime, so we brought a mobile network, a wallet, payments, and rewards together in one app.</p></div></div>","l":"Solution"},{"t":"html","h":"<div class=\"fx-rows\"><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#063442\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/vm-airtime.webp?v=197fe323\" data-src=\"media/cs/v3/vm-airtime.mp4?v=7d88ca18\" width=\"1152\" height=\"864\" aria-label=\"Buy airtime and data in seconds\"></video></div><div class=\"fx-rt\"><h3>Buy airtime and data in seconds</h3><p class=\"fx-p\">Top up straight from your wallet, and earn points every time.</p></div></div><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#f5feff\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/vm-sim.webp?v=dfd041ff\" data-src=\"media/cs/v3/vm-sim.mp4?v=97f6fb4d\" width=\"1152\" height=\"864\" aria-label=\"Manage your SIM, end to end\"></video></div><div class=\"fx-rt\"><h3>Manage your SIM, end to end</h3><p class=\"fx-p\">Buy a SIM, port your number, or block a lost one, all from the app.</p></div></div><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#15bed7\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/vm-send.webp?v=8bd4b1df\" data-src=\"media/cs/v3/vm-send.mp4?v=99fb7f1c\" width=\"1152\" height=\"864\" aria-label=\"Send money and pay bills\"></video></div><div class=\"fx-rt\"><h3>Send money and pay bills</h3><p class=\"fx-p\">Move money, settle bills, and save, all without a bank account.</p></div></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Research</p><h2 class=\"fx-h\" style=\"line-height:1.4\">We learned how people expect a super app to be organized...</h2><p class=\"fx-p\">VerveMobile had to hold a mobile network, a wallet, payments, and rewards in one place. Through card sorting, we learned how users naturally grouped these services, and built the navigation around their mental model instead of ours.</p></div></div>","l":"Research"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/vervemobile-v3-03.webp?v=e9946a2e\" width=\"1954\" height=\"1576\" alt=\"VerveMobile information architecture\" loading=\"lazy\" decoding=\"async\"><p class=\"fx-cap\">The information architecture, built around how users grouped these services</p></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g40\"><div class=\"fx-g15\"><p class=\"fx-l\">Design decisions</p><h2 class=\"fx-h\" style=\"line-height:1.2\">We made deliberate calls to keep a complex product simple</h2><p class=\"fx-p\">The decisions that mattered most weren't about what to build, but about what to hold back, what to make optional, and how to lower the barrier to getting started.</p></div><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.2\">Financial, without being a bank</h2><p class=\"fx-p\">Regulation meant VerveMobile couldn't present as a fintech bank. Telecom had to lead, and wallet transfers were limited to Verve-to-Verve only. A wallet that can only send internally is a real limitation. But working within the regulation, rather than around its edges, was the only way to build something that would actually ship.</p></div></div></div>","l":"Design decisions"},{"t":"html","h":"<figure class=\"fx-img inset\"><img src=\"media/cs/vervemobile-v3-04.webp?v=d3fbff46\" width=\"1774\" height=\"854\" alt=\"Verve-to-Verve transfer\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.2\">A number before you even sign in</h2><p class=\"fx-p\">Most apps make you create an account before you get anything. We let users get a VerveMobile number first. Some might never complete registration, and we accepted that. Getting people to experience the product before asking for commitment would keep more of them than a sign-up wall ever would.</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img inset\"><img src=\"media/cs/vervemobile-v3-05.webp?v=4ac6df87\" width=\"1774\" height=\"854\" alt=\"Verve Express: buy a SIM without signing in\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-inset\"><div class=\"fx-bar\" style=\"--c:#46b2ff\"><i></i><p class=\"fx-q\">This is a trade-off that we're willing to make for <b>mass adoption.</b></p></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.2\">Two directions, one final design</h2><p class=\"fx-p\">Two early directions were tested before the final UI took shape. Testing didn't produce a clear winner, so the real answer came from the feedback on each.</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img inset\"><img src=\"media/cs/vervemobile-v3-06.webp?v=fcf9fe34\" width=\"1774\" height=\"1324\" alt=\"Version 1, Version 2 and the final version\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Iterating with insights</p><h2 class=\"fx-h\" style=\"line-height:1.4\">Key finding: card linking was the single biggest blocker in usability testing</h2><p class=\"fx-p\">After the core experience was built, we ran usability testing across 15 tasks with real participants covering onboarding, SIM management, data, wallet, and rewards. The app tested well overall, participants called it easy and intuitive, and rated it simpler than established telco apps.</p></div></div>","l":"Iterating with insights"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/vervemobile-v3-07.webp?v=27064c2f\" width=\"1954\" height=\"854\" alt=\"Usability testing summary of findings\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.4\">...but the wallet section surfaced the most serious problems</h2><p class=\"fx-p\">Card linking triggered retry errors, and when a \"no name match\" error appeared, it gave no explanation of what had gone wrong. One participant's attempt to send money failed entirely when a zero balance combined with a broken card link left no path forward. These findings shaped what we prioritized next: fixing the card linking flow first, since it blocked the most critical financial actions in the app, and rewriting error states so users understood what happened and what to do next.</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/vervemobile-v3-08.webp?v=82fa72fc\" width=\"1954\" height=\"854\" alt=\"Wallet issues mapped to the wallet screen\" loading=\"lazy\" decoding=\"async\"><p class=\"fx-cap\">Critical card linking errors, mapped to where they happened in the app.</p></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Design system</p><h2 class=\"fx-h\" style=\"line-height:1.4\">VerveMobile had to feel like Verve without looking like a copy of it.</h2><p class=\"fx-p\">Verve already had an established brand system. We worked within it, borrowing the foundations (color, typography, core components) and building only what VerveMobile needed that didn't already exist. New components for SIM management, wallet flows, and the rewards ecosystem. New artifacts for the telecom layer. The goal was consistency with the parent brand and enough distinctiveness for VerveMobile to feel like its own product.</p></div></div>","l":"Design system"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/vervemobile-v3-09.webp?v=52b3c3d7\" width=\"1954\" height=\"1428\" alt=\"VerveMobile design system\" loading=\"lazy\" decoding=\"async\"><p class=\"fx-cap\">Design system preview</p></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/vervemobile-v3-10.webp?v=e7972602\" width=\"977\" height=\"427\" alt=\"Moodboard\" loading=\"lazy\" decoding=\"async\"><p class=\"fx-cap\">UI and Screen Layout Moodboarding</p></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Final designs</p><h2 class=\"fx-h\" style=\"line-height:1.4\">We built a simple, functional app</h2></div></div>","l":"Final designs"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/vervemobile-v3-11.webp?v=e836302f\" width=\"977\" height=\"495\" alt=\"Airtime top up on VerveMobile\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/vervemobile-v3-12.webp?v=83823efb\" width=\"977\" height=\"427\" alt=\"Wallet funding and airtime purchase rewards\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/vervemobile-v3-13.webp?v=d785c1c2\" width=\"977\" height=\"495\" alt=\"SIM usage analytics\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Reflection / Learnings</p><h2 class=\"fx-h\" style=\"line-height:1.2\">What I learned</h2><p class=\"fx-lead s24\"><b>Regulation can be a design direction..</b><br>The telco and CBN rules forced us to lead with telecom and limit transfers to Verve-to-Verve only. At first that felt like a ceiling. By the end it felt like a frame. The limitations made the product more focused, not less, and working within them honestly produced something cleaner than designing around their edges would have.</p><p class=\"fx-lead s24\"><b>The barrier to entry is a product decision.</b><br>Letting users get a number before signing in wasn't a UX fix. It was a statement about what the product values, that people should experience the value before being asked to commit. That belief shaped more than the onboarding flow. It shaped how we thought about every first interaction in the app.</p><p class=\"fx-lead s24\"><b>Inconclusive data is still data.</b><br>Our A/B test came back close. The instinct was to pick the higher score and move on. The real insight was that neither direction alone was right, and synthesizing both was the harder, more honest call. Research doesn't always point at an answer. Sometimes it points at a better question.</p></div></div>","l":"Reflection / Learnings"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Team members</p><ul class=\"fx-team\"><li>Damilola Olayiwola - Product Design lead</li><li>Ayomide - Brand Designer</li><li>Saviour Inyang - Supporting Designer</li><li>Mofoluwake Amisu - Product Manager</li><li>Dimitri - Flutter Developer</li><li>Dzymitri - Flutter Developer</li><li>Paul Otu - Division Head, Design and User Experience</li></ul></div></div>","l":"Team Members"}],"frame":"v3"},{"slug":"quickteller-remit","co":"Interswitch Group","yr":"2025","site":"","title":"QuickTeller Remit: an international remittance experience for the African diaspora","sub":"","toc":[["Context and Background",3],["Challenge",5],["Solution",6],["Design decisions",8],["Iterations",14],["Final designs",20],["Reflection / Learnings",26],["Team Members",27]],"secs":[{"t":"hr"},{"t":"img","src":"media/cs/quickteller-remit-v3-01.webp?v=deebc5f0","w":1954,"h":1040,"alt":"QuickTeller Remit app in hand","l":""},{"t":"html","h":"<div class=\"fx-meta\"><div><p class=\"fx-l\">My role</p><p>Lead Product Designer</p></div><div><p class=\"fx-l\">Timeline</p><p>2025 (Q4)</p></div><div><p class=\"fx-l\">Team</p><p>Product Managers, Project Managers, Front-end and Back-end Engineers, Solutions Architects, Growth Marketers, Growth Team</p></div><div><p class=\"fx-l\">Deliverables</p><p>Product Design Strategy, Product Design, Information Architecture, UX Strategist</p></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Context and Background</p><h2 class=\"fx-h soft\" style=\"line-height:1.2\">QuickTeller Remit was Interswitch's move into international remittance, covering four corridors from the UK to Africa.</h2><p class=\"fx-p\">QuickTeller Remit is an Interswitch product, part of the broader QuickTeller ecosystem, built following the acquisition of an IMTO license. It covers four corridors from the UK to Nigeria, Uganda, Kenya, and Ghana, giving Africans in the diaspora a way to send money home, pay bills for family, and manage finances across borders.</p></div></div>","l":"Context and Background"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/quickteller-remit-v3-02.webp?v=75e1cdf0\" width=\"1954\" height=\"854\" alt=\"QuickTeller Remit home screen\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Challenge</p><h2 class=\"fx-h soft\" style=\"line-height:1.2\">How might we build a compliant remittance experience for Africans in the UK, in a heavily regulated space, without making the product feel like a compliance exercise?</h2></div></div>","l":"Challenge"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Solution</p><h2 class=\"fx-h\" style=\"line-height:1.4\">QuickTeller Remit: send money, pay bills, and track your finances across borders.</h2></div></div>","l":"Solution"},{"t":"html","h":"<div class=\"fx-rows\"><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#142d52\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/qt-send.webp?v=8f73baef\" data-src=\"media/cs/v3/qt-send.mp4?v=da308f89\" width=\"1152\" height=\"864\" aria-label=\"Send money home\"></video></div><div class=\"fx-rt\"><h3>Send money home</h3><p class=\"fx-p\">Transfer funds across four corridors, UK to Nigeria, Uganda, Kenya, and Ghana, quickly and securely.</p></div></div><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#0b6dce\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/qt-rate.webp?v=fc8a0dba\" data-src=\"media/cs/v3/qt-rate.mp4?v=35ebcf3c\" width=\"1152\" height=\"864\" aria-label=\"Check rates before you sign in\"></video></div><div class=\"fx-rt\"><h3>Check rates before you sign in</h3><p class=\"fx-p\">See live exchange rates without creating an account, so you know what you're getting before you commit.</p></div></div><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#142d52\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/qt-bills.webp?v=4d632280\" data-src=\"media/cs/v3/qt-bills.mp4?v=c2d698f9\" width=\"1152\" height=\"864\" aria-label=\"Pay bills for family back home\"></video></div><div class=\"fx-rt\"><h3>Pay bills for family back home</h3><p class=\"fx-p\">Pay utility bills, school fees, and other expenses for family in Nigeria, Uganda, Kenya, and Ghana, directly from the UK.</p></div></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g40\"><div class=\"fx-g15\"><p class=\"fx-l\">Design decisions</p><h2 class=\"fx-h\" style=\"line-height:1.2\">Three decisions shaped how the product came together</h2><p class=\"fx-p\">Working within a regulated space, an existing ecosystem, and a specific user need meant every decision involved a real tradeoff.</p></div><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.2\">Rates before you commit</h2><p class=\"fx-p\">Most remittance apps make you create an account before showing you anything. We made exchange rates visible without signing in. The risk was that users might check rates and never convert. The belief was that giving people real information before asking for commitment would build more trust than a sign-up wall ever could.</p></div></div></div>","l":"Design decisions"},{"t":"html","h":"<figure class=\"fx-img inset\"><img src=\"media/cs/quickteller-remit-v3-03.webp?v=c2b3624e\" width=\"1774\" height=\"854\" alt=\"Sign-up, rate checker and all rates\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.2\">Onboarding that meets you where you are</h2><p class=\"fx-p\">Compliance in remittance is non-negotiable. But we didn't want documentation requirements to become a door that shut people out before they'd experienced anything. We asked for the minimum, ID and residency permit, to get users started, and built a tiered experience that unlocked more as their documentation grew. Someone new to the UK shouldn't have to wait until they're fully settled before they can send money home.</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img inset\"><img src=\"media/cs/quickteller-remit-v3-04.webp?v=1e9fb74f\" width=\"1774\" height=\"854\" alt=\"Profile details in three steps and a summary\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.2\">Working within what already existed</h2><p class=\"fx-p\">As part of the Interswitch ecosystem, QuickTeller Remit shared infrastructure, flows, and branding with other products in the stack. Bill payment was the clearest example: Interswitch had an existing bill payment structure and we had to design within it. Less flexibility, but consistency across the ecosystem built familiarity users could trust.</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img inset\"><img src=\"media/cs/quickteller-remit-v3-05.webp?v=3778dee7\" width=\"1774\" height=\"854\" alt=\"Pay bills, bill details and bill paid\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g40\"><div class=\"fx-g15\"><p class=\"fx-l\">Iterations</p><h2 class=\"fx-h\" style=\"line-height:1.2\">Not every first approach was the right one. Here's where the work changed.</h2></div><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.2\">We couldn't decide when to show the exchange rate breakdown...</h2><p class=\"fx-p\">We explored two ways to present the exchange rate breakdown during a transfer.</p></div></div></div>","l":"Iterations"},{"t":"html","h":"<figure class=\"fx-img inset\"><img src=\"media/cs/quickteller-remit-v3-06.webp?v=27d37656\" width=\"1774\" height=\"1106\" alt=\"Before and after: exchange rate breakdown\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><h2 class=\"fx-h\" style=\"line-height:1.2\">...showing it upfront won. Information that builds confidence should never be a tap away.</h2></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><h2 class=\"fx-h\" style=\"line-height:1.2\">We asked for the minimum, and people still didn't finish signing up...</h2><p class=\"fx-p\">We had already cut onboarding down so newer arrivals without every document could get started. User interviews and sign-up data showed it wasn't enough. People were still dropping off before completing registration.</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img inset\"><img src=\"media/cs/quickteller-remit-v3-07.webp?v=3a80dc0d\" width=\"1774\" height=\"854\" alt=\"Reworked sign-up flow\" loading=\"lazy\" decoding=\"async\"><p class=\"fx-cap\">The reworked sign-up flow, rebuilt after interviews and data showed where people were stalling.</p></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><h2 class=\"fx-h\" style=\"line-height:1.2\">...so the fix wasn't asking for less. It was rebuilding how sign-up works.</h2></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Final designs</p><h2 class=\"fx-h\" style=\"line-height:1.4\">We built it to feel trustworthy, clear, and fast.</h2></div></div>","l":"Final designs"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/quickteller-remit-v3-08.webp?v=7ac9de33\" width=\"1954\" height=\"854\" alt=\"Final screens\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/quickteller-remit-v3-09.webp?v=2ff9f810\" width=\"1954\" height=\"854\" alt=\"Transaction details: pending, failed and successful\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/quickteller-remit-v3-10.webp?v=b2df7972\" width=\"977\" height=\"427\" alt=\"Accounts and settings, and pay bills\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/quickteller-remit-v3-11.webp?v=02d90135\" width=\"977\" height=\"427\" alt=\"Add money using bank details\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/quickteller-remit-v3-12.webp?v=3085ddac\" width=\"977\" height=\"427\" alt=\"Referral dashboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Reflection / Learnings</p><h2 class=\"fx-h\" style=\"line-height:1.2\">What I learned</h2><p class=\"fx-lead s24\"><b>Compliance doesn't have to mean friction.</b><br>The regulated nature of remittance could have made the experience feel like a compliance exercise. Every decision was about finding the line between what regulation required and what users actually needed.</p><p class=\"fx-lead s24\"><b>Information builds confidence.</b><br>The transfer iteration proved it. Showing users the breakdown upfront removed the hesitation. In a product where people are sending real money across borders, clarity isn't just good UX, it's the product.</p></div></div>","l":"Reflection / Learnings"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Team members</p><ul class=\"fx-team\"><li>Damilola Olayiwola - Lead Product Designer/UX Strategist</li><li>Quadri Morin - Supporting Designer</li><li>Siegfried - Flutter Developer</li><li>Daniel Sobozka - Backend Engineer</li><li>Kazeem Bamgbose - Product Manager</li></ul></div></div>","l":"Team Members"}],"frame":"v3"},{"slug":"rivr-product","co":"Rivr","yr":"2026","site":"","title":"Rivr: designing the brand and product for Namibia's cross-border payments platform","sub":"","toc":[["Context and Background",3],["Solution",5],["Information Architecture",7],["Design system",9],["Brand Discovery",11],["Final Designs",14],["Reflection / Learnings",20],["Team Members",21]],"secs":[{"t":"hr"},{"t":"img","src":"media/cs/rivr-product-v3-01.webp?v=461ab2a5","w":977,"h":520,"alt":"Rivr","l":""},{"t":"html","h":"<div class=\"fx-meta\"><div><p class=\"fx-l\">My role</p><p>Fullstack Designer</p></div><div><p class=\"fx-l\">Timeline</p><p>2026 (Q2-Q3)</p></div><div><p class=\"fx-l\">Team</p><p>Product Manager, Head of Product, Head of Engineering</p></div><div><p class=\"fx-l\">Deliverables</p><p>Product Design Strategy, Product Design, Information Architecture, UX Strategist, Brand Design</p></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Context and Background</p><h2 class=\"fx-h soft\" style=\"line-height:1.2\">Rivr is the infrastructure that lets global fintechs route compliant payments into Namibia.</h2><p class=\"fx-p\">Cross-border payments remain costly and inefficient across much of Southern Africa, and Namibia is among the markets that have had less infrastructure built around this need. Rivr is a single-API platform that unifies cross-border payout rails, identity verification, AML compliance, and fraud mitigation, the termination layer that lets fintechs and enterprise platforms route secure payments into Namibia. But a platform handling this much, payments, compliance, identity, fraud, in one place can't afford to feel like a black box, it had to make dense, high-stakes infrastructure feel navigable. As Lead Designer, I built the brand identity and the full product experience from the ground up.</p></div></div>","l":"Context and Background"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/rivr-product-v3-02.webp?v=f12e89fc\" width=\"977\" height=\"567\" alt=\"Rivr wallets dashboard on a desktop monitor\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g40\"><div class=\"fx-g15\"><p class=\"fx-l\">Solution</p><h2 class=\"fx-h\" style=\"line-height:1.4\">Rivr, one platform for payout rails, identity verification, compliance, and fraud mitigation.</h2><p class=\"fx-p\">Instead of stitching together separate banking relationships, KYC providers, compliance checks, and fraud tools, fintechs and enterprise platforms get all of it, unified behind a single API.</p></div><h2 class=\"fx-h\" style=\"line-height:1.4\">Here are some of the key flows on Rivr...</h2></div></div>","l":"Solution"},{"t":"html","h":"<div class=\"fx-rows\"><div class=\"fx-row\"><div class=\"fx-card fit\" style=\"background:#f2f2f2\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/rv-wallet.webp?v=5ff6a522\" data-src=\"media/cs/v3/rv-wallet.mp4?v=1866e4d6\" width=\"1152\" height=\"864\" aria-label=\"Wallets\"></video></div><div class=\"fx-rt\"><h3>Wallets</h3><p class=\"fx-p\">Receive money from anywhere, and settle it in Namibian dollars, or whichever currency the business needs.</p></div></div><div class=\"fx-row\"><div class=\"fx-card fit\" style=\"background:#f2f2f2\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/rv-auth.webp?v=8ff72f9f\" data-src=\"media/cs/v3/rv-auth.mp4?v=824145d4\" width=\"1152\" height=\"864\" aria-label=\"Authentications\"></video></div><div class=\"fx-rt\"><h3>Authentications</h3><p class=\"fx-p\">Verify identity and run compliance checks in real time, without slowing a business down.</p></div></div><div class=\"fx-row\"><div class=\"fx-card fit\" style=\"background:#f3f3f3\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/rv-dev.webp?v=3ae4815c\" data-src=\"media/cs/v3/rv-dev.mp4?v=a8229ba4\" width=\"1152\" height=\"864\" aria-label=\"Dev Tools\"></video></div><div class=\"fx-rt\"><h3>Dev Tools</h3><p class=\"fx-p\">Generate API keys, set up webhooks, and integrate Rivr directly into a business's own systems.</p></div></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">The information architecture</p><h2 class=\"fx-h\" style=\"line-height:1.4\">Before any screen was designed, the entire product had to be mapped, every module, every relationship, every access level.</h2><p class=\"fx-p\">Rivr handles wallets, compliance, developer access, and reporting, each with its own data and its own audience. Getting the structure right meant knowing how these pieces connected before deciding how any single screen should look.</p></div></div>","l":"Information Architecture"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/rivr-product-v3-03.webp?v=2ed807d5\" width=\"1954\" height=\"1386\" alt=\"Rivr information architecture\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">The design system</p><h2 class=\"fx-h\" style=\"line-height:1.4\">I built a design system to support rapid product development.</h2><p class=\"fx-p\">With the brand vision and considerations in place, I developed a simple design system to streamline the development of core product features and allow for consistency across the platform.</p></div></div>","l":"Design system"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/rivr-product-v3-04.webp?v=e3fa3179\" width=\"1954\" height=\"1044\" alt=\"Rivr design system components\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Brand discovery</p><h2 class=\"fx-h\" style=\"line-height:1.4\">Two directions were explored before one mark could hold three ideas at once: a river, a symbol, and a system set free.</h2><p class=\"fx-p\">The first direction anchored the brand in finance directly, a currency symbol built into the \"R.\" It was clear, but it left out the thing that made this product different, movement itself. The final direction let the mark work as a river's rhythm and the letter R simultaneously, currency, symbol, and system set free, together in one form.</p></div></div>","l":"Brand Discovery"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/rivr-product-v3-05.webp?v=0f9f0429\" width=\"1954\" height=\"1160\" alt=\"Rivr logo and mark: fast rails for a connected economy\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/rivr-product-v3-06.webp?v=fb87604d\" width=\"1954\" height=\"952\" alt=\"Rivr overview dashboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Final designs</p><h2 class=\"fx-h\" style=\"line-height:1.4\">We built it to handle complexity without hiding it.</h2></div></div>","l":"Final Designs"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/rivr-product-v3-07.webp?v=2c0152a7\" width=\"1954\" height=\"1242\" alt=\"Authentications dashboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/rivr-product-v3-08.webp?v=bafe424b\" width=\"977\" height=\"621\" alt=\"Rivr sign-in on a tablet\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/rivr-product-v3-09.webp?v=784f08d6\" width=\"1954\" height=\"1242\" alt=\"Running an identity check\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/rivr-product-v3-10.webp?v=c87b405b\" width=\"977\" height=\"609\" alt=\"Rivr on a laptop and the get started dashboard\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/rivr-product-v3-11.webp?v=7c849bcd\" width=\"977\" height=\"621\" alt=\"Teams and permissions on a laptop\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Reflection / Learnings</p><h2 class=\"fx-h\" style=\"line-height:1.2\">What I learned</h2><p class=\"fx-lead s24\"><b>Designing for a market that hadn't had this kind of infrastructure before means the product has to teach itself.</b><br>There was no established local pattern for Namibian businesses to already expect. Every screen had to make its own case for how it worked, because there was little to lean on that was already familiar.</p><p class=\"fx-lead s24\"><b>A strong brand still matters, even when almost no one sees it.</b><br>Most of Rivr's users will never read the concept behind the mark. They'll see a dashboard, an API key, a settlement report. But the brand still shaped every decision, because the discipline it took to define what Rivr stood for is the same discipline that made the product feel considered, not just functional.</p></div></div>","l":"Reflection / Learnings"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Team members</p><ul class=\"fx-team\"><li>Damilola Olayiwola - Lead Product Designer/UX Strategist</li><li>Abimbola Bajomo - Chief Product Officer</li><li>Teejay Ajayi - Fullstack Developer</li><li>Tioluwani Bamigboye - Product Manager</li></ul></div></div>","l":"Team Members"}],"frame":"v3","thumb":"media/cs/rivr-product-v3-01.webp?v=461ab2a5","cover":"media/cs/rivr-product-v3-01.webp?v=461ab2a5"},{"slug":"dropcart-product","co":"DropCart","yr":"2026","site":"","title":"DropCart: brand identity and full product design for a Namibian delivery app","sub":"","toc":[["Context and Background",3],["Challenge",5],["Information Architecture",6],["Solution",8],["Design system",10],["The Identity System",12],["Final Designs",18],["Reflection / Learnings",24],["Team Members",25]],"secs":[{"t":"hr"},{"t":"img","src":"media/cs/dropcart-product-v3-01.webp?v=76003a4e","w":977,"h":520,"alt":"DropCart home screen","l":""},{"t":"html","h":"<div class=\"fx-meta\"><div><p class=\"fx-l\">My role</p><p>Fullstack Designer</p></div><div><p class=\"fx-l\">Timeline</p><p>2026 (Q2-Q3)</p></div><div><p class=\"fx-l\">Team</p><p>Product Manager, Head of Product, Head of Engineering</p></div><div><p class=\"fx-l\">Deliverables</p><p>Product Design Strategy, Product Design, Information Architecture, UX Strategist, Brand Design</p></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Context and Background</p><h2 class=\"fx-h soft\" style=\"line-height:1.2\">DropCart is a delivery app built around one idea: getting what you want should feel as good as having it.</h2><p class=\"fx-p\">DropCart is a delivery app for Namibia, where a growing, urban, and increasingly digital population is turning to apps for everyday convenience. As Lead Designer, I handled everything from scratch, solo: logo, color system, typography, imagery direction, and the complete app experience.</p></div></div>","l":"Context and Background"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-02.webp?v=d37c8b3e\" width=\"977\" height=\"567\" alt=\"DropCart order, tracking and favourites screens\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Challenge</p><h2 class=\"fx-h\" style=\"line-height:1.4\">A new delivery app can't win on features alone. The brief was clear from the start: build a brand bold enough to make people stop scrolling.</h2><p class=\"fx-p\">Delivery is a crowded, noisy category. Users have seen it all before, the apps, the interfaces, the promises. In Namibia specifically, that meant standing shoulder to shoulder with services already delivering across Windhoek, Swakopmund, and Walvis Bay. Standing out meant building a brand with enough personality and visual energy that people would choose it before they even opened it. The brand wasn't packaging. It was the product's first and strongest argument.</p><p class=\"fx-p\">Our high-level goals were to:</p><ul class=\"fx-goals\"><li>Make ordering effortless, from the first browse to the doorstep.</li><li>Give a familiar service a personality people would choose before they ever opened it.</li></ul></div></div>","l":"Challenge"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">The information architecture</p><h2 class=\"fx-h\" style=\"line-height:1.2\">Under the hood</h2><p class=\"fx-p\">DropCart needed to feel effortless, and effortless experiences are never accidental. Getting the architecture right first meant every screen that followed had a clear purpose, and a clear path forward. We mapped the full product before any high-fidelity screen, then built a component system so the brand stayed consistent as the product grew.</p></div></div>","l":"Information Architecture"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-03.webp?v=615918d9\" width=\"1954\" height=\"1282\" alt=\"DropCart information architecture\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Solution</p><h2 class=\"fx-h\" style=\"line-height:1.2\">DropCart: From discovery to doorstep.</h2></div></div>","l":"Solution"},{"t":"html","h":"<div class=\"fx-rows\"><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#15053d\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/dc-order.webp?v=28401513\" data-src=\"media/cs/v3/dc-order.mp4?v=c4082e0b\" width=\"1152\" height=\"864\" aria-label=\"Making an order\"></video></div><div class=\"fx-rt\"><h3>Making an order</h3></div></div><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#bffe08\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/dc-track.webp?v=9aa39770\" data-src=\"media/cs/v3/dc-track.mp4?v=961f180a\" width=\"1152\" height=\"864\" aria-label=\"Tracking deliveries\"></video></div><div class=\"fx-rt\"><h3>Tracking deliveries</h3></div></div><div class=\"fx-row\"><div class=\"fx-card\" style=\"background:#1211dc\"><video class=\"lazyv\" muted loop playsinline preload=\"none\" poster=\"media/cs/v3/dc-explore.webp?v=6b0b10d1\" data-src=\"media/cs/v3/dc-explore.mp4?v=f079bb8e\" width=\"1152\" height=\"864\" aria-label=\"Exploring options\"></video></div><div class=\"fx-rt\"><h3>Exploring options</h3></div></div></div>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">The design system</p><h2 class=\"fx-h\" style=\"line-height:1.4\">A system built to keep the brand consistent at every scale.</h2><p class=\"fx-p\">The component library extended the brand identity into every interactive element. Buttons, cards, inputs, iconography, all carrying the same visual energy as the brand. Built so the product could grow without losing coherence.</p></div></div>","l":"Design system"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-04.webp?v=a4e8007c\" width=\"1954\" height=\"1062\" alt=\"DropCart design system components\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">The identity system</p><h2 class=\"fx-h\" style=\"line-height:1.4\">Effortless, directional, rewarding: the test every screen had to pass.</h2><p class=\"fx-p\">The brand started from one idea: commerce should feel effortless, directional, and rewarding. We treated it as a test for the product, not only the logo. Effortless meant ordering that gets out of the way. Directional meant always knowing where you are and what happens next, from browsing to tracking. Rewarding meant the app gives something back, with quick ways to order again and a place to save what you love.</p></div></div>","l":"The Identity System"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-05.webp?v=dc1dc047\" width=\"977\" height=\"427\" alt=\"Brand moodboard\" loading=\"lazy\" decoding=\"async\"><p class=\"fx-cap\">Exploring bold, vibrant, and playful as the starting point for the brand.</p></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-06.webp?v=e3abafef\" width=\"977\" height=\"523\" alt=\"DropCart home screen on a phone\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">The logo exploration</p><h2 class=\"fx-h\" style=\"line-height:1.4\">We explored two directions before one made the decision easy.</h2><p class=\"fx-p\">The first was a bold directional wordmark, fast-feeling and confident, \"drop\" in yellow, \"cart\" in white, set on deep purple. It had energy but it felt borrowed. A direction any delivery brand could have landed on.</p><p class=\"fx-p\">The second took a different approach entirely. It reimagined the location pin as the letter \"D,\" with a subtle smile embedded in the form. That combination of location, identity, and delight in a single mark was something no competitor owned.</p></div></div>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-07.webp?v=e0916a72\" width=\"1954\" height=\"854\" alt=\"Logo concept and agreed concept\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-08.webp?v=0efa99ea\" width=\"1954\" height=\"854\" alt=\"The smile was the deciding detail. Tap, relax, and it arrives, ready to enjoy.\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Final designs</p><h2 class=\"fx-h\" style=\"line-height:1.4\">Commerce that looks as good as it feels.</h2><p class=\"fx-p\">With the architecture locked and the brand defined, every screen had a clear foundation to build from.</p></div></div>","l":"Final Designs"},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-09.webp?v=abcd8901\" width=\"977\" height=\"523\" alt=\"Five-star cravings, couch-side convenience, and the DropCart delivery bag\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-10.webp?v=78e981a6\" width=\"977\" height=\"523\" alt=\"Checkout, payment options and payment processing\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-11.webp?v=fa0705b7\" width=\"977\" height=\"567\" alt=\"Store page on a phone\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-12.webp?v=1a2995e4\" width=\"977\" height=\"567\" alt=\"Live delivery tracking\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<figure class=\"fx-img\"><img src=\"media/cs/dropcart-product-v3-13.webp?v=c5362bff\" width=\"977\" height=\"520\" alt=\"Payment plaques and order summary\" loading=\"lazy\" decoding=\"async\"></figure>","l":""},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Reflection / Learnings</p><h2 class=\"fx-h\" style=\"line-height:1.2\">What I learned</h2><p class=\"fx-lead s24\"><b>Brand sets the stage. Product keeps the promise.</b><br>A bold brand gets people through the door. But if the product doesn't deliver the same energy and ease, the brand becomes a lie. Every screen had to earn what the brand promised.</p><p class=\"fx-lead s24\"><b>The consumer space is less forgiving than enterprise.</b><br>In enterprise, users tolerate friction because they have to. In consumer, they don't. Nobody has to use DropCart. They choose it, or they don't, in seconds, based on how it feels before they've even placed an order. That changes everything about how you design.</p></div></div>","l":"Reflection / Learnings"},{"t":"html","h":"<div class=\"fx-sec\"><div class=\"fx-g15\"><p class=\"fx-l\">Team members</p><ul class=\"fx-team\"><li>Damilola Olayiwola - Lead Product Designer/UX Strategist</li><li>Abimbola Bajomo - Chief Product Officer</li><li>Teejay Ajayi - Fullstack Developer</li><li>Tioluwani Bamigboye - Product Manager</li></ul></div></div>","l":"Team Members"}],"frame":"v3","thumb":"media/cs/dropcart-product-v3-01.webp?v=76003a4e","cover":"media/cs/dropcart-product-v3-01.webp?v=76003a4e"}];for(const v of V3){const i=CASES.findIndex(c=>c.slug===v.slug);if(i>=0)CASES[i]=Object.assign({},CASES[i],v);else CASES.push(v);}})();
