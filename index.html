oals",9],["Design Language & Rationale",10],["Solution ~ ",11],["Hi-FI Designs",12],["Dashboard",13],["Transaction receipt screen",14]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Context and Background\n          </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">\n              Lendsqr, a leading Nigerian fintech company, is expanding beyond credit infrastructure to create a more holistic financial experience for everyday users. As part of its consumer app evolution, we introduced Split &amp; Settle — a group expense feature designed to reflect the realities of shared living, social culture, and informal finance in Nigeria.\n              <br><br></p><p class=\"tw-leading-[1.5] tw-mb-0\">From suya nights to rent splitting, Nigerians often handle money communally. But the tools they use—spreadsheets, group chats, transfers—are clunky, stressful, and awkward to manage. This feature was built to change that.</p><p class=\"tw-leading-[1.5]\">Split &amp; Settle is Lendsqr’s answer to social payments—rooted in cultural nuance, trust-building UX, and the flexibility to work across offline and online realities.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"media/cs/lendsqr-cash-split-01.webp?v=39f69e0f","w":1902,"h":870,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Problem\n          </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n            Designing for Shared Realities, Not Just Shared Costs\n          </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n            How might we help Nigerians split expenses in dynamic social groups, without awkward reminders, manual spreadsheets, or clunky confirmations, while preserving trust, transparency, and cultural nuance?\n          </p></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Objective\n          </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n            Rethinking Shared Payments for the Nigerian Social Economy\n          </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n            In Nigeria, money rarely moves alone—it moves in groups. From shared rent and bulk groceries to Friday suya nights and surprise birthday hangouts, social payments are deeply woven into everyday life. But splitting expenses still feels clunky, awkward, and built for a reality that isn’t ours. This project, built into Lendsqr’s consumer app, reimagines the group payment experience with cultural context, trust, and fluidity at its core.\n          </p></div></div>","l":"Objective"},{"t":"img","src":"media/cs/lendsqr-cash-split-02.webp?v=814d9d3a","w":1902,"h":884,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            My Role\n          </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">\n            Product Design | UX Research | Product Design | UX Strategy | Information Architecture | Developer Management | Interaction Design\n          </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n            I led the entire initiative end-to-end. From framing the core problem and defining the user flows, to designing the high-fidelity experience and guiding the implementation. My role also included managing the developer and ensuring the final product shipped with the intended UX integrity.\n          </p></div></div>","l":"My Role"},{"t":"img","src":"media/cs/lendsqr-cash-split-03.webp?v=4e9fbd47","w":1894,"h":1235,"alt":"Investigation & Enquiry Before diving into design, I spoke with real users, flatmates, friends, event planners, and side-hustling corps members, who regularly share expenses. What surfaced wasn’t just friction around money, but the emotional strain and awkwardness that often came with managing it. These conversations, alongside behavioral mapping and light competitive research, revealed pain point","l":"Investigation & Enquiry"},{"t":"img","src":"media/cs/lendsqr-cash-split-04.webp?v=620f50e9","w":1902,"h":848,"alt":"User Personas We interviewed and synthesized insights around three typical user groups:","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Design Goals\n          </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n            Based on user insights and behavioral patterns, I established key design goals that prioritized cultural context, ease of use, and emotional sensitivity. These goals served as guiding principles throughout the process, ensuring that the solution felt not only functional—but familiar, respectful, and intuitive to the people it was built for.\n          </p></div></div>","l":"Design Goals"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-mb-0\"><span class=\"tw-leading-[1.5]\">I intentionally designed for </span><span class=\"tw-[text-decoration-skip-ink:none] tw-[text-underline-position:from-font] tw-[word-break:break-word] tw-decoration-from-font tw-decoration-solid fh7 tw-leading-[1.5] tw-not-italic tw-underline\">recognition</span><span class=\"tw-leading-[1.5]\"> over </span><span class=\"tw-[text-decoration-skip-ink:none] tw-[text-underline-position:from-font] tw-[word-break:break-word] tw-decoration-from-font tw-decoration-solid fh7 tw-leading-[1.5] tw-not-italic tw-underline\">consumption</span><span class=\"tw-leading-[1.5]\">\n                . The app had alot of visual cures to make the app feel familiar, like other fintech tools, but leans more social and approachable. I also applied visual anchoring principles; reducing screen clutter, offering only 1–2 main CTAs per screen, and using color hierarchy to guide user action.\n                <br>\n                It could all be broken down to this:\n              </span></p><p class=\"tw-mb-0\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Typography:</span><span class=\"tw-leading-[1.5]\"> Clean, bold, legible. Prioritizes numbers and CTAs.</span></p><p class=\"tw-mb-0\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Visual Cues: </span><span class=\"tw-leading-[1.5]\">Familiar icons, Nigerian-style emojis, color codes for paid/pending.</span></p><p><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Aesthetics:</span><span class=\"tw-leading-[1.5]\"> Clear and confident. Feels like a trusted financial tool, with a social twist.</span></p></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"media/cs/lendsqr-cash-split-05.webp?v=92e9ae7f","w":1894,"h":2625,"alt":"Solution ~  Key Features We interviewed and synthesized insights around three typical user groups: 🔑 Split for Now, Settle Later Users can log a group expense, assign portions, and allow friends to settle over time—without chasing. 🔑 USSD & Offline Syncing Offline users can log or confirm payment via USSD. The app syncs when back online. 🔑 Group Wallets & Chip-in Events Prepay features for events,","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Hi-FI Designs\n          </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n            From flows to finesse — here’s how the final screens came to life with clarity, culture, and context in mind.\n          </p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"media/cs/lendsqr-cash-split-06.webp?v=ac33ae1f","w":1894,"h":846,"alt":"Dashboard A section on the dashboard is dedicated to payment reminders/request that have been made to certain users within the app ecosystem. with a CTA - ‘Pay Up’ that allows the user carry out their preferred tasks and clear out their payment backlogs","l":"Dashboard"},{"t":"img","src":"media/cs/lendsqr-cash-split-07.webp?v=44482b95","w":1894,"h":846,"alt":"Transaction receipt screen The primary CTA on the transaction receipt for al direct transfers made on the app, is the Split Bill feature, that allows users create a split list of their friends or groups and sends a broadcast payment link to them all respectively","l":"Transaction receipt screen"},{"t":"img","src":"media/cs/lendsqr-cash-split-08.webp?v=fa603b7c","w":1894,"h":846,"alt":"Payment page for customers(web) without the app For users that don’t have the app, whenever they click on the link that has been shared to them, it would take them to a web payment page with multiple options of payment to choose from, but with the ‘Bank Transfer’ option preselected as its statistically the most used payment option in the market at the moment","l":"Payment page for customers(web) without the app"},{"t":"img","src":"media/cs/lendsqr-cash-split-09.webp?v=3c15ef0c","w":1894,"h":846,"alt":"Split bill page On the ‘split bill’ screen, users would get an option to split the bill equally amongst all the users they have added to the list, but in scenarios where the users doesn’t want to spill the bill equally, they can manually input each user’s amount. This button makes it much easier to input amounts for equal debt scenarios When the users are adding participants, they get the option t","l":"Split bill page"},{"t":"img","src":"media/cs/lendsqr-cash-split-10.webp?v=e494fb27","w":1894,"h":846,"alt":"Bill tracking Page The user can track friends and families that have paid or not and can also send them reminders/notifications on their delayed payments using this easy button here","l":"Bill tracking Page"},{"t":"img","src":"media/cs/lendsqr-cash-split-11.webp?v=7fbd428b","w":1896,"h":592,"alt":"Validation & Results Its sticky and shareable Since integrating Split & Settle into Lendsqr’s consumer app, the feature has proven to be more than just useful — it’s sticky, shareable, and genuinely changing how Nigerians handle group money. +20% returning users within 3 months of release –15% drop-off rate at expense confirmation screen +30% re-use rate of existing group splits 1.2x re-use rate d","l":"Validation & Results"},{"t":"img","src":"media/cs/lendsqr-cash-split-12.webp?v=44482b95","w":1894,"h":846,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            Strategic Wins\n          </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n            Looking Back, Building Forward\n          </p><ul class=\"tw-block fh4 tw-leading-[0] tw-list-disc tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">Lower CAC:</span>\n               Group-based features increased organic user acquisition.\n            </li><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">Product stickiness:</span><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\"> </span>Repeat usage signals high trust and emotional alignment.\n            </li><li class=\"tw-leading-[1.5] tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">New revenue channels:</span>\n               Future integrations with vendors and event partners now on roadmap.\n            </li></ul></div></div>","l":"Strategic Wins"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            reflection / Learnings\n          </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n            Looking Back, Building Forward\n          </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Building Split &amp; Settle for Lendsqr wasn’t just about solving for shared expenses, it was about designing around trust, cultural nuance, and infrastructural realities.</p><p class=\"tw-leading-[1.5] tw-mb-0\">For me and the team, this project reinforced a few key lessons:</p><ul class=\"tw-list-disc tw-mb-0\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Designing for humans means designing beyond the screen. We had to think about awkward conversations, low-trust environments, and social etiquette — not just buttons and flows.</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Cultural intuition is product strategy. Features like tone-sensitive reminders or group chip-ins weren’t just UX wins, they reflected lived experiences. That empathy helped the feature resonate.</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Constraints shape clarity. Designing for offline users, USSD confirmations, and partial payments challenged us to simplify, prioritize, and get real about who we were building for.</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Collaboration was everything. Engineering, design, and research worked closely, feeding insights into each iteration. Our best ideas came from cross-functional tension — and deep listening.</span></li></ul><p class=\"tw-leading-[1.5]\">This project reminded us that when you combine strategic thinking, local context, and thoughtful design, even something as “simple” as splitting a bill can feel like a human win.</p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            in conclusion\n          </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh7 tw-leading-[1.5]\">Split &amp; Settle</span><span class=\"tw-leading-[1.5]\"> isn’t just a feature, it’s a cultural bridge. It’s a way of acknowledging that Nigerian life is often lived together, and that money, handled with empathy, can feel less like friction and more like flow.</span></p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n            team members\n          </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Damilola Olayiwola - Product Designer</p><p class=\"tw-leading-[1.5]\">\n              Andrew Sonori - Mobile Developer\n              <br>\n              Karin Adetona - Product Manager\n            </p></div></div></div>","l":"team members"}],"thumb":"data:image/webp;base64,UklGRvgRAABXRUJQVlA4IOwRAABQTACdASq+AL4APpFAm0klo6KhKrdaQLASCWIBIAF/FIP+Z/JXZue3/knz2nGP1D9L8qyhnuUzpeiX9FewB+iv+J/nXs19J39P9Af8z/zv7ne9h6a/+x6gH+l6jPn6/Y8/c39nPZ5//+sW+h+1DwH84XvrPxzJ2nfXTGgyI+WWoF+L/xv/I/l/7LvyPbm675i/tP9l83+c39y6gXBQf2+hj/uPIT9U+wN+un/J/v3tg+zr0kTi3wEG+Q9nB7LtMrevFJfWXL8  facilitating accurate remmitance of local taxes and ensuring adherence to all local regulations. The product suite gives merchants the tools needed to succeed in any country they go-live in.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"media/cs/startbutton-bulk-payment-01.webp?v=872aac6e","w":1902,"h":870,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Bridging the Compliance and Currency Gap for African Global Trade\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Expanding a business across African borders is notoriously difficult. Merchants typically face four major hurdles: the legal requirement to establish a physical local entity, the complexity of navigating diverse tax (VAT/GST) and compliance regulations in each country, and the fragmented nature of African payment methods. These barriers often lead to high operational costs, lengthy setup times (often exceeding 6 months), and lost revenue from potential customers in neighboring markets and FX-currency fluctuations and management.\n            </p></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              One-platform to rule them all: Engineering a Unified Ecosystem for Cross-Border Merchant Operations\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"tw-leading-[1.5]\">The objective was to design a comprehensive Merchant of Record (MoR) platform that abstracts these complexities. The goal was to build a \"</span><span class=\"fh7 tw-leading-[1.5]\">Business-in-a-Box</span><span class=\"tw-leading-[1.5]\">\" solution where Startbutton acts as the legal reseller on behalf of merchants, allowing them to sell, collect payments, and manage finances in multiple African countries instantly without a physical presence whilst also complying with local legal regimes.</span></p></div></div>","l":"Objective"},{"t":"img","src":"media/cs/startbutton-bulk-payment-02.webp?v=aad6c7a8","w":1902,"h":884,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">\n              Product Design | UX Research | Product STRATEGY | UX Strategy | Information Architecture | Developer Management | Interaction Design\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              I led the entire initiative end-to-end. From framing the core functionality for the v.1 and defining the user flows, to designing the high-fidelity experience and guiding the implementation. My role also included managing the developer and ensuring the final product shipped with the intended UX integrity.\n            </p></div></div>","l":"My Role"},{"t":"img","src":"media/cs/startbutton-bulk-payment-03.webp?v=db30f3f8","w":1894,"h":1522,"alt":"Investigation & Enquiry To build a solution that truly solved merchant pain points, we conducted: Stakeholder Interviews : Speaking with cross-border merchants to understand the specific regulatory \"walls\" they hit when expanding; also speaking with the founders to understand their vision for the product and current understanding of regulatory blockers they’ve identified. Competitive Analysis:  Re","l":"Investigation & Enquiry"},{"t":"img","src":"media/cs/startbutton-bulk-payment-04.webp?v=12ffdf64","w":1894,"h":996,"alt":"User Personas We interviewed and synthesized insights around three typical user groups: Koffi Mensah The Cross-Border Retail Specialist Age : 28 Location : Nairobi, Kenya Bio : Koffi operates a high-end apparel brand, specializing in items like luxury footwear (e.g., Nike Air Max). He sells to customers in the USA, UK, and Nigeria. While his sales are high, his business is frequently targeted by f","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Design Goals\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-w-[887px]\"><span class=\"tw-leading-[1.5]\">The primary design goal was to develop a unified, high-trust digital interface that abstracts the inherent complexities of cross-border trade for African merchants. By prioritizing transparency and guided compliance, the platform was designed to transform intimidating legal and financial hurdles—such as local payment collections, taxes and its accompanying hurdles—into intuitive, step-by-step workflows. The focus was on creating a \"</span><span class=\"fh7 tw-leading-[1.5]\">Business-in-a-Box</span><span class=\"tw-leading-[1.5]\">\" experience where users can seamlessly pivot between multi-currency account management (USD, GBP, KSH), contesting fraudulent chargebacks, and generating professional invoices, effectively reducing the logistical barriers to entering global markets.</span></p></div></div>","l":"Design Goals"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-w-[887px]\"><p class=\"tw-mb-0 tw-whitespace-pre-wrap\"><span class=\"tw-leading-[1.5]\">The design language adopted was one of simplicity with ample white space to reduce overall cognitive load on users. To this end, the primary mantra for the design language was </span><span class=\"tw-[text-underline-position:from-font] tw-[word-break:break-word] tw-decoration-from-font tw-decoration-solid fh7 tw-leading-[1.5] tw-not-italic tw-underline\">Transparency, Trust and </span><span class=\"tw-[text-decoration-skip-ink:none] tw-[text-underline-position:from-font] tw-[word-break:break-word] tw-decoration-from-font tw-decoration-solid fh7 tw-leading-[1.5] tw-not-italic tw-underline\">simplicity</span><span class=\"tw-leading-[1.5]\">. As a platform that manages a deluge of financial data, it </span><span class=\"tw-leading-[1.5]\">was</span><span class=\"tw-leading-[1.5]\"> imperative for the platform to be easy on the user’s cognitive capacity in order to reduce the time it takes to complete actions and find information as well as give users the necessary data about their money. We approached this in three ways:</span></p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><ul class=\"tw-leading-[1.5] tw-list-disc tw-mb-0\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Trust and Professionalism:</span>\n                   Since the platform handles significant financial and legal data, I chose a clean, high-contrast interface.\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Information Architecture:</span>\n                   Given the high volume of data (income, expenses, registrations), I utilized a sidebar-driven navigation system to keep core tools like \"Accounts,\" \"Invoicing,\" and \"Bookkeeping\" always accessible.\n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Progressive Disclosure:</span>\n                   To avoid overwhelming users during complex tasks like \"Company Incorporation,\" I designed multi-step flows that only ask for necessary information at each stage.\n                </li></ul><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">This resulted in the following design choices:</p><p class=\"tw-mb-0 tw-whitespace-pre-wrap\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Typography:</span><span class=\"tw-leading-[1.5]\"> Clean, legible. Prioritizes numbers and CTAs.</span></p><p class=\"tw-mb-0 tw-whitespace-pre-wrap\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Visual Cues: </span><span class=\"tw-leading-[1.5]\">Familiar icons, clear color codes for statuses, tooltips.</span></p><p class=\"tw-whitespace-pre-wrap\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Aesthetics:</span><span class=\"tw-leading-[1.5]\"> Clear, clean and breathable. Feels like a trusted financial tool for powerful business scalers.</span></p></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"media/cs/startbutton-bulk-payment-05.webp?v=d16da1b0","w":1894,"h":3378,"alt":"Solution ~  Key Features The platform was built around four central pillars derived from the design requirements: 🔑 Unified Financial Hub (Accounts) Connect, fund, and send across currencies. Convert funds between local and global currencies. 🔑 Flexible Invoicing & Payment Management Tiered invoicing options: Quick Invoices for fast payments or Professional Invoices with tax and discounts. 🔑 Autom","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              A snapshot of some of the clean solutions I designed\n            </p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"media/cs/startbutton-bulk-payment-06.webp?v=f5769f22","w":951,"h":520,"alt":"DASHBOARD","l":"DASHBOARD"},{"t":"img","src":"media/cs/startbutton-bulk-payment-07.webp?v=6987ca92","w":1902,"h":1040,"alt":"Accounts page","l":"Accounts page"},{"t":"img","src":"media/cs/startbutton-bulk-payment-08.webp?v=7c4d4a4f","w":1902,"h":1040,"alt":"ACCOUNTS > CURRENCY PAGE","l":"ACCOUNTS > CURRENCY PAGE"},{"t":"img","src":"media/cs/startbutton-bulk-payment-09.webp?v=77628207","w":1902,"h":1040,"alt":"CHARGEBACKS DETAILS PAGE","l":"CHARGEBACKS DETAILS PAGE"},{"t":"img","src":"media/cs/startbutton-bulk-payment-10.webp?v=04fd6ec4","w":1902,"h":1040,"alt":"CREATE INVOICE","l":"CREATE INVOICE"},{"t":"img","src":"media/cs/startbutton-bulk-payment-11.webp?v=d3c50c42","w":1896,"h":847,"alt":"","l":""},{"t":"img","src":"media/cs/startbutton-bulk-payment-12.webp?v=629fe034","w":1896,"h":592,"alt":"Validation & Results Rapid expansion, onboarding and operations Since the launch of Startbutton’s platform, the product has proven to be more than just useful — it’s seamless, scalable, and genuinely changing how merchants within and outside Africa handle cross-border payments and expansion. $10m + processed within the first 6months of launching the dashboard +150 TRANSACTING MERCHANTS onboarded s","l":"Validation & Results"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Strategic Wins\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Looking Back, Building Forward\n            </p><ul class=\"tw-block fh4 tw-leading-[0] tw-list-disc tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-w-[887px]\"><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">Lower CAC:</span>\n                 Merchant referrals drive organic user acquisition thereby reducing costs.\n              </li><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px] tw-whitespace-pre-wrap\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">Product retention:</span><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\"> </span>Repeat usage signals high trust and business alignment of  being the foremost MOR in Africa.\n              </li><li class=\"tw-leading-[1.5] tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic tw-text-white\">New revenue channels:</span>\n                 Future integrations with payment providers and new features (i.e subscriptions, auto-debit etc).\n              </li></ul></div></div>","l":"Strategic Wins"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Looking Back, Building Forward\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-w-[887px]\"><p class=\"tw-mb-0 tw-whitespace-pre-wrap\"><span class=\"tw-leading-[1.5]\">This project highlighted the significance of designing for \"</span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Regulatory Trust</span><span class=\"tw-leading-[1.5]\">\" and “</span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Local contexts</span><span class=\"tw-leading-[1.5]\">.” In the fintech space, user confidence in the platform is just as crucial as the features offered. I learned to convert complex legal requirements across multiple jurisdictions, such as company incorporation, payments collection and checkout, into user-friendly UI elements that feel empowering instead of overwhelming. </span></p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">If I were to continue improving, I would concentrate on:</p><ol class=\"tw-list-decimal\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Developing more granular and comprehensive tax reporting tailored to specific regions and currencies; </span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Improving localization strategies for merchants; </span></li><li class=\"tw-leading-[1.5] tw-mb-0 tw-ms-[24px]\">\n                  Incorporating user feedback to refine the design process especially for end-customers\n                  ; and \n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Staying updated on regulatory changes to ensure compliance and trust.</span></li></ol></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-w-[887px]\"><span class=\"tw-leading-[1.5]\">Startbutton is a major step in breaking trade barriers in Africa. By integrating regulatory requirements into a user-friendly interface, we turned a lengthy bureaucratic process into a smooth digital experience. From sending funds, converting funds, invoicing, automated bookkeeping and USDT settlement solutions amongst others, every feature equips merchants to operate globally while remaining compliant locally. This project shows that user-centric design can connect fragmented markets, empowering African entrepreneurs to </span><span class=\"fh4 fi tw-leading-[1.5]\">scale beyond borders</span><span class=\"tw-leading-[1.5]\">.</span></p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Damilola Olayiwola - Lead Product Designer</p><p class=\"tw-leading-[1.5] tw-mb-0\">Yusuf Ajide - Product Designer</p><p class=\"tw-leading-[1.5] tw-mb-0\">Kelvin Esekhile - Frontend Developer</p><p class=\"tw-leading-[1.5] tw-mb-0\">Mallick Bolakale - CEO</p><p class=\"tw-leading-[1.5]\" s":[{"t":"hr"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Context and Background\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-mb-0\"><span class=\"tw-leading-[1.5]\">Financial technology in Sub-Saharan Africa has revolutionized how economic value is managed. We've moved from simple P2P transfers to embedded finance and infrastructure-led growth. Nigeria has become a hub for payment innovation, building systems where none existed. By 2025, the focus shifted from \"</span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">banking the unbanked</span><span class=\"tw-leading-[1.5]\">\" to \"</span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">empowering builders</span><span class=\"tw-leading-[1.5]\">,\" emphasizing the need for robust B2B infrastructure. The fragmented payment landscape demands aggregation. Nigeria's Central Bank's push for cashless policies and FX liquidity issues require businesses to adopt multi-currency solutions, managing complex payouts and compliance efficiently.</span></p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Baige emerged as a specialized Wallet as a Service (WaaS) platform designed to bridge the gap in digital financial infrastructure for businesses operating in Nigeria and beyond. The platform operates on a three-pronged architecture involving Admins (Baige), Merchants (Organizations), and End-customers (the final wallet owners). At its core, Baige allows businesses to collect payments in NGN and USD while providing the tools to create and manage multiple sub-wallets for their own customers via a robust API or a centralized dashboard. By offering a white-labeled infrastructure, Baige enables merchants to scale without the heavy lifting of building a proprietary ledger system from scratch.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"media/cs/baige-waas-01.webp?v=c180a48c","w":1894,"h":798,"alt":"Launch Wallets Without Building Infrastructure.","l":"Launch Wallets Without Building Infrastructure."},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Bridging the Compliance and Currency Gap for African Global Trade\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Setting up walleting systems are hard, legally taxing and infrastructurally demanding. Many African merchants face significant hurdles when attempting to scale cross-border operations, particularly regarding multi-currency management (NGN/USD) and stringent KYC (Know Your Customer) compliance. Existing solutions often lack \"granular\" control over individual end-customer wallets, leading to:</p><ul class=\"tw-leading-[1.5] tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Operational Friction</span>: Merchants struggled to manage hundreds of sub-wallets, resulting in a significant increase in manual reconciliation errors.\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Compliance Bottlenecks</span>: Collecting, storing, and upgrading KYC documents of customers across multiple tiers was a fragmented process.\n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Lack of Visibility</span>\n                  : There was no \"eagle-eye\" view for platform admins to monitor the health of transactions and API requests in real-time.\n                </li></ul></div></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Simplifying a Financial Infrastructure for Rapid Scaling\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-mb-0 tw-whitespace-pre-wrap\"><span class=\"tw-leading-[1.5]\">The primary goal was to design a </span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">dual-sided ecosystem; </span><span class=\"tw-leading-[1.5]\">A Merchant Dashboard and an Admin Panel that simplifies the complexities of wallet creation and transaction monitoring. </span></p><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">The key objectives included:</p><ul class=\"tw-leading-[1.5] tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Scalability</span>: Enable merchants to create multiple wallets seamlessly via API or Dashboard.\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Control</span>: Provide granular management tools for wallets, including the ability to disable, deactivate, or view detailed inbound/outgoing transaction logs.\n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Integration</span>: Facilitate one-click connections to major payment gateways like Paystack, Flutterwave, and Stripe.\n                </li></ul></div></div></div>","l":"Objective"},{"t":"img","src":"media/cs/baige-waas-02.webp?v=c2ed3c46","w":1894,"h":586,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">\n              Product Design | UX Research | Product Design | UX Strategy | Information Architecture | Developer Management | Interaction Design\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">As the Lead Product Designer, I was responsible for the end-to-end user experience of the Baige platform across both the merchant-facing side and the admin-facing experiences. My work spanned:</p><ul class=\"tw-leading-[1.5] tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">UX Research &amp; Information Architecture</span>: Mapping out the complex relationships between Organizations and their End-customers.\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Interface Design</span>: Designing high-fidelity web and mobile-web interfaces for both the customer-facing and admin sides.\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Prototyping</span>: Developing interactive flows for wallet creation, KYC uploads, and API monitoring.\n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Systems Design</span>: Establishing a design language that conveys the brand identity, trust, financial security, and data clarity.\n                </li></ul></div></div></div>","l":"My Role"},{"t":"img","src":"media/cs/baige-waas-03.webp?v=7924b9ed","w":1894,"h":1618,"alt":"Investigation & Enquiry Uncovering the Merchant’s and Admin’s needs To understand the needs of our users, I conducted a deep dive into the  API-first versus Dashboard-first  preferences of modern fintechs, especially when it comes to wallet creation and management. Discovery : I found that while developers value the API logs and webhook monitoring features, the operations teams of merchants requir","l":"Investigation & Enquiry"},{"t":"img","src":"media/cs/baige-waas-04.webp?v=77149d42","w":1894,"h":1000,"alt":"User Personas We interviewed and synthesized insights around three typical user groups: Aisha Kys Fintech Operations Manager Age :  31 Location :  Abuja, Nigeria Bio:  Aisha is an Operations Manager at a fintech startup providing virtual accounts and digital wallets. She manages wallet operations, transaction monitoring, customer onboarding, and compliance, but faces challenges with fragmented too","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Design Goals\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              The primary design goal was to create a clarity-first, compliance-ready wallet infrastructure that could scale with both merchants and their end-customers. The experience needed to surface complex financial data in a way that felt intuitive, actionable, and trustworthy, while reducing operational friction for non-technical teams. Every design decision prioritized visibility, control, and auditability, ensuring users could manage multi-currency wallets, monitor transactions, and meet regulatory requirements confidently from a single platform.\n            </p></div></div>","l":"Design Goals"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-mb-0\"><span class=\"tw-leading-[1.5]\">The design language was built on the principles of </span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">clarity</span><span class=\"tw-leading-[1.5]\">, </span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">density</span><span class=\"tw-leading-[1.5]\">, and </span><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">modularity</span><span class=\"tw-leading-[1.5]\">. The design emphasizes a neutral, enterprise‑grade visual language optimized for data density and long operational use. Clarity and consistency drive the experience, with color used for signaling critical states.</span></p><ul class=\"tw-leading-[1.5] tw-list-disc\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Typography &amp; Color</span>: Neutral palette; high‑contrast accents for status indicators\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Tables</span>: Paginated with filters and search for large datasets\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Navigation</span>\n                  : 7 items for customers, 5 for admins; supports deep features like Teams &amp; Permissions\n                </li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Principles</span>: Clarity over aesthetics, consistency across roles, status‑driven UI, progressive disclosure\n                </li><li class=\"tw-ms-[24px]\"><span class=\"tw-[word-break:break-word] fh7 tw-not-italic\">Color Usage</span>: Wallet states, transaction outcomes, risk/failure points, and also brand identity.\n                </li></ul></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"media/cs/baige-waas-05.webp?v=e8d97448","w":1480,"h":3407,"alt":"Solution ~  Key Features We interviewed and synthesized insights around three typical user groups: 🔑 Merchant Dashboard Overview of NGN and USD balances, historical transaction graphs with date filters, and a quick snapshot of operational health. 🔑 Wallet Management Users can manage individual wallets, view owner KYC files, and track every inbound or outgoing transaction 🔑 Transactions monitoring ","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              The platform was designed primarily for Web, but I also developed a Mobile-Web version to ensure that merchants could monitor their dashboard and approve requests on the go.\n            </p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"media/cs/baige-waas-06.webp?v=f79fff62","w":1480,"h":664,"alt":"Merchant dashboard","l":"Merchant dashboard"},{"t":"img","src":"media/cs/baige-waas-07.webp?v=92dca97b","w":1894,"h":850,"alt":"Wallets","l":"Wallets"},{"t":"img","src":"media/cs/baige-waas-08.webp?v=8c6040d0","w":1894,"h":850,"alt":"Customer details","l":"Customer details"},{"t":"img","src":"media/cs/baige-waas-09.webp?v=f1e326d5","w":1894,"h":850,"alt":"APIs","l":"APIs"},{"t":"img","src":"media/cs/baige-waas-10.webp?v=d4f78f49","w":1894,"h":850,"alt":"ADMIN dashboard","l":"ADMIN dashboard"},{"t":"img","src":"media/cs/baige-waas-11.webp?v=0bc0d4a3","w":1894,"h":850,"alt":"ADMIN-MERCHANT’S DETAILS","l":"ADMIN-MERCHANT’S DETAILS"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Looking Back, Building Forward\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">Designing the Baige platform taught me that in Fintech B2B platforms, information density is a feature, not a bug, as long as it is properly organized. The project also taught myself and the team a few key lessons:</p><ul class=\"tw-list-disc tw-mb-0\"><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Fintech products succeed on clarity, not creativity</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Admin tools deserve as much design attention as user apps</span></li><li class=\"tw-mb-0 tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Tables, filters, and exports are powerful when designed well</span></li><li class=\"tw-ms-[24px]\"><span class=\"tw-leading-[1.5]\">Compliance isn't just a legal requirement; it's a core part of the user journey that needs to be as seamless as the payment itself</span></li></ul><p class=\"tw-leading-[1.5] tw-mb-0 tw-whitespace-pre-wrap\">​</p><p class=\"tw-whitespace-pre-wrap\"><span class=\"tw-[word-break:break-word] fh7 tw-leading-[1.5] tw-not-italic\">Future Thinking:</span><span class=\"tw-leading-[1.5]\"> For future iterations, I would look into implementing automated \"Charge\" adjustments based on transaction volume to further empower the Admin side.</span></p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              You can think of Baige as a digital bank-in-a-box. Just as a landlord provides an apartment building (the infrastructure) but allows each tenant to decorate and manage their own room (the wallets), Baige provides the secure structure for merchants to host and manage thousands of individual accounts for their own customers without having to build the building/infrastructure themselves.\n            </p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Damilola Olayiwola start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Context and Background\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Modern enterprises often grapple with disjointed data silos when attempting to craft long-term business strategies. For many organizations, the transition from raw financial data—like P&amp;L statements and balance sheets—to actionable market insights is a manual, labor-intensive process that can take weeks of consulting hours. This fragmentation leads to a \"strategy-execution gap,\" where a reported 65% of businesses fail to meet their annual targets due to outdated or misaligned financial models.</p><p class=\"tw-leading-[1.5]\">...</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"media/cs/strategy-360-smart-business-01.webp?v=7e12c7fd","w":1894,"h":798,"alt":"AI innovation for your business","l":"AI innovation for your business"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Overcoming the Fragmentation of Strategic Planning and Financial Forecasting\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">Modern enterprises often grapple with disjointed data silos when attempting to craft long-term business strategies. For many organizations, the transition from raw financial data—like P&amp;L statements and balance sheets—to actionable market insights is a manual, labor-intensive process that can take weeks of consulting hours. This fragmentation leads to a \"strategy-execution gap,\" where a reported 65% of businesses fail to meet their annual targets due to outdated or misaligned financial models.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Furthermore, the lack of real-time competitive intelligence means that most strategies are reactive rather than proactive. Without a centralized system to parse complex legal documents and market trends, leadership teams are often forced to make high-stakes decisions based on incomplete information. This inefficiency results in an average 20% loss in potential revenue due to missed market opportunities and unmitigated operational risks.</p></div></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Democratizing High-Level Business Intelligence through AI Automation\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">The primary goal of Strategy360 was to develop a \"360-degree\" strategic ecosystem that could ingest raw corporate documents and instantly output sophisticated financial models and operational roadmaps. We aimed to reduce the time spent on manual data entry by 85%, allowing executives to shift their focus from data gathering to strategic decision-making. By leveraging AI to parse everything from partnership agreements to five-year cash flow projections, the objective was to provide a \"single source of truth\" for business health.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Success was defined by creating a platform capable of generating a comprehensive \"Market Attractiveness\" score and a \"Pioneer-Enhance-Mimic\" (PEM) model within minutes of data ingestion. We set a target to improve project completion rates by 30% through integrated performance trackers and automated initiative heatmaps. Ultimately, the objective was to empower businesses to scale rapidly while maintaining a clear view of their burn rate and long-term solvency.</p></div></div></div>","l":"Objective"},{"t":"img","src":"media/cs/strategy-360-smart-business-02.webp?v=1bee2fd7","w":1894,"h":586,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">Lead Product Designer &amp; UX Strategist</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">I served as the Lead Product Designer, responsible for the end-to-end user experience of the Strategy360 platform. My responsibilities spanned from initial Information Architecture (IA) and user flow mapping to the creation of a high-fidelity design system that could handle complex data visualization. I collaborated closely with the engineering team to ensure the AI's \"parsing\" states were transparent to the user, reducing the anxiety associated with automated data processing.</p><p class=\"tw-leading-[1.5]\">Beyond visual design, I acted as a UX Strategist, defining how the platform would translate dense financial ratios into digestible dashboards. I led the design of the \"Operational Modelling\" suite, ensuring that the transition from strategic planning to implementation roadmaps was seamless and intuitive. This involved managing the handoff of over 150 unique screens and documenting component behaviors for a scalable build.</p></div></div></div>","l":"My Role"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">Investigation &amp; Enquiry</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Decoding the Complexity of Strategic Friction\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">To understand the pain points of our target demographic, we conducted a deep dive into how C-suite executives and financial analysts interact with legacy strategy tools. Our research revealed that 74% of users felt \"overwhelmed\" by traditional financial modeling software, often resorting to manual Excel sheets that lacked collaborative depth. We analyzed over 200 support logs from similar SaaS platforms, finding that \"navigational confusion\" accounted for 55% of user drop-offs during the onboarding phase.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">We also performed a competitive audit of platforms to identify gaps in \"User Confidence\". The investigation showed that while many tools provided data, very few provided \"insight.\" This discovery led us to prioritize features like the \"Risk Heat Map\" and \"Buyer Experience Cycle,\" which transform raw numbers into visual narratives. By decoding these frictions, we were able to map a journey that takes a user from \"Document Upload\" to \"AI Strategy\" in under six steps.</p></div></div></div>","l":"Investigation & Enquiry"},{"t":"img","src":"media/cs/strategy-360-smart-business-03.webp?v=a6d19a93","w":1894,"h":1108,"alt":"User Personas Tailoring Strategy for the Visionary and the Operator We interviewed and synthesized insights around three typical user groups: Abdullah The Strategic Visionary Age:  35 Location:  Saudi Arabia About:  Abdullah is focused on high-level market positioning and long-term valuation. They need a bird's-eye view of \"Market Attractiveness\" and \"Competitive Advantages\" to secure funding and ","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Clarity through Structured Minimalism\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">The design language for Strategy360 was built on the principle of \"Confidence through Clarity.\" Given the high cognitive load of financial data, we utilized a clean, structured layout with ample white space to prevent user fatigue. A professional color palette was selected to instill trust, while vibrant accents were reserved for \"AI Generating\" states and \"Success\" indicators to keep users engaged during processing times.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">We adopted a multi-layered \"Dashboard-Centric\" architecture, drawing on Jakob’s Law to ensure the interface felt familiar to users of enterprise tools. The rationale behind the \"Node-Based\" navigation was to allow users to jump between strategic modules—like \"Macro Trends\" and \"Financing\"—without losing their place in the overall flow. This modular approach ensures that the platform feels like a cohesive \"360-degree\" guide rather than a collection of separate tools.</p></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"media/cs/strategy-360-smart-business-04.webp?v=12953143","w":1303,"h":3369,"alt":"Solution ~  Key Features The 360° Strategic Dashboard for end-to-end planning The core of Strategy360 is the AI-Powered Document Parser, which automates the extraction of mission statements, financial data, and director details from uploaded PDFs. This is complemented by the Dynamic Financial Modeler, which allows users to switch between bottom-up and top-down planning while visualizing 5-year rev","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">The high-fidelity designs focus on creating a \"Command Center\" feel for the user. We developed a robust set of data visualization components, including revenue project forecast charts and interactive risk heat maps. Each screen was designed to be responsive, ensuring that executives can review their \"Macro Market\" trends on a tablet as easily as on a desktop.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Key attention was paid to the \"AI Feedback\" loop, where users can \"Approve\" or \"Regenerate\" suggestions for market segmentation and buyer experience cycles. This interactive element ensures the user remains the ultimate decision-maker while the AI does the heavy lifting. The final design system included over 40 reusable components, ensuring consistency across the \"Financial\" and \"Operational\" modules</p></div></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"media/cs/strategy-360-smart-business-05.webp?v=59f83417","w":1243,"h":558,"alt":"","l":""},{"t":"img","src":"media/cs/strategy-360-smart-business-06.webp?v=ebba2a03","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/strategy-360-smart-business-07.webp?v=fa5e94fb","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/strategy-360-smart-business-08.webp?v=41002cf9","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/strategy-360-smart-business-09.webp?v=c5825ce7","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/strategy-360-smart-business-10.webp?v=bc0e2391","w":1896,"h":930,"alt":"Validation & Results Measurable Impacts on Strategic Efficiency Post-launch metrics indicated a significant shift in how users approach strategic planning. We observed a 45% increase in user engagement with the financial modeling module, with the average time to generate a comprehensive 5-year plan dropping from two weeks to just 48 minutes. Furthermore, 70% of early adopters reported that the \"In","l":"Validation & Results"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Designing for the Gap between Data and Insight\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">This project reinforced that in the world of AI-driven SaaS, \"Confidence is as important as Functionality.\" We learned that simply providing data isn't enough; the design must guide the user through the meaning of that data. By organizing content into logical stages like \"Who You Are,\" \"Your Environment,\" and \"How to Operate,\" we made a daunting process feel manageable and structured.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Another key takeaway was the importance of the \"Human-in-the-Loop.\" While our AI could generate complex market trends and risk assessments, users needed the ability to \"Edit\" and \"Confirm\" these findings to truly own the strategy. Moving forward, I would focus even more on the \"Glossary\" and educational nodes to further bridge the language gap for first-time business owners.</p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              You can think of Baige as a digital bank-in-a-box. Just as a landlord provides an apartment building (the infrastructure) but allows each tenant to decorate and manage their own room (the wallets), Baige provides the secure structure for merchants to host and manage thousands of individual accounts for their own customers without having to build the building/infrastructure themselves.\n            </p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Damilola Olayiwola - Lead Product Designer/UX Strategist\n            </p></div></div>","l":"team members"}],"thumb":"data:image/webp;base64,UklGRugOAABXRUJQVlA4INwOAACwPwCdASq+AL4APpFEnUqlo6KiJZmaELASCWVu3V8iuf1xmp9+FozG/m4vy+jr/AeoBzw/MZ5wvpm/wG+b+gt+wHpzezj/fP+l6WmrLMf/zvhn46fS/7L+zvrF5m+tnUm+Xfdf9X/evPX7cvNX4k/2HqEfkn82/2e8n2p9AL2J+of83/B+OJ/c+gn2E/13uAfyv+jf9LjmfNvYA/n/9m/5X3AfTT/V/tF5+v0H/O+wb/P/7r1xfSAJmwZL3wpQQCmHcu97lvKzrJQyjVeGTuXEbtryFnrYBAKXNUoLEqyI0yE/EzQpKIpWevpSommNo1oPcqTt6Ge5CM9eY/zgB01si1thk8knGEZ8al5JAqz0eHwrpjoBLkziH82XEoZ3lZlamk56nyfevdLkXX4Y7yJQu0m9/mLi6Hj2K+5AHMHNcYpMIAFR9+IuHirlZFM2HkdokDYMG2xc3BJXxfdADHS6qAs54N3KjeldHMLqd/C25GftrfB1qVJ+f81ud4UZM24N9Du7FLvGeikWAYuduX7fzBV9KKodOgFaWmU+E1dykNsx7ZwSyMCJeZOcHWTnYk1Tg15h/EoCRUZco+U+CQGCZRgjdkfYEd7rz7+hu6uzPQtPFkvqnov5aslaHOqE57YephVcB9Yu85RaMxyd0XYWqEwwCmH1jRbLP478CIbxsv7/e3e2AAD++SrvIQ+lwL97XMW5AG/AAZR8waFyJwvZYxliP3iSvDrT4LqziqD6Lpt15dT4/AUtn8C1LGZG0tAUuzPIrVa10f48bdvjhDAGa2jasTDphu1tsgBiACv37wLeh7anbPULkE/TYBvlTIN/CK7cHRKGzEbvrztv4IGOlHN6FrBGXUXDbezvuNys/MZplCQ6BgL7BMypIXmWDDwXeueHQTOWFTmsf1LvEtC44PPJ+MJfbgJ3kDV1rZYMV7L5nFkXyDTWovB+fJIGZKcxYeMFkGGh3269h7egbU5NBjULwW3RCDaX8YrpbkUxNpej9Rpgv02l+DvigBDqVks6d4uYKWcpRqcOCkjY9zSlo7tg9N/3gRZ5ROH/Bz8IMjyo8ThELDjOrf2Xr+U6r2n1A+XmaSiYKofh1VDU5h/TRGV3M5W5ucOhERMfaNg/MyQ/9A6bPBuz2zdt7w9Z34UJksBGgW10eOlMs1Qveb6gYmPPliXoa0BQINicsFxj2ZcinQOpOojgC7b70kUHpMUlM2nqmOLfE4MwsfI5sEgsByny80tw0s6ValWj079A4qdCFl4VaqOOTx0mvza9Fy71ph9Kq7mYpw0druQB8lxksrcj7Aca5WD2fLn/0C+jo1BGJNGKfk4Ck/1nqJhAD6he/hK+6FaC+YDzMdkl8WO8YlDXy7LWCFzgH0i/9YLKYfowu+RBVoz38leo65oUWLRJE+nSxBbt6V0F6Kf+D2USwuNHfe62avfbOXUua0C+pGBKEtdWC5jk9hdv32z39RyFaD3W0bHqnmr45i4LDOy46AeQ4FORiqV9xm0BEDlwkM8ArSC63Hs5B4ogbGr8EVUT4wkREy1JWvUbatPWQp+l6vgFCpK1DPM6QAXfc45zUGZNasPeTocsclVJe5Nm0l2z
