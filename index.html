n              Context and Background\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">IntelAI was conceived as a comprehensive AI Community Workspace to address the escalating challenges of information fragmentation and engagement fatigue in modern digital communities. As decentralized projects and influencer networks scale, they often encounter a \"Context Vacuum,\" where critical project data resides in static PDFs or GitBooks while community interactions happen in real-time on platforms like Telegram, Discord, and X. This disconnect leads to community managers spending over 60% of their time answering repetitive queries, leaving them unable to focus on high-level growth or crisis management. Our goal was to create a \"Community Brain\" that could ingest project-specific data and provide instant, accurate, and on-brand responses across all integrated channels. </p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">The initiative targeted two distinct but interconnected user segments: Community Managers handling large-scale memberships and Influencers (Key Opinion Leaders - KOLs) needing to scale content production. For managers, the platform provides a centralized hub to train AI agents on project whitepapers and roadmaps, automate spam filtering, and manage escalation reports for complex queries. For influencers, the focus was on a multi-format content support system that uses the same project-specific intelligence to generate tweets and content calendars that remain 100% faithful to the project's \"Truth\". By providing both a high-fidelity desktop dashboard for deep management and a streamlined mobile interface for engagement on the go, IntelAI ensures that community intelligence is never more than a click away.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"media/cs/intelai-platform-01.webp?v=f79562a7","w":1894,"h":798,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-min-w-full tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[min-content]\">\n              The Engagement Fatigue and Context Vacuum in Rapidly Scaling Communities\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">As digital ecosystems; particularly within the Web3 and Influencer sectors; experience explosive growth, community managers and KOLs (Key-Opinion-Leaders) face a dual-pronged crisis: engagement fatigue and contextual irrelevance. High-growth communities on platforms like Telegram and Discord generate thousands of messages daily, yet 74% of these interactions are repetitive queries regarding project fundamentals, tokenomics, or basic troubleshooting. Human moderators are often overwhelmed, leading to slow response times and missed opportunities for high-value engagement, while standard AI tools often provide generic, \"hallucinated\" answers that lack the specific nuance of the project’s whitepaper or roadmap.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">The friction lies in the \"Context Vacuum.\" When projects scale, the gap between the available information (whitepapers, pitch decks, FAQs etc etc) and the community's immediate needs widens. My research indicated that community managers were spending upwards of 40 hours a week manually filtering spam and answering the same 15-20 questions. Without a system that could \"learn\" the project’s specific DNA and respond in real-time across multiple channels, projects were seeing an average of 30% drop in community sentiment during critical launch phases due to information bottlenecks.</p></div></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Engineering a Context-Aware Neural Infrastructure for Global Communities\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">The objective was to design a comprehensive AI-driven workspace that bridges the gap between static project data and active community engagement. We set out to build IntelAI, a platform that allows community owners to \"train\" their own custom AI agents by simply uploading project-specific assets such as PDFs, Docs, Screenshots, GitBooks, Pitch Decks etc. The goal was to move beyond a simple chatbot and create a \"Community Brain\" capable of not only answering questions but also generating on-brand content, blocking harmful spam, and escalating complex issues to human moderators when necessary.</p><p class=\"tw-leading-[1.5]\">Functionally, the platform needed to be hyper-integrative and scalable. We aimed to reduce the time-to-resolution for community inquiries by about 80% while increasing content output for KOLs and influencers by around 3x. By providing a simulation workspace where users could test prompts before deploying them to live environments like Telegram or X (Twitter), we sought to give project owners 100% confidence in their automated voice, ensuring that every AI-generated response was rooted in the \"Ground Truth\" (largely) of their uploaded documentation.</p></div></div></div>","l":"Objective"},{"t":"img","src":"media/cs/intelai-platform-02.webp?v=9a097162","w":1894,"h":586,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">Lead Product Designer &amp; UX Strategist</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">I led the end-to-end design lifecycle for both the Desktop and Mobile versions of IntelAI, serving as the bridge between technical AI capabilities and user-centric design. My responsibilities spanned from initial UX research and information architecture to high-fidelity UI design and interaction prototyping. I focused heavily on the \"Training Flow,\" ensuring that the complex backend process of parsing large documents was translated into a simple, intuitive progress-driven interface for the user.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Beyond the visuals, I also acted as the UX Strategist, defining the \"Simulation\" and \"Escalation\" frameworks. I worked closely with the engineering team to ensure the \"Parsing\" states were communicated effectively to users, reducing the anxiety of waiting for AI training to complete. By managing the developer handoff and implementation phase, I ensured that the multi-platform experience remained consistent, whether a community manager was reviewing an escalation report on their desktop or a KOL was generating a tweet on the go.</p></div></div></div>","l":"My Role"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">Investigation &amp; Enquiry</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Figuring out the Friction in Automated Moderation\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">To build a truly effective tool, we conducted a deep-dive audit of existing community management workflows. We analyzed a plethora of support logs across major Web3 projects and discovered that around 62% of \"critical\" community issues were actually easily resolvable navigation or glossary gaps. However, the existing tools were fragmented; cus moderators were jumping between Telegram bots for spam and Notion for project info, creating a massive cognitive load and an average response delay of 14 minutes per query.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">We equally discovered a significant \"Trust Gap\" regarding AI. Users were hesitant to use automated tools because they couldn't see \"under the hood.\" This led to the design of our Simulation Workspace, where we mapped user interactions to see how they tweaked prompts. We found that users felt 90% more confident in automation when they could \"dry-run\" the AI against their own documentation. These insights shifted our focus from a \"Set and Forget\" bot to a \"Train, Test, and Deploy\" ecosystem.</p></div></div></div>","l":"Investigation & Enquiry"},{"t":"img","src":"media/cs/intelai-platform-03.webp?v=1e671a56","w":1894,"h":1108,"alt":"User Personas A community Manager and A web3 Influencer We synthesized our insights around two primary typical user groups: Marcel Punjab Lead Community Manager Age:  25 Location:  United Kingdom (UK) About:  Marcel is the Lead Community Manager\" for a mid-stage DeFi protocol. Marcus handles a community of 50,000+ members across four time zones. His biggest pain point is information fragmentation;","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Dark Mode Sophistication for the Web3 Digital Frontier\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">The visual identity of IntelAI was crafted to feel authoritative, futuristic, and efficient. We opted for a deep \"Foundry Dark\" palette, which reduces eye strain for users/community managers who spend 8+ hours a day no-lifing on dashboards. The UI uses high-contrast neon accents (mint green and electric blue) to draw attention to critical \"Quick Actions\" and \"Outstanding Tasks,\" ensuring that even in a data-dense environment, the user’s next step is always clear.</p><p class=\"tw-leading-[1.5]\">Also, our information architecture method was a \"Context First\" approach. Thus every screen is anchored by the project's current status; whether the AI is \"Parsing,\" \"Trained,\" or \"Engaging\". We utilized a modular \"Card-Based\" layout for the integration section, allowing users to clearly see the health of their various channels (Telegram, X, Discord) at a glance. This creates a sense of \"Mission Control,\" giving users a psychological feeling of mastery over their complex digital ecosystems.</p></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"media/cs/intelai-platform-04.webp?v=2a975c1b","w":1894,"h":3130,"alt":"Solution ~  Key Features Three-Pillar Approach to Intelligent Engagement The core of Strategy360 is the AI-Powered Document Parser, which automates the extraction of mission statements, financial data, and director details from uploaded PDFs. This is complemented by the Dynamic Financial Modeler, which allows users to switch between bottom-up and top-down planning while visualizing 5-year revenue ","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">The high-fidelity designs focus on cross-platform parity. On Desktop, the workspace provides an expansive view of analytics, escalation reports, and simulation logs, allowing for deep-dive management. On Mobile, the experience is distilled into \"Management on the Move.\" The training flow uses a simplified, step-by-step wizard, and the tweet generator features a \"Tap-to-Edit\" interface optimized for thumb-driven interactions. Key design elements include the \"AI Parsing State\" animations, which provide visual feedback during the heavy processing of documents, and the \"Success Modals\" that confirm successful integrations with platforms like Telegram via QR codes. Every high-fidelity screen was tested for usability, ensuring that critical alerts (like a high spam rate) are instantly recognizable through both color and iconography.</p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"media/cs/intelai-platform-05.webp?v=5d071ad4","w":1184,"h":531,"alt":"","l":""},{"t":"img","src":"media/cs/intelai-platform-06.webp?v=2ad54bf9","w":1776,"h":797,"alt":"","l":""},{"t":"img","src":"media/cs/intelai-platform-07.webp?v=33d10e4a","w":1184,"h":531,"alt":"","l":""},{"t":"img","src":"media/cs/intelai-platform-08.webp?v=54a959ae","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/intelai-platform-09.webp?v=304e3a1c","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/intelai-platform-10.webp?v=49fb49c6","w":1894,"h":690,"alt":"Validation & Results Measured Impact metrics Within the first 12 weeks of deployment across our beta partner projects, we observed a transformative shift in community metrics. By automating 85% of repetitive project inquiries, we saw an immediate 41% reduction in monthly support tickets. Most importantly, the average \"Time to Resolution\" for community queries dropped from 14 minutes to under 45 se","l":"Validation & Results"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Designing for the Gap between Data and Insight\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Looking back, this project reinforced a critical UX lesson that’s now at the fore of current design discussions, that: AI is a collaborator, not a replacement. Initially, we thought users wanted a \"black box\" that handled everything. However, we learned that the most valuable part of IntelAI wasn't just the automation—it was the control we gave back to the users through the training and simulation features. When users could see what the AI \"knew,\" they trusted the system to represent their brand.</p><p class=\"tw-leading-[1.5]\">If I were to start over, I would focus even earlier on the \"Retraining Loop.\" Projects evolve fast, and we found that users needed a more seamless way to \"Update Context\" as their roadmaps changed. Designing a system that feels alive and evolving alongside the project is the next frontier for community management tools. We didn't just design a dashboard; we designed a way for projects to maintain a consistent, intelligent presence in a 24/7 global market.</p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">The deployment of IntelAI across our beta partner projects yielded transformative results, proving that trainable AI is a fundamental requirement for modern community management. Within the first 8 weeks of launch, we observed that 52% of community members were able to resolve their inquiries through the AI's self-service capabilities without ever needing to contact a human moderator. This shift led to a 41% reduction in monthly support tickets, significantly freeing up internal teams to handle high-priority technical issues. Additionally, the average resolution turnaround time for common community queries dropped by 35%, moving from minutes to under 45 seconds.</p><p class=\"tw-leading-[1.5]\">Beyond operational efficiency, the platform successfully bridged the \"Confidence Gap\" for both project owners and community members. Influencers utilizing the AI tweet generator saw a 73% increase in engagement due to their ability to post higher-quality, contextually accurate content more frequently. The Spam Prevention Tool also proved critical, effectively neutralizing malicious bot activity and harmful links with a 99.8% success rate, thereby fostering a safer community environment. Ultimately, the project demonstrated that when AI is designed as a transparent collaborator—allowing users to simulate and update context in real-time; it moves beyond simple automation to become a true engine for scalable human engagement.</p></div></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Damilola Olayiwola - Lead Product Designer/UX Strategist\n            </p></div></div>","l":"team members"}],"thumb":"data:image/webp;base64,UklGRnwGAABXRUJQVlA4IHAGAAAwKQCdASq+AL4APpFEnUmlpCMhKhRJOLASCWdu8p/SC/Avx3lt9AdH/g/6PfAAzDnig9+g3/ebsTnqNNa6LX1jP9RklvmL/KdJ/k7nCefvsX2pd2z0f9gPCfxF/1WtQx6eg9nNeuvYN6XxY+eVRwwP8U1OoTXOgUx43yHf/cTD196TI+wkxkPa/lkBGwmH29npfGtlzdGn7ZnKuME0G87DveaM+0w8X/ca/FXP9NXPaJMPW/CZH6BNCSREPTwrqSLnOFoELqwIXp79oQj34X/RsAC4mg/5FvnbaJcjTCNFR+x2g5LxeIdAGv4+3V3cRmvUaNiTLzByiBCLMFCrXisxY8IEJUvSZ2NWj2AMY5qjsI3zhBxuZHCyrdY8UcXD96/rpVc1cn+yH5c/GTj7uBTny1vZc3xnArVqZlszWFp8ma7Bdph6/QiLSq8zUXwy+BJwAAD+7aIhFgJ5ig+LWi2TgCfBWQsfqWfZZXOj/4gDtSNmpMFyRl6LFf7yRXW1Z6XO7I/lkHjx1ElpoPPhpkDlExzxq3zQCW6CFmn4V3Xix3KDi9vGLmHsHtsLnRsBAGpYJ2gPaujs9Bn3h8WLovA+A/Gl6+E97K2qxM6f5+DcWG14a4RftURfWRw+8c4LDztRuql7+5oa86D083DRpcdOhxVPAcQcDbilo5OXHmv1cjKUxgv+RG35cgc6hMl8/SZSY5kXwaWbaxOPVFIbJL06ynb5m4MT856Q5gLTnao/X2ofqvyhWM19K34YiIaLh3hHvnxOalAnztVRtvb283JVjqOHeH+AgKuFYUQZQnShQKa/SiJOKZHLPGfsZ2T2Cfw5BgtC8lyEVkMQwpD9Q4Lq9AniGTokLPtkuzQ+apJQorVKx8Pq5Zo0gpr40Uj1CHeQTlrnaIf+RWR3jVCXRUB729lAddnO83kE6UhOG3cG8LFSs2J4RVSqM0Af1GBqJXhilQq67mQvW9JQbcuoX94nWbL6 ,"site":"","title":"Connecting skilled artisans with clients","sub":"","toc":[["Context and Background",1],["Problem",3],["Objective",4],["My Role",6],["Investigation & Enquiry",7],["User Personas",8],["Design Language & Rationale",9],["Solution ~ Key Features",10],["Hi-FI Designs",11],["Validation & Results",17],["Reflection / Learnings",18],["Team Members",20]],"secs":[{"t":"hr"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Context and Background\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">Anwrk was conceived as a digital intervention for the highly fragmented informal service sector in Nigeria. In markets where word-of-mouth is the only currency for hiring, both clients and artisans suffer from a lack of transparency and structure. Clients struggle to find reliable help, while skilled artisans lack the digital presence to reach a wider customer base beyond their immediate physical vicinity.</p><p class=\"tw-leading-[1.5]\">The platform serves as a specialized marketplace connecting users with verified professionals across key verticals such as Electricity, Plumbing, Carpentry, AC Repair and many more. By providing a centralized space for discovery, communication, and secure payments, Anwrk aims to professionalize manual labor and provide a seamless maintenance experience for home and property owners.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"media/cs/anwrk-brand-product-01.webp?v=630a193d","w":1243,"h":524,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Problem\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-min-w-full tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[min-content]\">\n              Discovery Friction and the Trust Deficit\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">The primary hurdle in the local artisan market is a profound \"confidence gap.\" Our research indicated that about majority (about 72%) of clients had experienced inconsistent pricing, while 54% cited safety concerns when inviting unverified workers into their homes. Without a central repository for reviews or credentials, discovery was a game of chance really, often resulting in sub-par work or financial disputes. For artisans, the problem was visibility and payment security. Many skilled craftsmen remained underemployed because they lacked the tools to showcase their portfolios or guarantee that they would be paid once a job was finished. This unorganized system leads to a 45% abandonment rate in the hiring process, as users were often too overwhelmed by the friction of finding a trustworthy professional.</p></div></div>","l":"Problem"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Objective\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Designing for Accountability and Rapid Discovery\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">The primary objective was to reduce the time-to-hire from several days to under five minutes by implementing a high-precision, location-based discovery engine. We aimed to build an ecosystem where every artisan is verified through a rigorous KYC process involving National Identity Numbers (NIN) and utility bill validation, ensuring 100% profile authenticity. Success was also defined by financial transparency. We set out to build a \"Price Lock\" escrow system that protects both parties; securing the client's funds and guaranteeing the artisan's payment upon project completion. The goal was to increase the average artisan’s monthly earnings by about 35% within the first six months by providing them with a verified digital storefront and a robust portfolio tool to showcase their expertise.</p></div></div>","l":"Objective"},{"t":"img","src":"media/cs/anwrk-brand-product-02.webp?v=99c248d7","w":1894,"h":586,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My Role\n            </p><p class=\"fm5 tw-leading-[1.48] tw-relative tw-shrink-0 tw-text-[16px] tw-text-white tw-tracking-[0.16px] tw-uppercase tw-w-[891px]\">Lead Product Designer &amp; UX Strategist</p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">As the Lead Product Designer, I directed the end-to-end initiative, from ethnographic user research to the delivery of a high-fidelity design system. My responsibilities included defining the information architecture for two distinct user types, Clients and Artisans, ensuring that the transition between discovery and project management was frictionless for both.</p><p class=\"tw-leading-[1.5]\">I also managed the implementation phase, working directly with developers to ensure the complex logic of the digital wallet and the tiered KYC verification flows were executed with UX integrity. My role was as much about strategy as it was about execution, as I had to balance technical constraints with the need for a highly accessible interface for users who may have limited experience with SaaS tools.</p></div></div></div>","l":"My Role"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">Investigation &amp; Enquiry</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Belling the cat-friction in Manual Labor\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">We didn’t just analyze the hiring funnel; we decoded the emotional triggers behind the market's friction. By reviewing past support logs and conducting field interviews, we found that 62% of disputes were caused by vague verbal agreements that changed during the project. This insight led directly to the development of the \"Project Detail\" and \"Price Lock\" features to serve as a digital contract.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">I also studied global service platforms and local fintech apps to understand how users in emerging markets interact with security features. The investigation revealed that users preferred \"search-first\" interfaces that felt familiar, like Google for example. This led us to move away from complex directories in favor of a clean, intent-driven search experience that prioritized proximity/distance and reputation.</p></div></div></div>","l":"Investigation & Enquiry"},{"t":"img","src":"media/cs/anwrk-brand-product-03.webp?v=bc505dfe","w":1894,"h":1108,"alt":"User Personas A Client and his Master Craftsman We interviewed and synthesized insights around three typical user groups: Tunde Turner A very busy manager Age:  27 Location:  Lagos, Nigeria About:  Tunde needs an electrician to fix a recurring fault in his Ikeja office. He doesn't have time to haggle or supervise unverified workers. His priority is speed, verified credentials, and the ability to p","l":"User Personas"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">Design Language &amp; Rationale</p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Trust and Simplicity\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><p class=\"tw-leading-[1.5] tw-mb-0\">The design language was rooted in Jakob’s Law—using familiar UI patterns to build immediate trust. We utilized a clean, high-contrast palette with clear status indicators to ensure that project states (e.g., \"In Progress,\" \"Completed\") were unmistakable at a glance. This was critical for maintaining transparency in an environment where financial transactions were also occurring between strangers.</p><p class=\"tw-leading-[1.5] tw-mb-0\">​</p><p class=\"tw-leading-[1.5]\">Further, we prioritized information density for the Artisan profiles, highlighting the artisan’s \"Projects Completed\" and \"Average Response Time\" to help clients make informed decisions quickly. For the Artisan's view, we designed an \"Insights\" dashboard that visualized growth in earnings and profile views, creating a gamified incentive for them to maintain high service standards.</p></div></div></div>","l":"Design Language & Rationale"},{"t":"img","src":"media/cs/anwrk-brand-product-04.webp?v=eb9e5827","w":1894,"h":3334,"alt":"Solution ~  Key Features A Living Support and Service Ecosystem The core solution is the Integrated Chat & Hire Flow. This feature allows for real-time negotiation followed by a \"Price Lock\" mechanism that secures the agreed amount in the Anwrk wallet. This ensures that artisans are entitled to payment once the project is initiated and successfully completed, effectively acting as a sort of escrow","l":"Solution ~ "},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Hi-FI Designs\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">The final designs emphasize a \"Search-First\" landing page, allowing users to instantly find artisans within a 2km radius. We introduced category filters for Electricity, Plumbing, and more, with advanced sorting options for minimum ratings and verification status to give clients absolute control over who they hire. The project management screens were designed to be a \"single source of truth.\" Every project detail, from the 6-seater oak dining table description to the final NGN100,000 price, is documented and agreed upon before work begins. This design prevents \"scope creep\" and provides a clear path for either party to complete or cancel a project with documented feedback.</p></div></div>","l":"Hi-FI Designs"},{"t":"img","src":"media/cs/anwrk-brand-product-05.webp?v=74b521f9","w":1184,"h":531,"alt":"","l":""},{"t":"img","src":"media/cs/anwrk-brand-product-06.webp?v=9712ed7c","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/anwrk-brand-product-07.webp?v=6d4f79d1","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/anwrk-brand-product-08.webp?v=d76726c9","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/anwrk-brand-product-09.webp?v=fef54ed6","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/anwrk-brand-product-10.webp?v=c807d4c3","w":1894,"h":738,"alt":"Validation & Results Tangible Gains in Efficiency and Trust Within the first 8 weeks of launch, Anwrk saw a 41% reduction in hiring friction, as users were able to find and book artisans significantly faster than through traditional methods. The \"Price Lock\" feature was a standout success, resulting in a 62% drop in payment-related disputes compared to our pilot benchmarks. ​ Other key metrics inc","l":"Validation & Results"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              Designing for Confidence, Not Just Functionality\n            </p><div class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\"><p class=\"tw-leading-[1.5] tw-mb-0\">This project was an insightful reminder that as your user base expands to include those less familiar with software, your design must shift from \"features\" to \"confidence.\" We didn't just build a marketplace; we built a framework for trust. By organizing the platform around familiar search patterns and clear functional nodes, we made the experience feel intuitive rather than intimidating.</p><p class=\"tw-leading-[1.5]\">I learned that in the artisan sector, execution is everything. Managing the implementation directly with developers allowed us to catch usability issues early, particularly in the document upload flow for KYC. This project proved that when you design for the person who wasn't \"born into software,\" you create a more accessible and valuable product for everyone.</p></div></div></div>","l":"reflection / Learnings"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              in conclusion\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              I believe Anwrk has successfully bridged the gap between the informal workforce and the modern digital economy. By solving the dual problems of discovery and trust, we have created a platform where quality is rewarded and clients feel secure in their hiring decisions. As the platform scales, the core principles of transparency, verified identity, and secure payments will continue to define the Anwrk experience.\n            </p></div></div>","l":"in conclusion"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[12px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              team members\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Damilola Olayiwola - Lead Product Designer/UX Strategist\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Stephanie Ukwade - Junior Product Designer\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              Obinna Akpononu - Technical Lead\n            </p></div></div>","l":"team members"}],"thumb":"data:image/webp;base64,UklGRpAGAABXRUJQVlA4IIQGAADQJwCdASq+AL4APpFInkulpCMno5UJIPASCWNu4DN6GuicogVe5yAf5/AVc+/pH8wbnK+YDzjf7t6tP8N6gH9w6jP9sfYA8uj2bnBKDt7Wg5JXV4UmneNyEHS81DOOyQNf18Z60/1yQkhC2yy+cjP6y0QgljW7DrgJzGUhl34xbJL07BQlOruGl3i6WM00cYeG8G8bI2pTDfsWsteKRLKLhrHFI4ja/DXEbiktDy5jMFarLiVVCC6Wk9lYHD97tqImrT0NKgCEeJmEx8x4If6K4hSg7ZhC5pBQQjIONBLiO66Yb14WVJf++o9/2mwcWS2zkgRBE7UgQKc9cvh4R6989spBgEgdfeyEvaNOqt+ZDoAhvVzV182998F2iAMZSktEZCfCTDVwZGBgReVvri4eJPTASNuPNXm5IVS8Y2q5Abnp/jAjHfAA/vIHa9tfZH614X+CC/aj/LjsodCoT73sdNqlyElXFZy9nG8JwkLq68WiWwGYgoprauK7k9U90CcbgR0nargLzFZOiOE9BtRT+FPRmUFTiHBVFUMNhUjTUfx8BiFE8BLIhkAvF8PaokYodmBiIfiG/EZev6RmHW0K/DdhKJGtg/TsuaHXgl171UlbEI69fjsnTcvRFQhL6NmfttSaSv3Opdpan/UXB3W6fyMNgSmvXi6eWGbrp6opflZEJVSnqHcypAMRWq2BroZ3SNPLIGQ4x027fXaSubmQ0elFffLX46XoBO3/0cC4v/3XPvhWSom0uXW6AvX67fMzLxWLwf11Ob6OuET3XE3EdvbJZW8En5xtf8OcJ6EszilEoxGCU4JLnNOOFjoZyHpNwEJHAx1SC1KPsCiZcUVZwUNWGwqfrs9B0tvuVl3mJ7wERCl4UB7URJH+NVDqBKi0JkyMCWROSC7oYooLhij/F7gLFGTgKEnOUwO5yQax6ZW0jBXjmcHBBhTnLQnm0E9UaUdhuwyvKRrA4/BYJZS9h+fxCKZEwDAVJ0rqELAAgcwNTBTk+PqFsLone7Gv0SS45+MGfgKg3cogLBdFBTGPZgsz4GHsjZDDnm7R7H01CI6EcClbv7+Fhm5Uw7TYZ61vghjpblPeEH54E/9UFhXTVQzeU9A0EyXBD62c2NOhGSvfev8n69PGqrTPCxxK7D6+rUYOJbonVPxc5uTl6E0IaDj/AGC9js5ZsdgqRjZMacjuK9l1B6hBXPLmpVD99G080g/TJDK4NgP2VBwNqcN+LJr/tfwjFc9UR4Zyye/7czaRDMsWEMnUtPmrViag6jjIb+tCGfXVVF1bM/wdV63nKnUeFnzn6poYbXavZSdB9tXWdhj2bTI4vlj6QXSVWXg+NSQaJ/6mtiigPPVrAh/GcZ+qDaiMVDxl3uNdx/z/wdhbt4/CwN08u386cDYPUji8FrZJCUTiQZZnIQFUYuKb6IOgyzlJb+eOaU6tRNrFEmKk3O+VxpIVyfQMCSphooC2LRk6NEUuQ6A9G9u5eKazA2iqe/KQITqFAg3Ni3Hz4oBjoIUG+/+EkfdbicnigWQqagbCzYf1iHgGKj2FOOfGurl9ISCzdNgUfvaMvFbxbHVeQ1kbYVaTqm3zhIDDz3wQd4pmEUxSOFqwjQrovH/7/poxIvuYfFALRi5YzOFlFR2iUvsqdh12ZEBmw/hAeiaDBahcgYwZ8gTJkURuBTsorci76GGAVg2kB4nuUtRwt2ybI0+tVeKrjM/ZudcLvjJIvNs5sI0e5mnappMrjzqDi6bZWHZqvaBPOL9udlal6mH2VHHYqfWKk0qxKa19pBUr8AnxhMWUA7Wn5qAQYz/4kbHAcocb4627LpEQZeuJldTk1I6iLhIfWx0/0y72 min-w-full tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-tracking-[0.28px] tw-w-[min-content]\">2025 (Q3-Q4) </p></div><div class=\"tw-content-stretch tw-flex tw-flex-[1_0_0] tw-flex-col tw-gap-[15px] tw-items-start tw-min-w-px tw-relative\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-tracking-[-0.56px] tw-uppercase tw-whitespace-nowrap\">\n              TEAM\n            </p><p class=\"fh4 tw-leading-[1.3] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-tracking-[0.28px] tw-w-[min-content]\">\n              Product Manager, Marketers, Data Analyst\n            </p></div><div class=\"tw-content-stretch tw-flex tw-flex-[1_0_0] tw-flex-col tw-gap-[15px] tw-items-start tw-min-w-px tw-relative\"><p class=\"fm4 tw-leading-[1.035] tw-relative tw-shrink-0 tw-text-[#777] tw-tracking-[-0.56px] tw-uppercase tw-w-full\">\n              DELIVERABLES\n            </p><p class=\"fh4 tw-leading-[1.3] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-tracking-[0.28px] tw-w-full\">\n              Mobile Design, Web Design, Website, UX Audit, Product Strategy\n            </p></div></div>","l":"MY ROLE"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-content-stretch tw-flex tw-flex-col tw-gap-[32px] tw-items-start tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0 tw-w-full\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n                Context and Background\n              </p><p class=\"fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[28px] tw-tracking-[-0.28px] tw-w-[887px]\">\n                What if the brand behind your card could also power your phone?\n              </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.16px] tw-w-[887px]\">Verve is one of Africa's most trusted payment brands, with over 70 million cards issued across Nigeria. For years, its role was simple: it helped people pay. VerveMobile is the step beyond that, a standalone app that brings mobile connectivity and financial services into one place.</p></div></div></div>","l":"Context and Background"},{"t":"img","src":"media/cs/vervemobile-01.webp?v=37a89104","w":1588,"h":694,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-[977px]\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              SOLUTION\n            </p><p class=\"fh5 tw-leading-[1.4] tw-min-w-full tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[min-content]\">\n              VerveMobile: one app for staying connected and managing money\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              We wanted financial access to feel as everyday and effortless as topping up airtime, so we brought a mobile network, a wallet, payments, and rewards together in one app.\n            </p></div></div>","l":"SOLUTION"},{"t":"img","src":"media/cs/vervemobile-02.webp?v=240e56b4","w":1954,"h":3836,"alt":"0 WXYZ 9 TUV 8 PQRS 7 MNO 6 JKL 5 GHI 4 DEF 3 ABC 2   1 9:41 Top Up Airtime Top Up Data Top Up Input Phone Number Select Contact Save as beneficiary Input Amount ₦500 ₦1000 ₦2000 ₦5,000 Continue Buy airtime and data in seconds Top up straight from your wallet, and earn points every time. 9:41 Verve Express Get access to essential services with no sign-in required Buy a SIM Get a Verve Mobile SIM d","l":"0"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-[977px]\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Research\n            </p><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[887px]\">\n              We learned how people expect a super app to be organized...\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              VerveMobile had to hold a mobile network, a wallet, payments, and rewards in one place. Through card sorting, we learned how users naturally grouped these services, and built the navigation around their mental model instead of ours.\n            </p></div></div>","l":"Research"},{"t":"img","src":"media/cs/vervemobile-03.webp?v=3371f1d1","w":1954,"h":1664,"alt":"he information architecture, built around how users grouped these services","l":"he information architecture, built around how users grouped these services"},{"t":"img","src":"media/cs/vervemobile-04.webp?v=4443ecb4","w":1243,"h":2977,"alt":"Design decisions We made deliberate calls to keep a complex product simple The decisions that mattered most weren't about what to build, but about what to hold back, what to make optional, and how to lower the barrier to getting started. Financial, without being a bank Regulation meant VerveMobile couldn't present as a fintech bank. Telecom had to lead, and wallet transfers were limited to Verve-t","l":"Design decisions"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-full\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Iterating with insights\n            </p><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[894px]\">\n              Key finding: card linking was the single biggest blocker in usability testing\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">\n              After the core experience was built, we ran usability testing across 15 tasks with real participants covering onboarding, SIM management, data, wallet, and rewards. The app tested well overall, participants called it easy and intuitive, and rated it simpler than established telco apps.\n            </p></div></div>","l":"Iterating with insights"},{"t":"img","src":"media/cs/vervemobile-05.webp?v=cf4df172","w":1649,"h":721,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-full\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[894px]\">\n              ...but the wallet section surfaced the most serious problems\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">Card linking triggered retry errors, and when a \"no name match\" error appeared, it gave no explanation of what had gone wrong. One participant's attempt to send money failed entirely when a zero balance combined with a broken card link left no path forward. These findings shaped what we prioritized next: fixing the card linking flow first, since it blocked the most critical financial actions in the app, and rewriting error states so users understood what happened and what to do next.</p></div></div>","l":"...but the wallet section surfaced the most serious problems"},{"t":"img","src":"media/cs/vervemobile-06.webp?v=234db881","w":1954,"h":942,"alt":"Critical card linking errors, mapped to where they happened in the app.","l":"Critical card linking errors, mapped to where they happened in the app."},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-full\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Design system\n            </p><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[894px]\">\n              VerveMobile had to feel like Verve without looking like a copy of it.\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">Verve already had an established brand system. We worked within it, borrowing the foundations (color, typography, core components) and building only what VerveMobile needed that didn't already exist. New components for SIM management, wallet flows, and the rewards ecosystem. New artifacts for the telecom layer. The goal was consistency with the parent brand and enough distinctiveness for VerveMobile to feel like its own product.</p></div></div>","l":"Design system"},{"t":"img","src":"media/cs/vervemobile-07.webp?v=e782db32","w":1222,"h":1587,"alt":"Design system preview Theme: Fairly Rounded Corners Compact & Bold Typography Youthfully Imagery Flat BGs Vibrant Colors Label 25,000.00 UI and Screen Layout Moodboarding","l":"Design system preview"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-full\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Final designs\n            </p><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[894px]\">\n              We built a simple, functional app\n            </p></div></div>","l":"Final designs"},{"t":"img","src":"media/cs/vervemobile-08.webp?v=7e8750b2","w":1954,"h":990,"alt":"","l":""},{"t":"img","src":"media/cs/vervemobile-09.webp?v=c006aff5","w":977,"h":427,"alt":"Airtime Purchase 13 Jun | 11:04 - 250 pts Bal: 2,000 pts","l":"Airtime Purchase"},{"t":"img","src":"media/cs/vervemobile-10.webp?v=7e8750b2","w":1954,"h":990,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              What I learned\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[0px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh5 tw-leading-[1.5] tw-text-[24px] tw-text-white tw-tracking-[-0.24px]\">Regulation can be a design direction..</span><span class=\"tw-leading-[1.5] tw-text-[16px]\"><br>\n                The telco and CBN rules forced us to lead with telecom and limit transfers to Verve-to-Verve only. At first that felt like a ceiling. By the end it felt like a frame. The limitations made the product more focused, not less, and working within them honestly produced something cleaner than designing around their edges would have.\n              </span></p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[0px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh5 tw-leading-[1.5] tw-text-[24px] tw-text-white tw-tracking-[-0.24px]\">The barrier to entry is a product decision.</span><span class=\"tw-leading-[1.5] tw-text-[16px]\"><br>\n                Letting users get a number before signing in wasn't a UX fix. It was a statement about what the product values, that people should experience the value before being asked to commit. That belief shaped more than the onboarding flow. It shaped how we thought about every first interaction in the app.\n              </span></p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[0px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh5 tw-leading-[1.5] tw-text-[24px] tw-text-white tw-tracking-[-0.24px]\">Inconclusive data is still data.</span><span class=\"tw-leading-[1.5] tw-text-[16px]\"><br>\n                Our A/B test came back close. The instinct was to pick the higher score and move on. The real insight was that neither direction alone was right, and synthesizing both was the harder, more honest call. Research doesn't always point at an answer. Sometimes it points at a better question.\n              </span></p></div></div>","l":"reflection / Learnings"}],"thumb":"data:image/webp;base64,UklGRnQVAABXRUJQVlA4IGgVAACQUgCdASq+AL4APpE8l0gloyIhLneroLASCWgA0X473v6I/svOLrr+D/Jnsn8DI9netm+/2Pqh/Qn7AfAH+uHTL8xX9F/1v7ne9j6WP876gH+M/ufWjegB5dPsqf2v/w+kz////r2/OoW8pscXUn8tlfHHfY3IPy3YBftffndr8xT3jzL8LP4jW7zV/Jt9gewYgWuBT9U04jMeVvjKYJKnO3AqM/nwNVN7AmlghaWMMF+l8WJ7y2uBhAkU5zNo3o2WbRILsNftqaEPIYeGdRb2lGM8OtDQT0baiBTRsJ9HMJMQayDhY6dKaqB8xeXOky+N+SYgq7iwOr0j9b72e8ey1oNkPOJ+2UCYYAOp7X7y8jhp23rmGLzWVbSKQGWVL7dgYQTGSZIghgq7iE+LrjWQKkTWxg6/0H9oc/eN/IqNkplZ2YUzQxH1N6zj+UHr6BW7GyutPxO+xJ+hyJDkoXpixGw+1gLeIdnqP7MDQv5tBlY3TvtVbbGIqqpuJFMUiHiSFIGOQVntO3Ry1SaLAYMPLbPZBrCHaKCDK7zf3ts/UuIhCWnJkc9/gwhdxQCB4ez6jDjoajbIKbqhQCmKlWs0sAr9xYotgV4LaGB64kxlElbdHv9Yv3ePQZuKlMqJd9yOb7+B2dbarC/KsMjNgwasn8ueFuQTl3qbWFiOp4/hsRDT0wpPS6E1bWSW46HTogYFFE0Z1UdZ+UcmOg/NUf0lrzVCxNxeVGPSKIz1kIcdIFL8+MpvnsZhFuHfzven6ZdOjeSXOTMr5zIYW3CZMMMsSaYbY5ceLOU+qIku/rGPV1ChiGTXhwo0dcmE5oAfilYMpAD49yuIDKC1LELNE2uNh9clVKG+4XCkpWAp+O+/vt3ZjXFL+slwCSaW9gAA/vwGPx+MIhoAAgWWvGuWQJE1eTmItdAuLnaEDNH/oQVg3qZTE66rx/ncCbFoYuBCy2ogvkms7CHQzyFevKFqAAAJOGc/euSYGSpEZym9VBWpuppWLYwluK+llNo+oAq3Odm9bpCOExnVDA5uaJL3TLbw0dnJw+crfEC9DuiR2sQ4E1onhAFi+85wROjxwKlNgKl/vgOkR1BGIeoTZUSomyhUG6yCdKCnWGskQU/YnPwQ233XoNPn5Bzf2AV8zI2GUToeuPqTPjh+fwQ9X+tFN2PTg5SBo0uum/BX6kG++pk8zo9TStfv8L1CZ5gq1GpGcbWkJSBeGlXD/OwVoj19+v+KNLsdSFl9XOQ9WnmnP7Jg0Wj43eu2nKSVW9gB4Gcqk43zVdWq6Mg1EuGINtFM4HHNe8Ld6fTfPGssaZi/HgllJ5c5a1oKAza4tIdH3LC4tilvwfzNJUUAAdTJ9pEtL8B7wHvZ8G/z4C/mfA6IDpH0VJCc0a6fwxq2A3aBLdDrTNRtBQAocgjl+1CHcpn3UrXqXj2s9fC2Md/jBYFIUKqLx/DA5SViKuhO3g3f4z0x6L5QWx2f8IedP33+u4kPRuSH1VH+eyYLZqEjYto2f+icQYlsSDI/RZz4fcG6YMT7PQzei5ZSs/sAMivEvLvE2ym5BXKYExcQ6vXKJNnDpkUeHvBYK6QGYgAZnMTca0l5CVSAXKI9mD/GJQ5zptS6GVBCByTZqdlBD5zYySAvs6CbQtSiMr6t6LvOx2zbcZ4udJw/D67WBZCQU9pv/0lVE3JQZioWtWns1KsbMK4Op4qaXRfCqvlVGCDrwrmG427jYIf8OKOgNtOKwGXzUOnB0uJ2Cc6eYbe80hiCUE67c3Nyhsuf1VMsca+NP oduct, part of the broader QuickTeller ecosystem, built following the acquisition of an IMTO license. It covers four corridors from the UK to Nigeria, Uganda, Kenya, and Ghana, giving Africans in the diaspora a way to send money home, pay bills for family, and manage finances across borders.\n              </p></div></div></div>","l":"Context and Background"},{"t":"img","src":"media/cs/quickteller-remit-02.webp?v=584e0c9c","w":1954,"h":854,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-content-stretch tw-flex tw-flex-col tw-gap-[32px] tw-items-start tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0 tw-w-full\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n                challenge\n              </p><p class=\"fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[28px] tw-tracking-[-0.28px] tw-w-[887px]\">\n                How might we build a compliant remittance experience for Africans in the UK, in a heavily regulated space, without making the product feel like a compliance exercise?\n              </p></div></div></div>","l":"challenge"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-[977px]\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0 tw-w-[947px]\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              SOLUTION\n            </p><p class=\"fh5 tw-leading-[1.4] tw-min-w-full tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[min-content]\">\n              QuickTeller Remit: send money, pay bills, and track your finances across borders.\n            </p></div></div>","l":"SOLUTION"},{"t":"img","src":"media/cs/quickteller-remit-03.webp?v=36c54bca","w":1954,"h":2872,"alt":"Send money home Transfer funds across four corridors, UK to Nigeria, Uganda, Kenya, and Ghana, quickly and securely. Check rates before you sign in See live exchange rates without creating an account, so you know what you're getting before you commit. Pay bills for family back home Pay utility bills, school fees, and other expenses for family in Nigeria, Uganda, Kenya, and Ghana, directly from the","l":"Send money home"},{"t":"img","src":"media/cs/quickteller-remit-04.webp?v=2cf91117","w":1362,"h":2752,"alt":"Design decisions Three decisions shaped how the product came together Working within a regulated space, an existing ecosystem, and a specific user need meant every decision involved a real tradeoff. Rates before you commit Most remittance apps make you create an account before showing you anything. We made exchange rates visible without signing in. The risk was that users might check rates and nev","l":"Design decisions"},{"t":"img","src":"media/cs/quickteller-remit-05.webp?v=98fb6c15","w":1894,"h":3294,"alt":"iterations Not every first approach was the right one. Here's where the work changed. We couldn't decide when to show the exchange rate breakdown... We explored two ways to present the exchange rate breakdown during a transfer. Required users to tap a button to see the breakdown, then go back to complete the transfer. Added an unnecessary step between the user and their goal.\" Showed the breakdown","l":"iterations"},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0 tw-w-full\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              Final designs\n            </p><p class=\"fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[894px]\">\n              We built it to feel trustworthy, clear, and fast.\n            </p></div></div>","l":"Final designs"},{"t":"img","src":"media/cs/quickteller-remit-06.webp?v=2c2f91f0","w":1954,"h":854,"alt":"","l":""},{"t":"img","src":"media/cs/quickteller-remit-07.webp?v=c0b6e775","w":1954,"h":854,"alt":"","l":""},{"t":"img","src":"media/cs/quickteller-remit-08.webp?v=99c8b979","w":1100,"h":481,"alt":"","l":""},{"t":"img","src":"media/cs/quickteller-remit-09.webp?v=4ee744ba","w":1161,"h":507,"alt":"","l":""},{"t":"img","src":"media/cs/quickteller-remit-10.webp?v=c47aab10","w":977,"h":427,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              reflection / Learnings\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.2] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-whitespace-nowrap\">\n              What I learned\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[0px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh5 tw-leading-[1.5] tw-text-[24px] tw-text-white tw-tracking-[-0.24px]\">Compliance doesn't have to mean friction.</span><span class=\"tw-leading-[1.5] tw-text-[16px]\"><br>\n                The regulated nature of remittance could have made the experience feel like a compliance exercise. Every decision was about finding the line between what regulation required and what users actually needed.\n              </span></p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[0px] tw-tracking-[0.48px] tw-w-[887px]\"><span class=\"fh5 tw-leading-[1.5] tw-text-[24px] tw-text-white tw-tracking-[-0.24px]\">Information builds confidence.</span><span class=\"tw-leading-[1.5] tw-text-[16px]\"><br>\n                The transfer iteration proved it. Showing users the breakdown upfront removed the hesitation. In a product where people are sending real money across borders, clarity isn't just good UX, it's the product.\n              </span></p></div></div>","l":"reflection / Learnings"}],"thumb":"data:image/webp;base64,UklGRj4LAABXRUJQVlA4IDILAADQOgCdASq+AL4APpFCm0qlo6IkpTLL4LASCWVu3V5tQfH0dnGb6BEFCibc7zHY8HvM2QTND7/fOuMvad9ecd/Mwf4LsPt3gT6vSsh6J7Af8k84TRT9YaUAWDRbYzFzeBYpmYs3KSS/E+xCwgFpFlMv/cnCjfDYBDVT4msNLQci9hy45LW4c9+agnVVECIzW+6tUE7CsTVyOYhUwL9RnAqTcnu7ZEUA083MctxgP4r5fxQ0ph6T1yICcw/OdpiPoJSqLP23JjNiSeESPISSw2c292LpbRqJqLXznOgErbSrTm0cG42hJrHEcrJ9R44QukoqQpJiUomCeiWycbSKw/U3K0zCiql1PSbcxcmkat+t5fg6h4RPWvntUPvEx63Cmw9kt35Rs4bmJB+7CFcRDrl6TUoBNvPrEDNBBcop6HuLl3Vn5ZmKpKTsCvdYpZaVX58shs5QGwjK3f7hQvGT4PEBiUT7bG99fNq//VfKO52ZfnlmkI66fED8oqtSmDlH5VRfC6LNHV4+SX7eikxX4FIQV//6HXE41CoNXNC2nxQ2xKBOnwHg5ieRtyiK0x3NLQL0/LAzLqoXrKF0mIEUYPuTfO7B63PFGVWI4EYAo0eoo1fYwgahV/1qggNENQt3gAD+/bJdLUMdpinWW+SlyGAANoD6vSQf7hyR1C7egPx1vU0uLLZT3yhJkpkLxsaM3wjfHwvultXJO7hYAbe2BXkq2vu6PsTh/RFhnLdXE7ik6kmFcBvAOgfg3m91KAv95tIrpbXjInvlofFLLf8oD/ymCg+Zg24ZBd4bU0C2a3PjdZkvynnuZqgz9pWO96Kt0pOQGl1MiKh7ILJ/ojYr+xWKx2j12ZJhn8yBK2vYKHmuTNZ4O5N5t8SX37irQzHMEbQAWw0qE2jtpzs5CgJJdNusU0dJkNPxuNC5J2+EXdcY+5VNqI5ERXVNPw6LWauAR63Km6WmPqOQwm62Xi86pfSdwDQMQHe9Muw8o7WXIi04SbAMqgnQIn3jLvKxLODmqDC0v9j1MmTqBBK8gpMUgHl26hlwiebaBrShrwdSziW/k1kkZG2xFtz8eCKV0fIYM2j2olJPQp x tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              INTRODUCTION\n            </p><p class=\"tw-capitalize fh5 tw-leading-[1.4] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\">\n              Democratizing the AI Frontier and Bridging the Gap Between Complexity and Utility\n            </p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">Centric AI was founded on the belief that \"Intelligence should be at your fingertips,\" yet for most organizations, Artificial Intelligence remains an intimidating \"Sci-Fi\" concept. Despite a global market projected to reach $1T by 2030, nearly 70% of enterprise AI projects fail because they are too complex, too costly, or too dependent on specialized data science talent. Our mission was to create a brand for a no-code platform that strips away these technical barriers. By focusing on a \"plug and play\" philosophy, we positioned Centric AI as the essential infrastructure for business users to create, launch, and scale intelligent solutions without writing a single line of code; or writing as minimal code as possible.</p></div></div>","l":"INTRODUCTION"},{"t":"img","src":"media/cs/centric-ai-01.webp?v=30d68c23","w":1243,"h":524,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My role\n            </p><p class=\"tw-capitalize fh5 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\"><span class=\"tw-leading-[1.4]\">The Architect: Translating High-Level Engineering into Human-</span><span class=\"fh5 fi tw-leading-[1.4]\">Centric</span><span class=\"tw-leading-[1.4]\"> Identity</span></p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">I was Lead Brand Strategist and Visual Designer, turning the founding team's technical expertise in business transformation and AI into a clear market story. I defined the visual language, using teal and lime green colors and pairing Instrument Serif with SF fonts. Collaborating with founders, I ensured the brand felt \"modular and secure\" and user-focused. From pitch deck to GTM visuals, I made complex tech simple and accessible.</p></div></div>","l":"My role"},{"t":"img","src":"media/cs/centric-ai-02.webp?v=3e791542","w":1184,"h":499,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              IDEATION\n            </p><p class=\"tw-capitalize fh5 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\"><span class=\"tw-leading-[1.4]\">From \"</span><span class=\"fh5 fi tw-leading-[1.4]\">Black Box</span><span class=\"tw-leading-[1.4]\">\" to \"</span><span class=\"fh5 fi tw-leading-[1.4]\">Business Hero</span><span class=\"tw-leading-[1.4]\">\"; Mapping the Workflow Revolution</span></p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">The ideation phase aimed to solve the \"SciFi\" problem: making AI practical for roles like Head of Credit or Operations Lead. We shifted from abstract \"Big Tech\" imagery to three pillars: Move Faster, Operate Smarter, and Grow. Brainstorms focused on real impact, like saving $100,000 for a Fintech or helping 20,000 farmers in Agri-Tech. This led to a brand strategy highlighting \"Intelligence for business workflows,\" positioning the platform as a revenue driver, guiding font, color, and brand choices.</p></div></div>","l":"IDEATION"},{"t":"img","src":"media/cs/centric-ai-03.webp?v=99a4f228","w":1898,"h":804,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-04.webp?v=4b2a0ff2","w":1898,"h":812,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-05.webp?v=2cd75436","w":1898,"h":804,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-06.webp?v=0362d924","w":1894,"h":802,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-07.webp?v=9306feb0","w":1780,"h":754,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-08.webp?v=b70c213f","w":947,"h":676,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-09.webp?v=92b0ef75","w":1894,"h":846,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-10.webp?v=e0e44c58","w":947,"h":1255,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-11.webp?v=5cd73e96","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-12.webp?v=48a02052","w":1894,"h":850,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-13.webp?v=f9c0e5ac","w":1658,"h":744,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-14.webp?v=70e59a4e","w":1894,"h":1352,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-15.webp?v=70e59a4e","w":1894,"h":1352,"alt":"","l":""},{"t":"img","src":"media/cs/centric-ai-16.webp?v=3e :"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              My role\n            </p><p class=\"tw-capitalize fh5 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[28px] tw-text-white tw-tracking-[0.28px] tw-w-[837px]\"><span class=\"tw-leading-[1.4]\">The Architect: Translating High-Level Engineering into Human-</span><span class=\"fh5 fi tw-leading-[1.4]\">Centric</span><span class=\"tw-leading-[1.4]\"> Identity</span></p><p class=\"fh4 tw-leading-[1.5] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px]\">I was Lead Brand Strategist and Visual Designer, turning the founding team's technical expertise in business transformation and AI into a clear market story. I defined the visual language, using teal and lime green colors and pairing Instrument Serif with SF fonts. Collaborating with founders, I ensured the brand felt \"modular and secure\" and user-focused. From pitch deck to GTM visuals, I made complex tech simple and accessible.</p></div></div>","l":"My role"},{"t":"img","src":"media/cs/techcircle-rebrand-02.webp?v=cce287b3","w":1894,"h":514,"alt":"Before After","l":"Before"},{"t":"img","src":"media/cs/techcircle-rebrand-03.webp?v=70fd3701","w":1894,"h":514,"alt":"","l":""},{"t":"html","h":"<div class=\"tw-content-stretch tw-flex tw-flex-col tw-items-start tw-px-[30px] tw-py-[20px] tw-relative tw-shrink-0\"><div class=\"tw-[word-break:break-word] tw-content-stretch tw-flex tw-flex-col tw-gap-[15px] tw-items-start tw-not-italic tw-relative tw-shrink-0\"><p class=\"fm4 tw-leading-[1.035] tw-min-w-full tw-relative tw-shrink-0 tw-text-[#777] tw-text-[14px] tw-tracking-[-0.56px] tw-uppercase tw-w-[min-content]\">\n              IDEATION\n            </p><p class=\"fh4 tw-leading-[0] tw-relative tw-shrink-0 tw-text-[#dbdbdb] tw-text-[16px] tw-tracking-[0.48px] tw-w-[887px] tw-whitespace-pre-wrap\"><span class=\"tw-leading-[1.5]\">In today's dynamic landscape of modern business and innovation, the aspiration to create something truly remarkable—a brand identity that not only endures but also embodies the essence and aspirations of </span><span class=\"fh7 tw-leading-[1.5]\">Techcircle's vision</span><span class=\"tw-leading-[1.5]\">\n                —takes center stage. \n                <br><br>\n                This vision materialized into \n              </span><span class=\"tw-leading-[1.5]\">Life Emitting Vibration Rings</span><span class=\"tw-leading-[1.5]\">, a concept deeply rooted in vitality and energy, symbolizing the intricate interplay of four core elements: </span><span class=\"fh7 tw-leading-[1.5]\">Investment, Advisory, Networking, and Innovation.</span></p></div></div>","l":"IDEATION"},{"t":"img","src":"media/cs/techcircle-rebrand-04.webp?v=6e3259ee","w":1898,"h":804,"alt":"","l":""},{"t":"img","src":"media/cs/techcircle-rebrand-05.webp?v=12d9ad10","w":947,"h":401,"alt":"","l":""},{"t":"img","src":"media/cs/techcircle-rebrand-06.webp?v=d149d73a","w":1125,"h":476,"alt":"","l":""},{"t":"img","src":"media/cs/techcircle-rebrand-07.webp?v=6fb2dce0","w":1243,"h":895,"alt":"","l":""},{"t":"img","src":"media/cs/techcircle-rebrand-08.webp?v=52bd44e4","w":1539,"h":652,"alt":"","l":""},{"t":"img","src":"media/cs/techcircle-rebrand-09.webp?v=316df613","w":947,"h":401,"alt":"Financing the next generation of innovation","l":"Financing the next generation of innovation"},{"t":"img","src":"media/cs/techcircle-rebrand-10.webp?v=f90bac33","w":1187,"h":503,"alt":"","l":""},{"t":"img","src":"media/cs/techcircle-rebrand-11.webp?v=f90bac33","w":1187,"h":503,"alt":"","l":""},{"t":"img","src":"media/cs/techcir
