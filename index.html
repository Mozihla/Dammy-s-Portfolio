(() => {
  const DS_SRC = [{"track": "design-system", "slug": "current-design-system", "client": "Altovida · Rivr", "year": "2026", "category": "p", "status": "complete", "isDraft": false, "title": "Current: the Rivr Design System", "intro": "Rivr is Altovida's web platform for cross-border payments, collections and identity checks. Only 19 of its 5,564 text layers used a style. I built Current out of the shipped product: 226 scoped variables in Light and Dark with a Compact density mode, 37 components, and a dark-mode primary button that went from 2.90:1 to 6.96:1.", "roles": ["Lead Product Designer", "Design System Lead", "UX Audit", "Accessibility", "Documentation", "Governance"], "glance": [{"value": "226", "label": "Scoped variables, Light, Dark and Compact"}, {"value": "37", "label": "Token-bound components"}, {"value": "13 → 8", "label": "Corner radii"}, {"value": "2.90 → 6.96:1", "label": "Dark primary button contrast"}], "cover": {"slot": "DS-01", "src": "media/current-design-system/DS-01.webp?v=9996cc87", "alt": "Current cover: the Rivr design system name beside a wallet dashboard built from its components.", "w": 2880, "h": 1620}, "sections": [{"id": "context", "heading": "Context and background", "body": ["Rivr serves businesses that move money across borders. Operators hold balances in several currencies, initiate payouts, collect from customers, run identity checks through Authra, and hand developers keys and webhooks. It is a dense, table-heavy web product where a wrong number has a real cost.", "I also designed the Rivr brand, so the visual language was already distinct: deep blue, a confident display face, wallets that each carry their own colour. What the product lacked was the layer underneath. Tokens existed as an export from an earlier Altovida file, but they could be applied anywhere, error was stored as yellow, and new screens kept re-deciding type and spacing by eye."]}, {"id": "role", "heading": "My role", "body": ["Lead product designer and super IC, working with a few supporting designers. I designed the product and the brand, ran the audit, defined the token architecture, built and documented the component library, and set the release and contribution model. Supporting designers built screens on each release and flagged gaps."]}, {"id": "audit", "heading": "Problem", "body": ["I scripted an audit of the Rivr product page and its supporting pages: 11 sections, 46 desktop screens and 23,647 layers, covering onboarding, wallets, payouts, collections, identity, developer tools and settings."], "list": ["Colour: 3,518 of 15,069 fills were raw hex (23%), across 51 unique values. 201 legacy variables, all set to every scope, with light and dark as semantic/light/* and semantic/dark/* name pairs, no border or icon roles, error stored as yellow and success as blue.", "Type and shape: 19 of 5,564 text layers used a style and none were local. 5 families, 13 sizes from 6px to 96px, and 13 corner radii.", "Components: 103 components with generic names, and the full Phosphor icon library (1,248 sets in 6 weights) living in the file.", "Accessibility: tertiary text 2.55:1, placeholders 1.97:1, the Authra wallet 3.36:1 and the dark-mode primary button 2.90:1."], "images": [{"slot": "DS-02", "src": "media/current-design-system/DS-02.webp?v=77b7ab31", "caption": "What we inherited, counted: 23,647 layers, 201 unscoped variables, 19 styled text layers.", "w": 3008, "h": 1440}, {"slot": "DS-03", "src": "media/current-design-system/DS-03.webp?v=8a5ad03e", "caption": "Before and after, row by row. Every change maps to a measured problem.", "w": 3008, "h": 1934}]}, {"id": "principles", "heading": "Principles", "body": ["Four rules that settle arguments: Money state is never ambiguous. Rate, fee and balance before commitment. Products own colours. Built for operators."], "images": [{"slot": "DS-04", "src": "media/current-design-system/DS-04.webp?v=e44c3105", "caption": "Four principles drawn from how operators move, collect and verify money.", "w": 3008, "h": 1432}]}, {"id": "architecture", "heading": "Approach", "body": ["Extract, don't invent. Current keeps the Rivr brand as shipped and makes it repeatable for a product built around tables, balances and states."], "cards": [{"title": "🔑 Name pairs became modes", "body": "semantic/light/* and semantic/dark/* collapsed into 96 hidden primitives behind 74 Color roles with real Light and Dark modes. Error is red again, success is green, and borders and icons have their own roles."}, {"title": "🔑 Density as a mode", "body": "A Density collection with Comfortable and Compact modes drives row heights, padding and control sizes, so an operator table can tighten without a second set of components."}, {"title": "🔑 Scoped and coded", "body": "All 226 variables are scoped to the properties they may touch and carry web, iOS and Android names: var(--rv-color-...), RV.color... and RvTokens.color...."}, {"title": "🔑 States encode decisions", "body": "Status Pill separates Processing from Pending, because one means money is moving and the other means it is waiting on someone. Balance Card states what is committed versus available."}], "images": [{"slot": "DS-05", "src": "media/current-design-system/DS-05.webp?v=c96a6418", "caption": "Seven steps from audit to governance, each with an artefact in the file.", "w": 3008, "h": 856}, {"slot": "DS-06", "src": "media/current-design-system/DS-06.webp?v=e25d7154", "caption": "The same instances in two frames. Only the Color mode changes.", "w": 3008, "h": 1440}]}, {"id": "foundations", "heading": "Foundations", "body": ["Products own colours: cross-border payouts are blue, Authra identity is purple and settlement is green, across wallets, tags and charts. Type runs on two families through variables (Povlar for display, Gilmer for everything else, plus mono for references) on 19 product styles. 13 radii became 8 tokens.", "Contrast was fixed at the token so every component inherited it: tertiary text 2.55 to 4.86:1, placeholders 1.97 to 4.86:1, the Authra wallet 3.36 to 4.95:1 and the dark primary button 2.90 to 6.96:1. The live contrast check also caught a new failure, warning banner text on dark at 1.42:1, which became text/on-warning at 13.46:1."], "images": [{"slot": "DS-07", "src": "media/current-design-system/DS-07.webp?v=152350d8", "caption": "Primitive palette, hidden from pickers, and the three product colours on their wallets.", "w": 3008, "h": 3808}, {"slot": "DS-08", "src": "media/current-design-system/DS-08.webp?v=55b184c4", "caption": "Typefaces and the anatomy of an amount: whole number first, decimals step back.", "w": 3008, "h": 2128}, {"slot": "DS-10", "src": "media/current-design-system/DS-10.webp?v=9d499bed", "caption": "What the audit caught, and every text pair checked in both modes.", "w": 3008, "h": 3686}]}, {"id": "components", "heading": "Components", "body": ["37 components across actions, inputs, data display, navigation, feedback and the money-specific pieces: Balance Card, Amount Input, Transaction Row, Status Pill, Currency Badge and Key Field. Each page documents usage, the property API, the tokens consumed and do and don't examples."], "images": [{"slot": "DS-11", "src": "media/current-design-system/DS-11.webp?v=3dc5dae5", "caption": "Button: one Primary per view, the action that moves money or creates something.", "w": 3008, "h": 3164}, {"slot": "DS-12", "src": "media/current-design-system/DS-12.webp?v=ffc81138", "caption": "Balance Card and Status Pill: the word always states the status, colour only reinforces it.", "w": 2693, "h": 4096}]}, {"id": "patterns", "heading": "Usage previews", "body": ["Rivr's core screens rebuilt from library instances only."], "images": [{"slot": "DS-14", "src": "media/current-design-system/DS-14.webp?v=7ccedb14", "caption": "Collections table and payout: rate, fee and balance shown before Confirm.", "kind": "preview", "w": 2644, "h": 4096}, {"slot": "DS-15", "src": "media/current-design-system/DS-15.webp?v=e9502743", "caption": "Hub: onboarding progress, wallets and recent activity on one overview.", "kind": "preview", "w": 3136, "h": 2812}, {"slot": "DS-16", "src": "media/current-design-system/DS-16.webp?v=5e5109d2", "caption": "Sandbox and secrets: a new key is shown once, in a dialog that cannot be missed.", "kind": "preview", "w": 3136, "h": 2452}]}, {"id": "release", "heading": "Release phases", "steps": [{"title": "v0.1 Foundations", "body": "Legacy ramps kept as primitives, name pairs collapsed into Light and Dark roles, error renamed to feedback/warning where it meant warning, Density and type scale captured."}, {"title": "v0.2 Money movement", "body": "Balance Card, Amount Input, Transaction Row, Status Pill, Currency Badge and Pagination, proven on Wallets and Initiate Payout."}, {"title": "v0.3 Identity and developers", "body": "Input Field, Select, Key Field, Dialog, Environment Toggle and Banner, proven on Authentications and Dev Tools."}, {"title": "v0.4 Workspace", "body": "Sidebar, Top Bar, Stat Card, Service Card, Checklist Item and Empty State, proven on Overview, Settlement and Teams."}, {"title": "v1.0 Hardening", "body": "Contrast fixed at the token, code syntax on every variable, the Patterns page and full documentation."}], "body": ["Each release followed the flow in flight, so the system never ran ahead of the product. Semantic versioning tells a squad whether an update can break a screen: major ships with a migration map from the 201 legacy variables, minor is additive, patch is a visual fix. Deprecated parts keep working for one minor version under a Deprecated / prefix."]}, {"id": "results", "heading": "Validation & results", "compare": {"before": ["23% raw fills, 51 unique hex values", "201 variables, all unscoped, light and dark as name pairs", "Error stored as yellow, success as blue, no border or icon roles", "19 of 5,564 text layers styled, 5 families, 13 sizes", "13 radii", "103 generically named components", "4 failing text pairs"], "after": ["0 hard-coded colours inside components", "226 variables, 100% scoped, Light, Dark, Comfortable and Compact", "Feedback roles that mean what they say", "19 product styles on 2 families through variables", "8 radius tokens", "37 purpose-named components", "All checked text pairs pass AA in both modes"]}, "images": [{"slot": "DS-19", "src": "media/current-design-system/DS-19.webp?v=e4d71157", "caption": "Four health metrics checked every release, with the v1.0 baseline.", "w": 3008, "h": 1110}]}, {"id": "governance", "heading": "Governance", "body": ["One owner, a short contribution path (propose with a real screen, check for an existing role or variant, build with tokens only, document, release with a changelog line) and four numbers per release: hard-coded colours in components, variable scoping, AA coverage, and adoption in product files, which starts from the legacy baseline of 77% bound fills.", "VERIFY: add an adoption or delivery-speed figure once squads have moved product files onto Current. Until then this section reports what was built and measured."]}, {"id": "team", "heading": "Team members", "list": ["Damilola Olayiwola: Lead Product Designer, brand designer and design system owner", "Supporting designers, product and engineering at Altovida"]}]}, {"track": "design-system", "slug": "ledger-design-system", "client": "Baige · Business Banking", "year": "2025", "category": "p", "status": "complete", "isDraft": false, "title": "Ledger: the Baige Business Banking Design System", "intro": "Baige is business banking for agents, merchants and corporates, on a phone app and an admin web portal. Across 1,482 shipped screens, not one of 17,644 text layers used a style. I built Ledger to serve all of it: 185 scoped variables with Light and Dark plus Mobile and Desktop modes, 25 components, and a transfer button that went from 2.38:1 to 7.68:1.", "roles": ["Lead Product Designer", "Design System Lead", "UX Audit", "Accessibility", "Documentation", "Governance"], "glance": [{"value": "185", "label": "Scoped variables, Light, Dark, Mobile and Desktop"}, {"value": "25", "label": "Token-bound components, app and portal"}, {"value": "46 → 8", "label": "Corner radii"}, {"value": "2.38 → 7.68:1", "label": "Transfer button contrast"}], "cover": {"slot": "DS-01", "src": "media/ledger-design-system/DS-01.webp?v=703895ed", "alt": "Ledger cover: the Baige design system name beside a wallet card and admin components built from it.", "w": 2880, "h": 1620}, "sections": [{"id": "context", "heading": "Context and background", "body": ["Baige serves three kinds of business and the team that runs them. Agency Banking is for agents serving walk-in customers with cash, transfers, bills and POS. Merchant Banking is for shops taking payments and settlements. Corporate Banking covers company accounts, cards and terminals. Merger is for businesses that are both agent and merchant. The Admin Web Portal is where Baige operations reviews KYC, manages tiers and terminals, and watches the numbers.", "Each area had grown its own screens. The same wallet card, transaction row and button had been redrawn for every product, on mobile and on web, in the brand's navy and gold. There was no system underneath: eight paint styles, one variable, and a style named \"Light blue\" that stored navy."]}, {"id": "role", "heading": "My role", "body": ["Lead product designer and super IC, working with a few supporting designers. I designed the product across mobile and web, ran the audit, defined the token architecture, built and documented the component library, and set the release and contribution model. Supporting designers built screens on each release and flagged gaps."]}, {"id": "audit", "heading": "Problem", "body": ["I scripted an audit of the five product pages: 1,482 screens (1,042 mobile, 440 web) and 89,533 layers across Agency, Merchant, Corporate, Merger and the Admin portal."], "list": ["Colour: 29,344 of 45,537 fills were raw hex (64%), across 128 unique values. Most of the rest used one of eight paint styles, and one local variable existed in the whole file.", "Names: paint styles were named by appearance, and the names had drifted from the values: \"Light blue\" held the navy #001F54.", "Type: 0 of 17,644 text layers used a style. 10 font families and 18 sizes, down to 6px.", "Shape and components: 46 corner radii from 1.3px to 165px, and 623 uses of a component named \"Component 1\".", "Accessibility: 7 failing pairs, led by the gold transfer button and gold labels at 2.38:1, accent grey at 3.04:1 and success green at 2.69:1."], "images": [{"slot": "DS-02", "src": "media/ledger-design-system/DS-02.webp?v=a7201711", "caption": "What we inherited, counted: 89,533 layers, 64% raw fills, 0 styled text.", "w": 3008, "h": 2096}, {"slot": "DS-03", "src": "media/ledger-design-system/DS-03.webp?v=4ebdbe53", "caption": "Before and after, row by row. Every change maps to a measured problem.", "w": 3008, "h": 1720}]}, {"id": "principles", "heading": "Principles", "body": ["Five rules for a banking product that three kinds of business use every day: Every naira accounted for. One system, three businesses. Phone and portal speak the same language. Navy for trust, gold for action. Admins see the consequence."], "images": [{"slot": "DS-04", "src": "media/ledger-design-system/DS-04.webp?v=4ba3bdb8", "caption": "Five principles, short enough to quote in a review.", "w": 3008, "h": 1084}]}, {"id": "architecture", "heading": "Approach", "body": ["One system for two platforms and three businesses. Ledger keeps the Baige navy and gold exactly as shipped, turns the paint styles into primitives, and lets every screen reach a value only through a role."], "cards": [{"title": "🔑 Styles became roles", "body": "Eight appearance-named paint styles and 128 raw values became 58 hidden primitives behind 67 Color roles with Light and Dark modes. \"Light blue\" is now navy/900, used through bg/brand and action/primary/bg."}, {"title": "🔑 Platform as a mode", "body": "Spacing, Size and Typography have Mobile and Desktop modes. A Transaction Row on the app and a Table Row in the portal use the same names; the portal just switches the mode for wider margins and larger headings."}, {"title": "🔑 Segments as colour, not components", "body": "Agent, Merchant and Corporate share every component. Only the segment colour changes, chosen at sign-up and carried through the account."}, {"title": "🔑 Components encode decisions", "body": "Wallet Card masks a hidden balance without changing height. Transaction Row signs both directions and puts status under every amount. Modal names who an admin action affects before it happens."}], "images": [{"slot": "DS-05", "src": "media/ledger-design-system/DS-05.webp?v=77b3173d", "caption": "Five layers and two axes of modes: Light or Dark for colour, Mobile or Desktop for platform.", "w": 3008, "h": 1252}, {"slot": "DS-06", "src": "media/ledger-design-system/DS-06.webp?v=ad5c0076", "caption": "The same instances in two frames. Only the Color mode changes.", "w": 3008, "h": 1844}]}, {"id": "foundations", "heading": "Foundations", "body": ["Navy carries structure and gold marks the one thing to do next. Type runs on Roobert through variables, with 14 product styles on a 10px floor, and every amount follows one rule set: the naira sign is part of the number, kobo steps back but is never dropped, credits and debits are both signed, and a masked balance keeps its width. 46 radii became 8 tokens.", "Contrast was fixed once, at the token: gold text 2.38 to 5.45:1 by moving text to a darker gold, the transfer button 2.38 to 7.68:1 with a navy icon on gold, accent grey 3.04 to 5.37:1, grey on grey pills 4.38 to 6.54:1, success 2.69 to 5.35:1, error 3.57 to 5.70:1 and brown labels 3.75 to 5.45:1. All 16 checked pairs pass AA in both modes, calculated from the live variables."], "images": [{"slot": "DS-07", "src": "media/ledger-design-system/DS-07.webp?v=16d1d074", "caption": "67 roles in Light and Dark, with segment, wallet and status layers.", "w": 2624, "h": 4096}, {"slot": "DS-08", "src": "media/ledger-design-system/DS-08.webp?v=c1633b7a", "caption": "14 product styles, size and line height bound to Mobile and Desktop values.", "w": 3008, "h": 2410}, {"slot": "DS-10", "src": "media/ledger-design-system/DS-10.webp?v=921a459a", "caption": "Seven failing pairs, each fixed at the token and inherited by every component.", "w": 3008, "h": 1454}]}, {"id": "components", "heading": "Components", "body": ["25 components across actions, inputs, data display, navigation and feedback, shared by the app and the portal: Wallet Card, Transaction Row, Entity Tile, Segment Card, KPI Card, Table Row, Sidebar, Modal and more, with 42 icons swapped in through instance properties. Each page documents usage, the property API, the tokens consumed and do and don't examples. An audit of the library found no raw colours and no unstyled text in any component."], "images": [{"slot": "DS-11", "src": "media/ledger-design-system/DS-11.webp?v=606156c2", "caption": "Button: gold keeps the brand, a navy label makes it readable (7.68:1, not 2.38:1).", "w": 2938, "h": 4096}, {"slot": "DS-12", "src": "media/ledger-design-system/DS-12.webp?v=870a0a63", "caption": "Wallet Card: two themes so two wallets never look alike, and hidden balances keep the card height.", "w": 3008, "h": 2668}]}, {"id": "patterns", "heading": "Usage previews", "body": ["Core moments from the app and the admin portal, rebuilt from library instances only."], "images": [{"slot": "DS-14", "src": "media/ledger-design-system/DS-14.webp?v=31afc250", "caption": "Sign up, wallets, history, result: four moments from the shipped app.", "kind": "preview", "w": 3008, "h": 2081}, {"slot": "DS-15", "src": "media/ledger-design-system/DS-15.webp?v=fa25fead", "caption": "The admin portal from the same parts, with every collection set to Desktop.", "kind": "preview", "w": 3008, "h": 2268}, {"slot": "DS-16", "src": "media/ledger-design-system/DS-16.webp?v=f2e65ece", "caption": "Review before you act: the modal names the merchant and the consequence.", "kind": "preview", "w": 3008, "h": 2220}]}, {"id": "release", "heading": "Release phases", "steps": [{"title": "v0.1 Foundations", "body": "Paint styles became primitives and roles, Mobile and Desktop modes for type, spacing and size, and text that passes AA."}, {"title": "v0.2 Money", "body": "Wallet Card, Transaction Row, Entity Tile, Status Pill, Quick Action and Result Status."}, {"title": "v0.3 Onboarding and segments", "body": "Input Field, OTP Cell, Segment Card and segment colours, Mobile Header and Bottom Navigation."}, {"title": "v0.4 Admin portal", "body": "Sidebar, Web Top Bar, Tabs, KPI Card, Table Row and Modal for approvals."}, {"title": "v1.0 Dark mode and governance", "body": "Dark values for every role, the migration map from paint styles and health metrics per release."}], "body": ["Ledger followed the roadmap: the money surfaces first, then onboarding and segments, then the admin portal. A migration map moves each paint style to its role, and nothing is deleted until the last instance has moved. Major versions ship with that map; minor versions are additive; patches are visual fixes."]}, {"id": "results", "heading": "Validation & results", "compare": {"before": ["64% raw fills, 128 unique hex values", "8 appearance-named paint styles, 1 variable", "\"Light blue\" storing navy", "0 of 17,644 text layers styled, 10 families, 18 sizes down to 6px", "46 radii", "623 uses of \"Component 1\", parts redrawn per product", "7 failing text pairs"], "after": ["0 raw fills and 0 unstyled text layers inside components", "185 scoped variables with web, iOS and Android code syntax", "Role names that say what a colour is for", "1 family through variables, 14 styles, 10px floor", "8 radius tokens", "25 documented components shared by app and portal", "16 of 16 checked pairs pass AA in both modes"]}, "images": [{"slot": "DS-19", "src": "media/ledger-design-system/DS-19.webp?v=d6081683", "caption": "Contribution path and four health metrics checked every release.", "w": 3008, "h": 1094}]}, {"id": "governance", "heading": "Governance", "body": ["One owner and a short contribution path: propose with a real screen, check whether a role, segment or variant already covers it, build with tokens only in both platform modes, document, and release with a changelog line. Four numbers per release: raw fills, styled text, AA coverage and detach rate.", "VERIFY: add an adoption or delivery-speed figure once product files have moved onto Ledger. Until then this section reports what was built and measured."]}, {"id": "team", "heading": "Team members", "list": ["Damilola Olayiwola: Lead Product Designer and design system owner", "Supporting designers, product and engineering at Baige"]}]}];
  const REL = {"signal-design-system":["vervemobile","VerveMobile"],"corridor-design-system":["quickteller-remit","QuickTeller Remit"],"ledger-design-system":["baige-waas","Baige WaaS"]};
  const e = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const md = s => e(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const S = (label, head, body) => `<div class="rc"><p class="rc-l">${e(label)}</p>${head?`<h2 class="rc-h">${e(head)}</h2>`:""}${body}</div>`;
  const P = a => (a||[]).map(t=>`<p>${md(t)}</p>`).join("");
  const UL = a => `<ul>${a.map(t=>`<li>${md(t)}</li>`).join("")}</ul>`;
  const build = o => {
    let ex = 0, us = 0;
    const secs = [{t:"hr"}];
    const img = (im, sec) => {
      const use = im.kind === "preview";
      secs.push({t:"img", src:im.src, w:im.w, h:im.h, alt:im.caption, cap:im.caption,
        n: use ? `Usage ${String(++us).padStart(2,"0")}` : `Excerpt ${String(++ex).padStart(2,"0")}`});
    };
    secs.push({t:"img", src:o.cover.src, w:o.cover.w, h:o.cover.h, alt:o.cover.alt});
    secs.push({t:"html", l:"At a glance", h:`<div class="rc"><div class="rstats">${o.glance.map((g,i)=>`<div class="rs"><b style="color:${["#F16001","#26bfcb","#1bde6c","#ffc800"][i%4]}">${e(g.value)}</b><span>${e(g.label)}</span></div>`).join("")}</div></div>`});
    for (const s of o.sections) {
      let body = "";
      if (s.id === "role") body += `<p class="rc-role">${o.roles.map(e).join(" | ")}</p>`;
      body += P(s.body);
      if (s.list) body += UL(s.list);
      if (s.cards) body += `<div class="rgrid">${s.cards.map(c=>`<div><b>${e(c.title)}</b><span>${md(c.body)}</span></div>`).join("")}</div>`;
      if (s.steps) body = `<ol class="rphase${s.steps.length>4?" r5":""}">${s.steps.map(x=>`<li><b>${e(x.title)}</b><span>${md(x.body)}</span></li>`).join("")}</ol>` + body;
      if (s.compare) body += `<div class="rba"><div><p class="rc-l">Before</p>${UL(s.compare.before)}</div><div><p class="rc-l">After</p>${UL(s.compare.after)}</div></div>`;
      if (s.id === "role" && REL[o.slug]) body += `<p><a class="rel-link" href="#work/${REL[o.slug][0]}">See the ${e(REL[o.slug][1])} product case study →</a></p>`;
      const head = s.id==="audit" ? "" : "";
      secs.push({t:"html", l:s.heading, h:S(s.heading, head, body)});
      (s.images||[]).forEach(im => img(im, s));
    }
    const toc = secs.map((x,i)=> x.t==="html" && x.l && x.l!=="At a glance" ? [x.l,i] : null).filter(Boolean);
    CASES.push({slug:o.slug, co:o.client, yr:o.year, site:"", title:o.title, sub:o.intro, toc, secs, thumb:o.cover.src, cover:o.cover.src, frame:"ds-v2"});
    return CASES.length-1;
  };
  DS_SRC.forEach(build);
  window.DS_BUILD = build;
  window.DS_REL = Object.fromEntries(Object.entries(REL).map(([k,[v]])=>[v,k]));
})();

/* ===== Motion layer ===== */
const Motion = (() => {
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const FINE = matchMedia("(hover: hover) and (pointer: fine)").matches;
  let lenis = null, io = null;

  /* Koto-style depth: media drifts inside its frame; offset tiles float at their own speed */
  const para = (() => {
    let items = [], vis = new Set(), pio = null, H = innerHeight, last = -1, bound = false;
    addEventListener("resize", () => { H = innerHeight; last = -1; }, {passive:true});
    function mount(root){
      if(pio) pio.disconnect(); vis.clear(); last = -1;
      items = [...root.querySelectorAll(".kpg .pg-t")].map(el => ({el, m:el.querySelector(".pg-m"), sp:+(el.dataset.sp||0)}));
      if(RM || !items.length) return;
      pio = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? vis.add(e.target) : vis.delete(e.target)), {rootMargin:"20% 0px"});
      items.forEach(it => pio.observe(it.el));
      if(!lenis && !bound){ bound = true; addEventListener("scroll", tick, {passive:true}); }
      tick(true);
    }
    function tick(force){
      if(!vis.size) return;
      const y = scrollY; if(y === last && force !== true) return; last = y;
      for(const it of items){
        if(!vis.has(it.el)) continue;
        const r = it.el.getBoundingClientRect();
        const p = Math.max(-1, Math.min(1, ((r.top + r.height/2) - H/2) / (H/2 + r.height/2)));  /* -1 above .. 1 below */
        it.m.style.transform = `translate3d(0,${(p*-7).toFixed(2)}%,0) scale(1.16)`;

  /* Smooth scroll (Lenis) */

      lenis = new Lenis({lerp:0.075, wheelMultiplier:0.95, touchMultiplier:1.4, smoothWheel:true, syncTouch:false});
      const raf = t => { lenis.raf(t); para.tick(); requestAnimationFrame(raf); };
      requestAnimationFrame(raf);

  }
  const top = () => lenis ? lenis.scrollTo(0,{immediate:true}) : scrollTo(0,0);

  /* Split words, keeping inline tags */
  function split(el){
    if(el.dataset.split) return; el.dataset.split = 1;
    let i = 0;
    const walk = node => {
      [...node.childNodes].forEach(n => {
        if(n.nodeType === 3){
          const parts = n.textContent.split(/(\s+)/);
          const frag = document.createDocumentFragment();
          parts.forEach(p => {
            if(!p) return;
            if(/^\s+$/.test(p)){ frag.appendChild(document.createTextNode(p)); return; }
            const o = document.createElement("span"); o.className = "sw";
            const s = document.createElement("span"); s.textContent = p; s.style.setProperty("--wi", i++);
            o.appendChild(s); frag.appendChild(o);
          });
          n.replaceWith(frag);
        } else if(n.nodeType === 1 && !n.classList.contains("sw") && !["SVG","IMG","BUTTON"].includes(n.tagName.toUpperCase())) walk(n);
      });
    };
    walk(el);
  }

  /* Reveal on scroll */
  function observe(root){
    if(trail) trail.mount(root);
    if(io) io.disconnect();
    const SPLIT = ".hero .label,.lede,.about .big,.tests .big,.pg-title,.cs-h h1,.cs-live .tw-text-\\[28px\\],.cases>.label";
    const RV = ".hero .rot,.para,.shorts,.side .marker,.chips,.case,.cs-live,.cs-h .row,.cs-h .sub,.cs-hr,.cs-toc a,.cs-next,.cs-back,.sect,.rgrp,.card,.tool,.photos figure,.portrait-f,.tcta,.intro .pills,.pg-sec>.label,.kmeta";
    videos(root);
    if(RM){ root.querySelectorAll(".cs-img,.kpg .pg-t").forEach(e=>e.classList.add("in")); return; }
    root.querySelectorAll(SPLIT).forEach(split);
    const groups = new Map();
    root.querySelectorAll(RV).forEach(el => {
      el.classList.add("rv");
      const p = el.parentElement; const n = groups.get(p) || 0; groups.set(p, n+1);
      el.style.setProperty("--i", Math.min(n, 14));
    });
    root.querySelectorAll(SPLIT).forEach(el => el.classList.add("rvs"));
    io = new IntersectionObserver(es => es.forEach(e => {
      if(e.isIntersecting){ e.target.classList.add("in"); if(e.target.matches(".kg,.kj")) [...e.target.children].forEach(c=>c.classList.add("in")); io.unobserve(e.target); }
    }), {rootMargin:"0px 0px -8% 0px", threshold:0.01});
    root.querySelectorAll(".rv,.rvs,.cs-img,.kpg .kg,.kpg .kj").forEach(el => io.observe(el));
    root.querySelectorAll(".kpg .kg,.kpg .kj").forEach(row => [...row.children].forEach((t,k) => t.style.setProperty("--k", k)));
    para.mount(root);

  /* Lazy videos: load near viewport, play only while visible */
  let vio;
  function videos(root){
    if(vio) vio.disconnect();
    const vids = root.querySelectorAll("video.lazyv");
    if(!vids.length) return;
    vio = new IntersectionObserver(es => es.forEach(e => {
      const v = e.target;
      if(e.isIntersecting){
        if(!v.src){ v.src = v.dataset.src; }
        if(RM){ v.controls = true; return; }
        const p = v.play(); if(p && p.catch) p.catch(()=>{});
      } else if(!v.paused) v.pause();
    }), {rootMargin:"200px 0px", threshold:0.15});
    vids.forEach(v => vio.observe(v));
  }
  function lock(on){
    if(lenis){ on ? lenis.stop() : lenis.start(); }
    document.documentElement.style.overflow = on ? "hidden" : "";
  }

  /* Cursor, hover preview, magnetic */
  function initPointer(){
    if(RM || !FINE) return;
    document.documentElement.classList.add("has-cur");
    const cur = document.createElement("div"); cur.className = "cur"; cur.innerHTML = '<span class="lbl">View</span>';
    const pv = document.createElement("div"); pv.className = "pv"; pv.innerHTML = '<img alt="">';
    document.body.append(pv, cur);
    const pimg = pv.firstChild;
    let mx = innerWidth/2, my = innerHeight/2, cx = mx, cy = my, px = mx, py = my;
    addEventListener("mousemove", e => { mx = e.clientX; my = e.clientY; }, {passive:true});
    document.addEventListener("mouseleave", () => cur.classList.add("hide"));
    document.addEventListener("mouseenter", () => cur.classList.remove("hide"));
    const loop = () => {
      cx += (mx-cx)*.35; cy += (my-cy)*.35; px += (mx-px)*.12; py += (my-py)*.12;
      cur.style.transform = `translate(${cx}px,${cy}px)`;
      pv.style.transform = pv.classList.contains("on") ? `translate(${px}px,${py}px) rotate(${(mx-px)*.04}deg)` : `translate(${px}px,${py}px) scale(.6) rotate(-4deg)`;
      requestAnimationFrame(loop);
    };
    loop();
    document.addEventListener("mouseover", e => {
      const v = e.target.closest("[data-cur]"), a = e.target.closest("a,button,[role=button]");
      cur.classList.toggle("view", !!v);
      cur.classList.toggle("link", !v && !!a);
      if(v) cur.querySelector(".lbl").textContent = v.dataset.cur;
      const c = e.target.closest("[data-cover]:not(.gal *)");
      if(c){ if(pimg.getAttribute("src") !== c.dataset.cover) pimg.src = c.dataset.cover; pv.classList.add("on"); }

      });
    }, {passive:true});
    document.addEventListener("mouseover", e => { const m = e.target.closest("[data-mag]"); if(m) m.classList.add("mag-on"); });
    document.addEventListener("mouseout", e => { const m = e.target.closest("[data-mag]"); if(m && !m.contains(e.relatedTarget)){ m.classList.remove("mag-on"); m.style.transform = ""; } });
  }

  /* Reading progress on case studies */

  function initProgress(){

  /* Page transitions */
  let curtain, busy = false;
  function go(renderFn){
    if(RM || !curtain){ renderFn(); top(); return; }
    if(busy){ renderFn(); top(); return; }

  }

  /* Intro loader — runs on every site start-up (not on page-to-page navigation).
     The "More than Design → More about Dammy" line sits bottom-left and finishes its swap well before the count hits 100. */
  function intro(done){
    const l = document.createElement("div"); l.className = "intro-l" + (RM ? " rm" : ""); l.setAttribute("aria-hidden","true");
    l.innerHTML = `<div class="top"><span>Dammy Olayiwola</span><span>Portfolio ©2026</span></div>
      <div class="foot">
        <div class="lrot"><span class="m"><span>More</span></span><span class="win"><span class="trk"><span>than Design</span><span>about Dammy</span></span></span></div>
        <div class="cntw"><span class="lab">Loading</span><span class="cnt">0<i>%</i></span></div>
      </div><span class="bar"></span>`;
    document.body.appendChild(l);

    requestAnimationFrame(() => l.classList.add("s1"));          /* line rises in */
    setTimeout(() => l.classList.add("s2"), RM ? 900 : 1000);     /* swap to "about Dammy" — done by ~1.8s */
    const curve = k => k < .45 ? .62*(1-Math.pow(1-k/.45,2)) : k < .6 ? .62 + .06*((k-.45)/.15) : .68 + .32*(1-Math.pow(1-(k-.6)/.4,3));
    const tick = t => {
      const k = Math.min(1, (t-t0)/D), e = curve(k);
      cnt.firstChild.nodeValue = Math.round(e*100); bar.style.transform = `scaleX(${e})`;
      if(k < 1) requestAnimationFrame(tick);
      else setTimeout(() => { l.classList.add("out"); done(); setTimeout(() => l.remove(), 1100); }, 280);
    };
    requestAnimationFrame(tick);
  }

  /* Image trail on the hero white space (Justin Hayes–style): images pop in under the cursor and drift away */
  let trail = null;
  function initTrail(){
    if(RM) return;
    const pics = ((typeof MEDIA !== "undefined" && MEDIA.trail) || []).map(([src,w,h]) => { const im = new Image(); im.decoding = "async"; im.src = src; return {src,w,h}; });
    if(!pics.length) return;
    let zone = null, layer = null, lx = -999, ly = -999, z = 1, n = 0, armed = false, hint = null;
    const spawn = (x, y) => {
      const r = zone.getBoundingClientRect(); const p = pics[n++ % pics.length];
      const w = Math.round(170 + Math.random()*70), h = Math.round(w * p.h / p.w);
      const el = document.createElement("img"); el.className = "tr-i"; el.src = p.src; el.alt = "";
      el.style.cssText = `width:${w}px;height:${h}px;left:${x - r.left - w/2}px;top:${y - r.top - h/2}px;z-index:${z++};--rot:${(Math.random()*12-6).toFixed(1)}deg`;
      layer.appendChild(el);
      requestAnimationFrame(() => el.classList.add("on"));
      setTimeout(() => { el.classList.add("off"); setTimeout(() => el.remove(), 700); }, 950);
      if(hint){ hint.classList.add("gone"); hint = null; }
    };
    const move = (x, y) => {
      if(!armed || !zone || !zone.isConnected) return;
      const r = zone.getBoundingClientRect();
      if(x < r.left || x > r.right || y < r.top || y > r.bottom) return;
      if(Math.hypot(x-lx, y-ly) < 95) return;
      lx = x; ly = y; spawn(x, y);
    };
    addEventListener("mousemove", e => move(e.clientX, e.clientY), {passive:true});
    addEventListener("touchstart", e => { const t = e.touches[0]; if(!zone || !zone.isConnected) return; const r = zone.getBoundingClientRect();
      if(t.clientY < r.top || t.clientY > r.bottom) return; for(let i=0;i<3;i++) setTimeout(()=>spawn(t.clientX + (i-1)*60, t.clientY + (i%2?-30:20)), i*110); }, {passive:true});
    trail = {
      mount(root){
        zone = root.querySelector(".tzone"); layer = zone ? zone.querySelector(".tlayer") : null; hint = zone ? zone.querySelector(".thint") : null;
        if(!zone) return;
      },
      arm(){ armed = true; }
    };
  }

  function init(){
    curtain = document.createElement("div"); curtain.className = "curtain"; curtain.setAttribute("aria-hidden","true");
    document.body.appendChild(curtain);
    initScroll(); initPointer(); initProgress(); initTrail();
  }
  return {init, observe, go, intro, scrollToEl, top, lock, RM, armTrail: () => trail && trail.arm()};
})();

const VAULT = (()=>{
  const L = window.DS_LOCK || {items:[]}, items = Object.fromEntries(L.items.map(x=>[x.slug,x]));
  const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  let key = null; const blobs = new Map();
  async function derive(code){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(L.salt), iterations:L.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);

    if(key) return true;
    if(!/^\d{4}$/.test(code) || !crypto.subtle) return false;
    try{
      const k = await derive(code);
      const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(L.iv)}, k, b64(L.ct));
      const list = JSON.parse(new TextDecoder().decode(pt));
      key = k;
      list.forEach(o => { if(!(o.slug in CASE)) CASE[o.slug] = window.DS_BUILD(o); });
      try{ sessionStorage.setItem("dsk", code); }catch(e){}
      return true;
    }catch(e){ return false; }
  }

/* FLIP core: snapshot -> mutate -> invert -> play */
const EASE = "cubic-bezier(.76,0,.24,1)", EASE_OUT = "cubic-bezier(.16,1,.3,1)";
function flipGrid(grid, mutate, opt={}){
  const g0 = grid.getBoundingClientRect(), h0 = grid.offsetHeight, snap = new Map();
  grid.querySelectorAll(".case:not(.ghost)").forEach(el => snap.set(el.dataset.k, {el, r:el.getBoundingClientRect(), t:el.querySelector(".th").getBoundingClientRect(), x:el.querySelector(".tx").getBoundingClientRect()}));
  grid.querySelectorAll(".ghost").forEach(n=>n.remove());
  const keep = mutate(snap);              // returns Set of keys still present
  if(Motion.RM || !grid.animate) return;
  const g1 = grid.getBoundingClientRect(), h1 = grid.offsetHeight, D = opt.dur || 820;
  grid.classList.add("flipping");
  /* leavers: ghost at old spot, shrink + fade */
  snap.forEach((s,k) => {
    if(keep.has(k)) return;
    const gh = s.el.cloneNode(true); gh.classList.add("ghost"); gh.removeAttribute("href"); gh.setAttribute("aria-hidden","true");
    Object.assign(gh.style,{position:"absolute",left:(s.r.left-g1.left)+"px",top:(s.r.top-g1.top)+"px",width:s.r.width+"px",height:s.r.height+"px",margin:0,pointerEvents:"none"});
    grid.appendChild(gh);
    gh.animate([{opacity:1,transform:"none",filter:"blur(0)"},{opacity:0,transform:"translateY(-14px) scale(.9)",filter:"blur(6px)"}],{duration:300,easing:EASE_OUT,fill:"forwards"}).onfinish=()=>gh.remove();
  });
  /* stayers + enterers */
  let i = 0, n = 0;
  grid.querySelectorAll(".case:not(.ghost)").forEach(el => {
    const s = snap.get(el.dataset.k), th = el.querySelector(".th"), tx = el.querySelector(".tx"), delay = (i++)*(opt.stagger ?? 28);
    if(s && keep.has(el.dataset.k)){
      const t = th.getBoundingClientRect(), x = tx.getBoundingClientRect();
      const dx=s.t.left-t.left, dy=s.t.top-t.top, sx=s.t.width/t.width, sy=s.t.height/t.height;
      if(Math.abs(dx)+Math.abs(dy)+Math.abs(sx-1)+Math.abs(sy-1) < .5) return;
      th.animate([{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`},{transform:"none"}],{duration:D,delay,easing:EASE,fill:"backwards"});
      const tdx=s.x.left-x.left, tdy=s.x.top-x.top;
      if(opt.view) tx.animate([{opacity:1,transform:`translate(${tdx}px,${tdy}px)`},{opacity:0,offset:.35},{opacity:0,transform:"none",offset:.6},{opacity:1,transform:"none"}],{duration:D,delay,easing:EASE,fill:"backwards"});
      else tx.animate([{transform:`translate(${tdx}px,${tdy}px)`},{transform:"none"}],{duration:D,delay,easing:EASE,fill:"backwards"});
    } else {
      const d = 70 + (n++)*40;
      th.animate([{opacity:0,transform:"translateY(42px) scale(.86)",filter:"blur(8px)"},{opacity:1,transform:"none",filter:"blur(0)"}],{duration:760,delay:d,easing:EASE_OUT,fill:"backwards"});
      tx.animate([{opacity:0,transform:"translateY(16px)"},{opacity:1,transform:"none"}],{duration:620,delay:d+80,easing:EASE_OUT,fill:"backwards"});
    }
  });
  grid.style.overflow = "visible";
  const ha = grid.animate([{height:h0+"px"},{height:h1+"px"}],{duration:D,easing:EASE});
  clearTimeout(grid._ft); grid._ft = setTimeout(()=>grid.classList.remove("flipping"), D + i*(opt.stagger ?? 28) + 200);
  ha.onfinish = () => grid.style.overflow = "";
}

  const media = m.v ? Vid(m, `${m.co}: ${m.cap}`) : `<img src="${m.src||m.img}" alt="${esc(m.co?`${m.co}: ${m.cap}`:"Playground shot")}" loading="lazy" decoding="async" width="${m.w}" height="${m.h}">`;

  const pl = place ? `grid-column:${place.c};${place.o?`margin-top:${place.o};`:""}` : "";
  return `<figure class="pg-t${m.v?" is-v":""}${place&&place.o?" off":""}" ${place&&place.sp?`data-sp="${place.sp}"`:""} style="flex:${(m.w/m.h).toFixed(4)} 1 0;aspect-ratio:${m.w}/${m.h};${pl}"><button class="pg-hit" data-lb="${i}" data-cur="${m.v?"Play":"View"}" aria-label="Open ${esc(m.co?`${m.co}, ${m.cap}`:"shot "+(i+1))} full screen"></button><div class="pg-m">${media}</div>${cap}<span class="pg-n mono" aria-hidden="true">${String(i+1).padStart(2,"0")}</span></figure>`;
}
function ratio(t){ return t.img ? t.w/t.h : t.dir==="row" ? t.kids.reduce((a,k)=>a+ratio(k),0) : 1/t.kids.reduce((a,k)=>a+1/ratio(k),0); }
function Tree(t){
  if(t.img) return Tile(t);
  if(t.dir==="row") return `<div class="jrow">${t.kids.map(k=> k.img ? Tile(k) : `<div class="jcol" style="flex:${ratio(k).toFixed(4)} 1 0">${k.kids.map(Tree).join("")}</div>`).join("")}</div>`;
  return t.kids.map(Tree).join("");
}
function JRows(items, sizes){ let out="", i=0, k=0; while(i<items.length){ const n=sizes[k++%sizes.length]; out+=`<div class="jrow">${items.slice(i,i+n).map(m=>Tile(m)).join("")}</div>`; i+=n; } return out; }
/* Koto-style editorial flow: motion and stills interleaved on a 12-col grid, with offsets and justified runs */
function Playground(){
  LB = [];
  const mot = id => MEDIA.motion.find(m=>m.id===id), st = id => MEDIA.stills.find(m=>m.id===id);
  const flat = t => t.img ? [t] : t.kids.flatMap(flat), A = flat(MEDIA.archive);
  const G = (...cells) => `<div class="kg">${cells.map(([m,c,o,sp])=>Tile(m,0,{c,o,sp})).join("")}</div>`;
  const J = (...ms) => `<div class="jrow kj${ms.length>3?" many":""}">${ms.map(m=>Tile(m)).join("")}</div>`;
  const full = (m) => G([m,"1 / -1"]);
  const rows = [
    full(mot("altovida")),
    G([st("centric-social"),"1 / span 7"],[mot("coin"),"9 / span 4","14vw",-1]),
    J(A[0],A[1]),
    G([mot("riur"),"3 / span 8"]),
    G([st("intelai-start"),"1 / span 5","10vw",1],[st("intelai-integrations"),"7 / span 6"]),
    J(A[2],A[3],A[4]),
    full(A[25]),
    G([mot("dropcart"),"1 / span 7"],[st("centric-bento"),"8 / span 5","12vw",-1]),
    J(A[11],A[12],A[13],A[14],A[15]),
    G([st("pressone-campaign"),"5 / span 8"]),
    J(A[5],A[10]),
    full(mot("quickteller-remit")),
    J(A[6],A[7],A[8],A[9]),
    G([st("centric-teams"),"1 / span 5"],[st("centric-vision"),"6 / span 7","9vw",1]),
    G([A[16],"2 / span 10"]),
    G([st("intelai-copilot"),"1 / span 7","6vw",1],[mot("vervemobile"),"8 / span 5"]),
    J(A[17],A[18]),
    full(A[26]),
    G([st("pressone-callflow"),"1 / span 6"],[st("pressone-flows"),"7 / span 6","10vw",-1]),
    J(A[19],A[20],A[21]),
    G([A[22],"3 / span 8"]),
    G([st("centric-fs"),"6 / span 7"]),
    J(A[23],A[24]),
    G([A[27],"1 / span 6"],[A[28],"7 / span 6","8vw",1]),
    G([A[29],"1 / span 7","4vw",-1],[A[30],"8 / span 5"]),
    full(A[31])
  ].join("");
  const nV = MEDIA.motion.length, nS = LB.length - nV;
  return Header("Back") + `<section class="pg kpg">
    <h1 class="big pg-title">Part <b>Flex</b>, Part <b>Flow</b>.<br>Just a handful of shots I find beautiful.</h1>
    <div class="kmeta mono"><span>${String(LB.length).padStart(2,"0")} pieces</span><span><i class="dot"></i>${String(nV).padStart(2,"0")} in motion</span><span>${nS} stills</span><span class="kh">Scroll ↓</span></div>
    <div class="kflow">${rows}</div>
  </section>
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Media viewer" hidden>
    <button class="lb-x mono" data-lbx aria-label="Close">Close ✕</button>
    <button class="lb-p" data-lbp aria-label="Previous">←</button><button class="lb-n" data-lbn aria-label="Next">→</button>
    <div class="lb-stage" id="lbs"></div>
    <div class="lb-meta mono"><span id="lbc"></span><span id="lbt"></span></div>
  </div>`;
}
let lbI = 0, lbLast = null;
function lbShow(i){
  lbI = (i + LB.length) % LB.length; const m = LB[lbI], st = $("#lbs");
  st.innerHTML = m.v ? `<video src="${m.v}" poster="${m.src}" autoplay muted loop playsinline ${Motion.RM?"controls":""}></video>` : `<img src="${m.src||m.img}" alt="${esc(m.co?`${m.co}: ${m.cap}`:"Playground shot")}">`;
  $("#lbc").textContent = String(lbI+1).padStart(2,"0")+" / "+String(LB.length).padStart(2,"0");
  $("#lbt").textContent = m.co ? `${m.co} — ${m.cap}` : "";
  st.classList.remove("in"); requestAnimationFrame(()=>st.classList.add("in"));
}
function lbOpen(i){ lbLast = document.activeElement; const lb = $("#lb"); lb.hidden = false; requestAnimationFrame(()=>lb.classList.add("on")); document.documentElement.classList.add("lb-open"); Motion.lock(true); lbShow(i); lb.querySelector(".lb-x").focus(); }
function lbClose(){ const lb = $("#lb"); if(!lb || lb.hidden) return; lb.classList.remove("on"); Motion.lock(false); document.documentElement.classList.remove("lb-open"); setTimeout(()=>{ lb.hidden = true; $("#lbs").innerHTML=""; }, 350); lbLast && lbLast.focus(); }
addEventListener("keydown", e => {
  const lb = $("#lb"); if(!lb || lb.hidden) return;
  if(e.key==="Escape") lbClose(); else if(e.key==="ArrowRight") lbShow(lbI+1); else if(e.key==="ArrowLeft") lbShow(lbI-1);
  else if(e.key==="Tab"){ const f=[...lb.querySelectorAll("button")]; const a=f.indexOf(document.activeElement); if(e.shiftKey && a<=0){ e.preventDefault(); f[f.length-1].focus(); } else if(!e.shiftKey && a===f.length-1){ e.preventDefault(); f[0].focus(); } }
});
let tx0 = null;
addEventListener("touchstart", e => { if(!$("#lb")?.hidden) tx0 = e.touches[0].clientX; }, {passive:true});
addEventListener("touchend", e => { if(tx0===null) return; const dx = e.changedTouches[0].clientX - tx0; tx0 = null; if(Math.abs(dx)>50) lbShow(lbI + (dx<0?1:-1)); }, {passive:true});

/* ===== Case study frames (Figma page 0:10) ===== */
function NextCard(n, m){
  return `<div class="cs-next${m?" m":""}"><p class="mono">Next →</p>
    <a class="nx" href="#work/${n.slug}" data-cur="Next"><img src="${n.thumb}" alt="" loading="lazy"><span>
      <b>${esc(n.title)}</b><small>${esc(n.co)} ~ ${n.yr}</small><span class="see">See case study →</span></span></a></div>`;
}
const SITE = {
  "pressone-community-platform":"https://pressone.africa/",
  "pressone-payment-exit-flows":"https://pressone.africa/",
  "quickteller-remit":"https://www.quickteller.com/",
  "vervemobile":"https://myverveworld.com/"
};
function CaseStudy(slug){
  const i = CASE[slug], c = CASES[i];
  const ORDER = [...new Set(["p","d","b"].flatMap(k=>WORK.filter(w=>w[4]===k && w[3] in CASE).map(w=>w[3])))];
  const oi = ORDER.indexOf(slug), n = oi<0 ? CASES[(i+1)%CASES.length] : CASES[CASE[ORDER[(oi+1)%ORDER.length]]];
  const hero = CASE_MOTION[slug];
  const toc = c.toc.map(t=>[t[0], t[1]===null?null:(hero && hero.mode!=="replace" && t[1]>=Math.max(1,c.secs.findIndex(s=>s.t==="img")) ? t[1]+1 : t[1])]).filter(t=>t[1]!==null).map(([l,s])=>`<a href="#work/${slug}" data-sec="s${s}"><span class="dash"></span>${esc(l)}</a>`).join("");
  const url = SITE[slug] || c.site;
  const site = url ? `<a class="pill mono" data-mag href="${esc(url)}" target="_blank" rel="noopener">Go to Website</a>` : "";
  const ds = (window.DS_REL||{})[slug];
  const rel = ds ? `<a class="pill mono" data-mag href="#work/${ds}">Design system ↗</a>` : "";
  let list = c.secs.slice();
  if(hero){
    const fi = list.findIndex(s=>s.t==="img");
    const vsec = {t:"vid", v:hero.v, src:hero.src, w:hero.w, h:hero.h, alt:hero.alt};
    if(hero.mode==="replace" && fi>=0) list[fi] = Object.assign(vsec,{l:list[fi].l}); else list.splice(fi>=0?fi:1,0,vsec);
  }
  const secs = list.map((s,k)=> s.t==="hr" ? `<hr class="cs-hr">`
    : s.t==="vid" ? `<figure class="cs-sec cs-img cs-vid" id="s${k}">${Vid(s, s.alt)}</figure>`
    : s.t==="img" ? `<figure class="cs-sec cs-img" id="s${k}"><img src="${s.src}" width="${s.w}" height="${s.h}" alt="${esc(s.alt)}" loading="${k<4?"eager":"lazy"}" decoding="async">${s.cap?`<figcaption class="cs-cap mono"><span>${esc(s.n||"")}</span>${esc(s.cap)}</figcaption>`:""}</figure>`
    : `<section class="cs-sec cs-live" id="s${k}">${s.h}</section>`).join("");
  return `<div class="csp">
    <aside class="cs-l"><a class="cs-back mono" href="#work"><span class="arr" aria-hidden="true">←</span>Back</a>
      <nav class="cs-toc mono" aria-label="On this page">${toc}</nav>${NextCard(n)}</aside>
    <article class="cs-c">
      <header class="cs-h"><div class="row"><span class="mono co">${esc(c.co)} ~ ${c.yr}</span><span class="pills-r">${rel}${site}</span></div><h1>${esc(c.title)}</h1>${c.sub?`<p class="sub">${esc(c.sub)}</p>`:""}</header>
      ${secs}${NextCard(n,1)}</article></div>`;
}
let tocObs;
function wireToc(){
  if(tocObs) tocObs.disconnect();
  const links=[...document.querySelectorAll(".cs-toc a")]; if(!links.length) return;
  const set=id=>links.forEach(a=>a.setAttribute("aria-current", a.dataset.sec===id));
  set(links[0].dataset.sec);
  const targets=links.map(a=>document.getElementById(a.dataset.sec)).filter(Boolean);
  tocObs=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting) set(e.target.id); }); },{rootMargin:"0px 0px -70% 0px"});
  targets.forEach(t=>tocObs.observe(t));
}

/* ========================= Router ========================= */
let rotTimer, ready = false;
function render(){
  let key = (location.hash||"").slice(1) || "home";
  let html;
  if(key.startsWith("work/") && hiddenCase(key.slice(5))) { key = "others"; history.replaceState(null,"","#others"); html = Shell(key, Work(key)); }
  else if(key.startsWith("work/") && key.slice(5) in CASE) html = CaseStudy(key.slice(5));
  else if(key.startsWith("work/") && VAULT.locked(key.slice(5))) html = Gate(key.slice(5));
  else if(FILTERS.some(f=>f[0]===key)) html = Shell(key, Work(key));
  else if(key==="profile") html = Profile();
  else if(key==="testimonials") html = Testimonials();
  else if(key==="playground") html = Playground();
  else { key="home"; html = Shell("home", Introduction()); }
  curKey = key;
  Motion.lock(false); document.documentElement.classList.remove("lb-open");
  $("#app").innerHTML = html;
  wireToc();
  if(ready) Motion.observe($("#app"));
  clearInterval(rotTimer);
  const rot = $("#rot");
  if(rot && !matchMedia("(prefers-reduced-motion: reduce)").matches) rotTimer = setInterval(()=>rot.classList.toggle("flip"), 3200);
}
let tt;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2200); }
document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]");
  if(c){ e.preventDefault(); navigator.clipboard.writeText(CONFIG.email).then(()=>toast("Email copied"), ()=>toast(CONFIG.email)); return; }
  if(e.target.closest("[data-unset]")){ e.preventDefault(); toast("Link not set yet"); return; }
  const fc = e.target.closest("[data-filter]");
  if(fc){ e.preventDefault(); const k = fc.dataset.filter; if(k!==curKey){ history.pushState(null,"","#"+k); if(applyFilter(k)) curKey = k; } return; }
  const lbt = e.target.closest("[data-lb]"); if(lbt){ e.preventDefault(); lbOpen(+lbt.dataset.lb); return; }
  if(e.target.closest("[data-lbx]") || e.target.id==="lb" || e.target.id==="lbs"){ lbClose(); return; }
  if(e.target.closest("[data-lbn]")){ lbShow(lbI+1); return; }
  if(e.target.closest("[data-lbp]")){ lbShow(lbI-1); return; }
  const t = e.target.closest("[data-sec]");
  if(t){ e.preventDefault(); const el = document.getElementById(t.dataset.sec); if(el) Motion.scrollToEl(el); }
});
let curKey = "";
addEventListener("hashchange", ()=>{
  const k = (location.hash||"").slice(1) || "home";
  if(isFilter(k) && isFilter(curKey) && applyFilter(k)){ curKey = k; return; }
  Motion.go(render);
});
Motion.init();
render();
Motion.intro(()=>{ ready = true; Motion.observe($("#app")); setTimeout(Motion.armTrail, 600); });

</script>
